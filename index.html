<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE CHALLENGE V19.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.2), rgba(10,5,26,0.8)); z-index: -1; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 1.5rem; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: 0.2s; font-weight: 900; font-style: italic; text-transform: uppercase; border: none; touch-action: manipulation; }
        .fn-button:active { transform: scale(0.95); }
        .prog-bar-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.4s ease; box-shadow: 0 0 15px rgba(34,197,94,0.5); }
        .btn-correct { background: #22c55e !important; color: #000 !important; box-shadow: 0 0 20px #22c55e; }
        .btn-wrong { background: #ef4444 !important; color: #fff !important; animation: shake 0.3s; box-shadow: 0 0 20px #ef4444; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        .scroll-v { overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="flex flex-col h-full">
    <div id="bg-container"></div><div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-4"></div>

    <script>
        let audioCtx;
        let DATA = [];
        let state = {
            v: 'menu', sub: '', items: [], total: 0, ok: 0, status: 'idle', sel: null, curK: '',
            done: JSON.parse(localStorage.getItem('m_d_v19') || '{}'),
            errs: JSON.parse(localStorage.getItem('m_e_v19') || '[]')
        };

        function playSound(freq, type, dur) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        Papa.parse("vragen.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                DATA = res.data.filter(r => r.Vraag && r.Antwoord).map(r => ({
                    s: r.Vak ? r.Vak.toUpperCase() : "VAK",
                    t: r.Thema || "Algemeen",
                    q: r.Vraag, a: r.Antwoord,
                    d: [r["Fout 1"], r["Fout 2"], r["Fout 3"]].filter(x => x && x.trim() !== "")
                }));
                render();
            }
        });

        function render() {
            const app = document.getElementById('app');
            if (state.v === 'menu') {
                const subs = [...new Set(DATA.map(i => i.s))];
                app.innerHTML = `<div class="glass w-full max-w-md p-6 text-center">
                    <h1 class="text-4xl text-yellow-400 font-black italic mb-2 tracking-tighter">MASSINE</h1>
                    <p class="text-xs font-bold text-white/50 mb-6 tracking-widest uppercase">Elite Learning System</p>
                    <button onclick="state.v='boss';render()" class="fn-button w-full bg-red-600 py-6 mb-8 text-xl shadow-lg flex items-center justify-center gap-3">
                        <span>🔥 BOSS LEVEL</span>
                        <span class="bg-black/20 px-3 py-1 rounded-full text-sm">${state.errs.length}</span>
                    </button>
                    <div class="grid grid-cols-2 gap-4">${subs.map(sub => `
                        <button onclick="state.sub='${sub}';state.v='list';render()" class="fn-button bg-white/10 py-12 text-xl border border-white/5 flex flex-col items-center gap-2">
                            <span class="text-sm opacity-50">VAK</span>
                            <span>${sub}</span>
                        </button>`).join('')}</div>
                </div>`;
            } else if (state.v === 'list') {
                const themes = [...new Set(DATA.filter(i => i.s === state.sub).map(i => i.t))];
                app.innerHTML = `<div class="glass w-full max-w-md p-4 flex flex-col h-[90dvh]">
                    <div class="flex justify-between items-center mb-6 px-2">
                        <button onclick="state.v='menu';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-xs">← MENU</button>
                        <span class="font-black italic text-yellow-400 uppercase tracking-widest">${state.sub}</span>
                    </div>
                    <div class="scroll-v px-2">${themes.map(t => {
                        const key = `${state.sub}-${t}`;
                        const isDone = state.done[key];
                        return `<div class="mb-4">
                            <button onclick="startQ('${state.sub}','${t}')" class="fn-button w-full py-6 bg-white/10 text-left pl-6 italic flex justify-between items-center pr-4">
                                <span>${t}</span>
                                <span>${isDone ? '✅' : '🎯'}</span>
                            </button>
                        </div>`;
                    }).join('')}</div>
                </div>`;
            } else if (state.v === 'boss') {
                const bSubs = [...new Set(state.errs.map(i => i.s))];
                app.innerHTML = `<div class="glass w-full max-w-md p-4 flex flex-col h-[90dvh]">
                    <button onclick="state.v='menu';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic mb-6 self-start uppercase text-xs">← BACK</button>
                    <h2 class="text-red-500 font-black mb-4 italic uppercase px-2 text-center text-2xl">REVENGE MODE</h2>
                    <div class="scroll-v">${state.errs.length ? bSubs.map(s => `
                        <div class="bg-white/5 p-2 mb-4 rounded-xl">
                            <div class="text-red-500 font-black p-2 italic mb-2 uppercase text-xs border-b border-white/10">${s}</div>
                            ${[...new Set(state.errs.filter(i=>i.s===s).map(i=>i.t))].map(t => `
                                <button onclick="startBossQ('${s}','${t}')" class="fn-button w-full py-4 mb-2 text-left pl-4 italic bg-red-900/20 flex justify-between pr-4">
                                    <span>${t}</span>
                                    <span class="text-xs bg-red-600 px-2 rounded-full">${state.errs.filter(x=>x.s===s&&x.t===t).length}</span>
                                </button>`).join('')}
                        </div>`).join('') : '<div class="text-center mt-20 opacity-30 italic">GEEN FOUTEN OM TE HERSTELLEN</div>'}</div>
                </div>`;
            } else if (state.v === 'quiz') {
                const q = state.items[0];
                const progress = ((state.total - state.items.length) / state.total) * 100;
                app.innerHTML = `<div class="glass w-full max-w-2xl p-6 flex flex-col h-[95dvh]">
                    <div class="flex justify-between font-black text-yellow-400 mb-2 uppercase text-[10px]">
                        <button onclick="state.v='menu';render()" class="text-red-500">ABORT</button>
                        <span class="tracking-widest">${state.ok} SCORE</span>
                    </div>
                    <div class="prog-bar-container"><div class="prog-bar-fill" style="width: ${progress}%"></div></div>
                    <div class="flex-grow flex flex-col justify-center">
                        <h2 class="text-2xl font-black italic mb-10 uppercase text-center leading-tight px-4">${q.q}</h2>
                        <div class="grid gap-4">${q.opts.map(o => {
                            let cl = "bg-white/5 border border-white/10";
                            if(state.status !== 'idle') {
                                if(o === q.a) cl = "btn-correct";
                                else if(o === state.sel) cl = "btn-wrong";
                                else cl = "opacity-20";
                            }
                            return `<button onclick="check('${o}')" class="fn-button py-6 text-lg ${cl}">${o}</button>`;
                        }).join('')}</div>
                    </div>
                    ${state.status !== 'idle' ? `<button onclick="next()" class="fn-button w-full bg-white text-black py-6 mt-8 text-xl animate-pulse">CONTINUE →</button>` : ''}
                </div>`;
            }
        }

        function startQ(s, t) {
            state.items = DATA.filter(i => i.s === s && i.t === t).map(i => ({...i, opts: [i.a, ...i.d].sort(()=>Math.random()-0.5)}));
            state.total = state.items.length; state.ok = 0; state.v = 'quiz'; state.curK = `${s}-${t}`; render();
        }

        function startBossQ(s, t) {
            state.items = state.errs.filter(i => i.s === s && i.t === t).map(i => ({...i, opts: [i.a, ...i.d].sort(()=>Math.random()-0.5)}));
            state.total = state.items.length; state.ok = 0; state.v = 'quiz'; state.curK = `BOSS-${s}-${t}`; render();
        }

        function check(o) {
            if(state.status !== 'idle') return;
            state.sel = o; const q = state.items[0];
            if(o === q.a) {
                state.status = 'correct'; state.ok++; playSound(660, 'sine', 0.15); confetti({particleCount:30, spread:50, origin:{y:0.8}});
                if(state.curK.startsWith('BOSS')) {
                    state.errs = state.errs.filter(i => i.q !== q.q);
                    localStorage.setItem('m_e_v19', JSON.stringify(state.errs));
                }
            } else {
                state.status = 'wrong'; playSound(150, 'sawtooth', 0.3);
                if(!state.errs.some(i => i.q === q.q)) {
                    state.errs.push(q); localStorage.setItem('m_e_v19', JSON.stringify(state.errs));
                }
            }
            render();
        }

        function next() {
            state.items.shift(); state.status = 'idle'; state.sel = null;
            if(!state.items.length) {
                if(!state.curK.startsWith('BOSS')) { state.done[state.curK] = true; localStorage.setItem('m_d_v19', JSON.stringify(state.done)); }
                state.v = state.curK.startsWith('BOSS') ? 'boss' : 'list';
                if(state.ok === state.total) confetti({particleCount:150, spread:100});
            }
            render();
        }
    </script>
</body>
</html>
