<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V17.18</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; -webkit-overflow-scrolling: touch; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; touch-action: manipulation; position: relative; overflow: hidden; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; margin-bottom: 0.5rem; }
        .lesson-progress-bar { position: absolute; bottom: 0; left: 0; height: 6px; background: #22c55e; z-index: 10; transition: width 0.5s ease-out; }
        .swipe-container { position: relative; width: 100%; height: 64px; margin-bottom: 8px; overflow: hidden; display: flex; align-items: center; flex-shrink: 0; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 50; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .swiped .swipe-actions { opacity: 1; pointer-events: auto; }
        .btn-reset { background: #3b82f6; height: 100%; padding: 0 24px; font-weight: 900; font-size: 0.8rem; color: white; text-transform: uppercase; border: none; }
        .swipe-main { width: 100%; height: 100%; transition: transform 0.2s ease-out; position: relative; }
        .swiped .swipe-main { transform: translateX(-80px); }
        .btn-correct-final { background-color: #22c55e !important; color: black !important; font-weight: 900; border: 3px solid white !important; }
        .btn-wrong-final { background-color: #ef4444 !important; color: white !important; animation: shake 0.3s; border: 3px solid white !important; }
        .btn-dimmed { opacity: 0.1 !important; pointer-events: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>
    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSound(f, t, d) {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
        }
        const MIJN_DATA = [
            {"s":"WO","t":"Lichaam","n":"Ademhaling","q":"Wat halen de longen uit de lucht?","a":"Zuurstof","d":["Koolstofdioxide","Water","Voedsel"]},
            {"s":"WO","t":"Lichaam","n":"Ademhaling","q":"Waarom heeft de luchtpijp kraakbeenringen?","a":"Zodat hij niet wordt dichtgedrukt","d":["Om harder te praten","Om slijm te maken","Om lucht te filteren"]},
            {"s":"WO","t":"Lichaam","n":"Ademhaling","q":"Waarop steunen de longen?","a":"Het middenrif","d":["De maag","De lever","De ribbenkast"]},
            {"s":"WO","t":"Lichaam","n":"Bloedsomloop","q":"Hoe vaak klopt het hart ongeveer per dag?","a":"Ruim 100.000 maal","d":["1.000 maal","70 maal","10.000 maal"]},
            {"s":"WO","t":"Lichaam","n":"Skelet","q":"Hoeveel botten heeft een volwassen mens?","a":"206","d":["32","100","500"]},
            {"s":"WO","t":"Lichaam","n":"Skelet (Kaart)","q":"Hoe heet het bot van het hoofd?","a":"Schedel","d":["Bekken","Borstbeen","Schouderblad"]},
            {"s":"WO","t":"Lichaam","n":"Skelet (Kaart)","q":"Welk bot loopt van de schouder naar het borstbeen?","a":"Sleutelbeen","d":["Rib","Opperarmbeen","Spaakbeen"]},
            {"s":"WO","t":"Lichaam","n":"Gewrichten","q":"Hoe heet het gladde oppervlak bij beenderen?","a":"Kraakbeen","d":["Een pees","Een spier","Een zenuw"]},
            {"s":"WO","t":"Lichaam","n":"Spijsvertering","q":"Hoe lang is de slokdarm ongeveer?","a":"25 cm","d":["5 meter","1,5 meter","10 cm"]},{"s":"WO","t":"Lichaam","n":"Spijsvertering","q":"Welk orgaan is ongeveer 5 meter lang?","a":"De dunne darm","d":["De dikke darm","de slokdarm","De maag"]},
            {"s":"FRANS","t":"Getallen","n":"1-20","q":"11","a":"onze","d":["dix","douze","seize"]},
            {"s":"FRANS","t":"Getallen","n":"1-20","q":"13","a":"treize","d":["trois","trente","seize"]},
            {"s":"FRANS","t":"Verbs","n":"Être","q":"ik ben","a":"je suis","d":["j'ai","tu es","il est"]},
            {"s":"TAAL","t":"Woordenschat","n":"Les 1","q":"de dader","a":"de schuldige","d":["het slachtoffer","de getuige","de politie"]},
            {"s":"TAAL","t":"Woordenschat","n":"Les 1","q":"het alibi","a":"bewijs van plek","d":["de smoes","de straf","het motief"]},
            {"s":"TAAL","t":"Woordenschat","n":"Les 6","q":"uniek","a":"er is er maar één","d":["normaal","gewoon","saai"]}
        ];
        let state = {
            view: 'landing', lessons: [], selectedSubject: '', status: 'idle', quizItems: [],
            totalInRound: 0, correctInRound: 0, selected: null,
            scores: JSON.parse(localStorage.getItem('m_scores_v17') || '{}'),
            wrongAnswers: JSON.parse(localStorage.getItem('m_wrongs_v17') || '[]')
        };
        function prepareData() {
            const map = {};
            MIJN_DATA.forEach(i => {
                const k = `${i.s}-${i.t}-${i.n}`;
                if (!map[k]) map[k] = { subject: i.s, theme: i.t, name: i.n, items: [] };
                map[k].items.push({ subject: i.s, theme: i.t, lesson: i.n, word: i.q, correct: i.a, options: [i.a, ...i.d].sort(() => Math.random() - 0.5) });
            });
            state.lessons = Object.values(map);
        }
        function render() {
            const c = document.getElementById('app');
            if (state.view === 'landing') {
                c.innerHTML = `<div class="glass w-full max-w-md p-8 text-center"><h1 class="text-4xl font-black italic uppercase text-yellow-400 mb-8">Massine's<br>Challenge</h1><button onclick="initAudio(); state.view='subjects'; render();" class="fn-button bg-yellow-400 text-black py-8 text-2xl">START MISSION</button></div>`;
            } else if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                c.innerHTML = `<div class="glass w-full max-w-md p-4"><h1 class="text-3xl text-yellow-400 mb-6 text-center font-black italic uppercase">Missions</h1><div class="grid gap-4"><button onclick="state.view='boss_menu'; render();" class="fn-button bg-orange-600 py-6 text-xl italic mb-2">🔥 BOSS LEVELS (${state.wrongAnswers.length}) 🔥</button><div class="subject-grid">${subs.map(s => { let icon = s.includes('WO')?'🌍':s.includes('FRANS')?'🇫🇷':'🇳🇱'; return `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-10 text-xl italic flex flex-col"><span class="text-4xl mb-2">${icon}</span><span>${s}</span></button>`; }).join('')}</div></div></div>`;
            } else if (state.view === 'boss_menu') {
                const wr = state.wrongAnswers; const bSubs = [...new Set(wr.map(i => i.subject))];
                c.innerHTML = `<div class="glass w-full max-w-md p-3"><div class="flex justify-between mb-4 px-2"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-xs">← BACK</button><h2 class="text-xl font-black italic uppercase text-orange-500">BOSS</h2></div><div class="scroll-area pb-10">${wr.length === 0 ? '<p class="text-center italic mt-10">Geen fouten!</p>' : bSubs.map(s => { const subWr = wr.filter(i => i.subject === s); const bL = [...new Set(subWr.map(i => i.lesson))]; return `<div class="theme-label bg-orange-600 mt-4">${s} (${subWr.length})</div>` + bL.map(n => `<button onclick="startBossQuiz('${s}','${n}')" class="fn-button bg-white/5 py-4 mb-2 text-left pl-6 italic border border-orange-900/30"><span>${n} (${subWr.filter(i=>i.lesson===n).length})</span></button>`).join(''); }).join('')}</div></div>`;
            } else if (state.view === 'lessons') {
                const f = state.lessons.filter(l => l.subject === state.selectedSubject); const t = [...new Set(f.map(l => l.theme))];
                c.innerHTML = `<div class="glass w-full max-w-md p-3"><div class="flex justify-between mb-4 px-2"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-xs">← BACK</button><h2 class="text-xl font-black italic uppercase">${state.selectedSubject}</h2></div><div class="scroll-area">${t.map(th => `<div class="theme-label">${th}</div>` + f.filter(l => l.theme === th).map(l => { const k = `${l.subject}-${l.theme}-${l.name}`; const id = 'id'+Math.random().toString(36).substr(2,5); return `<div class="swipe-container" id="container-${id}"><div class="swipe-actions"><button onclick="resetScore('${k}')" class="btn-reset">RESET</button></div><div class="swipe-main" id="${id}" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, '${id}')"><button onclick="startQuiz('${l.subject}','${l.theme}','${l.name}')" class="fn-button bg-white/10 py-5 text-left pl-6 italic relative"><span>${l.name}</span><div class="lesson-progress-bar" style="width: ${state.scores[k]?'100%':'0%'}"></div></button></div></div>`; }).join('')).join('')}</div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                c.innerHTML = `<div class="glass w-full max-w-4xl max-h-[95dvh] relative overflow-hidden flex flex-col p-4"><div class="flex justify-between items-center mb-4 flex-shrink-0"><button onclick="state.view='${state.currentKey.startsWith('BOSS')?'boss_menu':'lessons'}'; render();" class="text-red-500 font-black italic uppercase text-xs">STOP</button><div class="text-yellow-400 font-black italic uppercase">${state.correctInRound}/${state.totalInRound}</div></div><div class="scroll-area flex-grow pb-24"><h2 class="text-2xl text-center my-8 font-black italic uppercase leading-tight">${q.word}</h2><div class="grid gap-2">${q.options.map(o => { let cl = "bg-white/10"; if(state.status !== 'idle'){ if(o === q.correct) cl = "btn-correct-final"; else if(o === state.selected) cl = "btn-wrong-final"; else cl = "btn-dimmed"; } return `<button onclick="handleAnswer('${o}')" class="fn-button py-4 text-base italic ${cl}">${o}</button>` }).join('')}</div></div>${state.status !== 'idle' ? `<div class="absolute bottom-4 left-0 w-full px-4 z-50"><button onclick="nextQ()" class="bg-yellow-400 text-black py-5 fn-button italic font-black uppercase tracking-widest w-full">Next →</button></div>` : ''}</div>`;
            }
        }
        function startQuiz(s, t, n) { state.currentKey = `${s}-${t}-${n}`; state.quizItems = state.lessons.find(l => l.subject === s && l.theme === t && l.name === n).items.map(i => ({...i, f: 0})).sort(() => Math.random() - 0.5); state.totalInRound = state.quizItems.length; state.correctInRound = 0; state.view = 'quiz'; render(); }
        function startBossQuiz(s, n) { state.currentKey = `BOSS-${s}-${n}`; state.quizItems = state.wrongAnswers.filter(i => i.subject === s && i.lesson === n).map(i => ({...i, f: 0})).sort(() => Math.random() - 0.5); state.totalInRound = state.quizItems.length; state.correctInRound = 0; state.view = 'quiz'; render(); }
        function handleAnswer(o) {
            if (state.status !== 'idle') return; state.selected = o; const q = state.quizItems[0];
            if (o === q.correct) { state.status = 'correct'; state.correctInRound++; playSound(880, 'sine', 0.1); confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } }); if(state.currentKey.startsWith('BOSS')) { state.wrongAnswers = state.wrongAnswers.filter(i => i.word !== q.word); localStorage.setItem('m_wrongs_v17', JSON.stringify(state.wrongAnswers)); } }
            else { state.status = 'wrong'; playSound(220, 'square', 0.2); if (!state.wrongAnswers.some(i => i.word === q.word)) { state.wrongAnswers.push({...q}); localStorage.setItem('m_wrongs_v17', JSON.stringify(state.wrongAnswers)); } if(!state.currentKey.startsWith('BOSS')) { q.f = (q.f || 0) + 1; if (q.f < 2) state.quizItems.push({...q}); } }
            render();
        }
        function nextQ() { state.quizItems.shift(); state.status = 'idle'; state.selected = null; if (state.quizItems.length === 0) { if(!state.currentKey.startsWith('BOSS')) state.scores[state.currentKey] = true; localStorage.setItem('m_scores_v17', JSON.stringify(state.scores)); state.view = state.currentKey.startsWith('BOSS') ? 'boss_menu' : 'lessons'; } render(); }
        function resetScore(k) { delete state.scores[k]; localStorage.setItem('m_scores_v17', JSON.stringify(state.scores)); closeAllSwipes(); render(); }
        let sX = 0; function handleTS(e) { sX = e.touches[0].clientX; }
        function handleTM(e, id) { let d = sX - e.touches[0].clientX; let c = document.getElementById('container-' + id); if (d > 50) { closeAllSwipes(); c.classList.add('swiped'); } else if (d < -50) c.classList.remove('swiped'); }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(e => e.classList.remove('swiped')); }
        prepareData(); render();
    </script>
</body>
</html>
