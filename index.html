
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V10.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; overscroll-behavior-x: none; }
        
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat; transition: background-image 0.6s ease-in-out; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10, 5, 26, 0.05) 0%, rgba(10, 5, 26, 0.4) 100%); z-index: -1; }

        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 2rem; padding: 0 10px; }
        .text-header { font-weight: 900; font-style: italic; text-transform: uppercase; transform: skewX(-8deg); }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 15px 5px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: transform 0.3s ease; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 100%; position: relative; z-index: 2; }
        
        /* Swipe Container */
        .swipe-container { position: relative; width: 100%; height: 80px; margin-bottom: 0.5rem; overflow: hidden; border-radius: 4px; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; }
        .action-btn { height: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.75rem; color: white; text-transform: uppercase; }
        .btn-reset { background: #3b82f6; }
        .btn-delete { background: #ef4444; }

        .boss-button { background: linear-gradient(90deg, #b45309 0%, #f59e0b 50%, #b45309 100%); color: white; border: 2px solid #fde047; box-shadow: 0 0 20px rgba(234, 179, 8, 0.6); }
        .lesson-button { background: rgba(255, 255, 255, 0.15); border-left: 8px solid #eab308; }
        
        .swiped { transform: translateX(-160px); }
        
        .subject-icon { font-size: 1.2em; line-height: 1; display: inline-block; width: 40px; text-align: center; font-style: normal; }
        .title-glow { text-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 25px rgba(234, 179, 8, 0.5); }
    </style>
</head>
<body id="mainBody">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-3 sm:p-6"></div>

    <script>
        const images = ["massinewall.png", "massinewall1.png", "massinewall2.png", "massinewall3.png", "massinewall4.png"];
        let lastImage = "";
        let audioCtx;

        function changeBackground(isInitial = false) {
            let selectedImg = isInitial ? "massinewall.png" : images.filter(img => img !== lastImage)[Math.floor(Math.random() * (images.length - 1))];
            lastImage = selectedImg;
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/${selectedImg}')`;
        }
        
        function navigate(newView) { changeBackground(); state.view = newView; render(); }
        window.addEventListener('load', () => { changeBackground(true); render(); });

        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(type === 'correct' ? 600 : 120, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'), 
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle' 
        };

        // Swipe Management
        let touchStartX = 0;
        let activeSwipeEl = null;

        function handleTouchStart(e) { touchStartX = e.changedTouches[0].screenX; }
        function handleTouchMove(e, id) {
            const el = document.getElementById(id);
            const moveX = e.changedTouches[0].screenX;
            const diff = touchStartX - moveX;
            if (diff > 20) el.classList.add('swiped');
            if (diff < -20) el.classList.remove('swiped');
        }

        function executeReset(subject, theme, lessonName) {
            state.lessons.forEach(l => {
                if (l.subject === subject && l.theme === theme && (!lessonName || l.name === lessonName)) {
                    l.items.forEach(item => item.alreadyFailed = false);
                }
            });
            localStorage.setItem('study_data_v7', JSON.stringify(state.lessons));
            playSound('correct');
            render();
        }

        function executeDelete(subject, theme, lessonName) {
            if (lessonName) {
                state.lessons = state.lessons.filter(l => !(l.subject === subject && l.theme === theme && l.name === lessonName));
            } else {
                state.lessons = state.lessons.filter(l => !(l.subject === subject && l.theme === theme));
            }
            render();
        }

        async function handleStart() {
            if (state.lessons.length > 0) { navigate('subjects'); fetchCloudData(false); } 
            else { state.isLoading = true; render(); await fetchCloudData(true); }
        }

        async function fetchCloudData(shouldNavigate) {
            if (!state.scriptUrl) return;
            try {
                const response = await fetch(state.scriptUrl);
                const data = await response.json();
                if (data.lessons) { state.lessons = data.lessons; localStorage.setItem('study_data_v7', JSON.stringify(data.lessons)); }
                state.isLoading = false; if (shouldNavigate) navigate('subjects'); else render();
            } catch(e) { state.isLoading = false; render(); }
        }

        function createSwipeRow(subject, theme, lessonName, label, btnClass, clickAction) {
            const id = `row-${Math.random().toString(36).substr(2, 9)}`;
            return `
                <div class="swipe-container">
                    <div class="swipe-actions">
                        <button onclick="executeReset('${subject}', '${theme}', ${lessonName ? `'${lessonName}'` : 'null'})" class="action-btn btn-reset italic">RESET</button>
                        <button onclick="executeDelete('${subject}', '${theme}', ${lessonName ? `'${lessonName}'` : 'null'})" class="action-btn btn-delete italic">WISSEN</button>
                    </div>
                    <button id="${id}" 
                        ontouchstart="handleTouchStart(event)" 
                        ontouchmove="handleTouchMove(event, '${id}')"
                        onclick="${clickAction}"
                        class="fn-button ${btnClass}">
                        ${label}
                    </button>
                </div>
            `;
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="title-glow text-header text-5xl sm:text-8xl mb-10">MASSINE'S CHALLENGE</h1>
                    <button onclick="handleStart()" class="fn-button bg-yellow-400 text-black text-4xl sm:text-7xl px-12 py-8 shadow-[0_10px_0_rgb(161,98,7)] mx-auto italic">
                        ${state.isLoading ? 'LOADING...' : 'START MISSIONS'}
                    </button><button onclick="setCloudUrl()" style="position:fixed; bottom:15px; left:50%; transform:translateX(-50%); opacity:0.2;">⚙️</button></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-6 sm:p-10 max-w-xl"><h2 class="text-header text-3xl sm:text-6xl text-yellow-400 mb-6 text-center title-glow uppercase">MISSIONS</h2>
                    <div class="scroll-area grid gap-4">
                        <button onclick="navigate('boss_selection')" class="fn-button boss-button mb-4 py-8 text-3xl italic">🔥 BOSS LEVELS 🔥</button>
                        ${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedSubject='${s.toUpperCase()}'; navigate('lessons');" class="fn-button bg-white/20 border-l-[10px] border-yellow-400 text-3xl py-8 shadow-lg italic"><i class="subject-icon">${s === 'Frans' ? '🇫🇷' : s === 'Taal' ? '🇳🇱' : '🌍'}</i> ${s}</button>`).join('')}
                    </div></div>`;
            } else if (state.view === 'boss_selection') {
                container.innerHTML = `<div class="glass p-6 sm:p-10 max-w-xl"><div class="flex justify-between items-center mb-6"><button onclick="navigate('subjects');" class="bg-yellow-400 text-black px-4 py-2 fn-button text-xs italic">← BACK</button><h2 class="text-header text-2xl text-white uppercase title-glow">SELECT VAK</h2></div>
                    <div class="scroll-area grid gap-4">${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedBossSubject='${s.toUpperCase()}'; navigate('boss_themes');" class="fn-button bg-white/10 border-l-[10px] border-yellow-400 text-2xl py-8 italic">${s}</button>`).join('')}</div></div>`;
            } else if (state.view === 'boss_themes') {
                const themes = [...new Set(state.lessons.filter(l => l.subject === state.selectedBossSubject).map(l => l.theme))];
                container.innerHTML = `<div class="glass p-6 sm:p-10 max-w-xl"><div class="flex justify-between items-center mb-6"><button onclick="navigate('boss_selection');" class="bg-yellow-400 text-black px-4 py-2 fn-button text-xs italic">← BACK</button><h2 class="text-header text-2xl text-white uppercase title-glow">${state.selectedBossSubject}</h2></div>
                    <div class="scroll-area grid gap-4">
                        ${themes.map(t => createSwipeRow(state.selectedBossSubject, t, null, t, 'bg-red-600/20 border-l-[10px] border-red-600 py-8 text-xl italic', `startThemeBoss('${state.selectedBossSubject}', '${t}')`)).join('')}
                    </div></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-6 sm:p-10 max-w-xl"><div class="flex justify-between items-center mb-6"><button onclick="navigate('subjects');" class="bg-yellow-400 text-black px-4 py-2 fn-button text-xs italic">← BACK</button><h2 class="text-header text-2xl text-white uppercase italic">${state.selectedSubject}</h2></div>
                    <div class="scroll-area">
                        ${themes.map(t => `<div class="mb-6"><h3 class="bg-yellow-400 text-black font-black text-xs mb-3 px-3 py-1 uppercase italic inline-block skew-x-[-10deg]">${t}</h3>
                            ${filtered.filter(l => l.theme === t).map(l => createSwipeRow(l.subject, l.theme, l.name, l.name, 'lesson-button py-6 text-xl italic', `startLesson('${l.subject}','${l.theme}','${l.name}')`)).join('')}
                        </div>`).join('')}
                    </div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-4 sm:p-8 w-full max-w-4xl h-full sm:h-auto"><div class="flex justify-between items-center mb-4"><button onclick="navigate('lessons');" class="text-red-600 bg-black/40 px-3 py-1 rounded font-black text-xs uppercase italic">STOP</button>
                    <div class="h-2.5 flex-1 mx-4 bg-black/20 rounded-full overflow-hidden"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-header text-2xl text-yellow-400 font-black italic">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="scroll-area flex flex-col"><h2 class="text-header text-2xl sm:text-5xl mb-6 text-center leading-tight shadow-black">${q.word}</h2>
                        <div class="answers-grid">${q.options.map(opt => {
                            let c = "bg-white/20 border-white/20 shadow-lg"; if (state.status !== 'idle') { if (opt === q.correct) c = "bg-green-600 border-white scale-[1.02]"; else if (opt === state.selected) c = "bg-red-600 border-white"; else c = "opacity-20"; }
                            return `<button onclick="checkAnswer('${opt}')" class="fn-button p-5 sm:p-8 text-xl sm:text-2xl border-2 italic font-black ${c}">${opt}</button>`;
                        }).join('')}</div></div>
                    ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-4 w-full p-6 bg-yellow-400 text-black text-3xl sm:text-5xl fn-button font-black italic">NEXT QUESTION →</button>` : ''}</div>`;
            } else if (state.view === 'result') {
                container.innerHTML = `<div class="glass p-10 flex flex-col items-center justify-center text-center w-full border-4 border-yellow-400 shadow-2xl">
                    <h1 class="text-header text-5xl sm:text-7xl mb-4 text-yellow-400 title-glow uppercase italic">MISSION CLEARED!</h1>
                    <div class="text-3xl font-black text-white/80 mb-10 italic">SCORE: ${state.percent}% ${state.percent === 100 ? '🏆' : ''}</div>
                    <button onclick="navigate('subjects');" class="fn-button bg-yellow-400 text-black text-4xl px-16 py-8 shadow-lg italic">BACK TO MISSIONS</button></div>`;
            }
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt; const q = state.quizItems[0]; const isCorrect = opt === q.correct;
            if (isCorrect) { if (!q.alreadyFailed) state.firstTryCorrect++; playSound('correct'); }
            else { q.alreadyFailed = true; playSound('wrong'); }
            state.status = isCorrect ? 'correct' : 'wrong'; render();
        }

        function nextQuestion() {
            const completedQ = state.quizItems.shift(); if (state.status === 'wrong') state.quizItems.push(completedQ);
            if (state.quizItems.length === 0) {
                state.percent = Math.round((state.firstTryCorrect / state.totalQuestions) * 100);
                saveAction({ type: "RESULT", subject: state.currentLesson.subject, theme: state.currentLesson.theme, name: state.currentLesson.name, percent: state.percent });
                confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } }); navigate('result');
            } else { state.status = 'idle'; render(); }
        }

        async function saveAction(payload) { if (state.scriptUrl) fetch(state.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); }
        function startLesson(s,t,n) { state.currentLesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n); state.quizItems = [...state.currentLesson.items].sort(() => Math.random() - 0.5); state.totalQuestions = state.quizItems.length; state.firstTryCorrect = 0; state.status = 'idle'; navigate('quiz'); }
        function startThemeBoss(subject, theme) { const items = state.lessons.filter(l => l.subject === subject && l.theme === theme).flatMap(l => l.items); state.currentLesson = { name: theme, subject, theme, items }; state.quizItems = [...items].sort(() => Math.random() - 0.5); state.totalQuestions = items.length; state.firstTryCorrect = 0; state.status = 'idle'; navigate('quiz'); }
        function setCloudUrl() { const url = prompt("Google Web App URL:", state.scriptUrl); if (url) { state.scriptUrl = url; localStorage.setItem('script_url', url); fetchCloudData(true); } }
    </script>
</body>
</html>
