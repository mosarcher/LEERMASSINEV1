<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V17.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; -webkit-overflow-scrolling: touch; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; touch-action: manipulation; position: relative; overflow: hidden; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; margin-bottom: 0.5rem; }
        .lesson-progress-bar { position: absolute; bottom: 0; left: 0; height: 6px; background: #22c55e; z-index: 5; transition: width 0.5s ease-out; }
        
        /* Swipe to Reset functionaliteit */
        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; flex-shrink: 0; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 50; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .swiped .swipe-actions { opacity: 1; pointer-events: auto; }
        .btn-reset { background: #3b82f6; height: 100%; padding: 0 20px; font-weight: 900; font-size: 0.7rem; color: white; text-transform: uppercase; border: none; }
        .swiped .fn-button { transform: translateX(-80px); }

        .btn-correct-final { background-color: #22c55e !important; color: black !important; font-weight: 900; border: 3px solid white !important; }
        .btn-wrong-final { background-color: #ef4444 !important; color: white !important; animation: shake 0.3s; border: 3px solid white !important; }
        .btn-dimmed { opacity: 0.1 !important; pointer-events: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const MIJN_DATA = [{"s": "WO", "t": "Lichaam", "n": "Ademhaling", "q": "Wat halen de longen uit de lucht?", "a": "Zuurstof", "d": ["Koolstofdioxide", "Water", "Voedsel"]}, {"s": "WO", "t": "Lichaam", "n": "Ademhaling", "q": "Waarom heeft de luchtpijp kraakbeenringen?", "a": "Zodat hij niet wordt dichtgedrukt", "d": ["Om harder te praten", "Om slijm te maken", "Om lucht te filteren"]}, {"s": "WO", "t": "Lichaam", "n": "Ademhaling", "q": "Waarop steunen de longen?", "a": "Het middenrif", "d": ["De maag", "De lever", "De ribbenkast"]}, {"s": "WO", "t": "Lichaam", "n": "Ademhaling", "q": "Wat geven de longblaasjes af om uit te ademen?", "a": "Koolstofdioxide en water", "d": ["Alleen zuurstof", "Energie", "Stofdeeltjes"]}, {"s": "WO", "t": "Lichaam", "n": "Bloedsomloop", "q": "Hoe vaak klopt het hart ongeveer per dag?", "a": "Ruim 100.000 maal", "d": ["1.000 maal", "70 maal", "10.000 maal"]}, {"s": "WO", "t": "Lichaam", "n": "Bloedsomloop", "q": "Waar kun je de hartslag voelen buiten de pols?", "a": "In de hals of de lies", "d": ["Op de vingertop", "Bij de elleboog", "Op de knie"]}, {"s": "WO", "t": "Lichaam", "n": "Bloedsomloop", "q": "Wat vertrekt er vanuit de linkerkamer?", "a": "Zuurstofrijk bloed via slagaders", "d": ["Zuurstofarm bloed via aders", "Alleen afvalstoffen", "Lucht"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet", "q": "Uit hoeveel wervels bestaat de ruggengraat?", "a": "32", "d": ["206", "12", "50"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet", "q": "Hoeveel botten heeft een volwassen mens?", "a": "206", "d": ["32", "100", "500"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het bot van het hoofd?", "a": "Schedel", "d": ["Bekken", "Borstbeen", "Schouderblad"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het bot bij de keel/nek?", "a": "Halswervels", "d": ["Ruggenwervels", "Sleutelbeen", "Borstbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Welk bot loopt van de schouder naar het borstbeen?", "a": "Sleutelbeen", "d": ["Rib", "Opperarmbeen", "Spaakbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het platte bot op je rug bij de schouder?", "a": "Schouderblad", "d": ["Borstbeen", "Bekken", "Schedel"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het bot in het midden van de borstkas?", "a": "Borstbeen", "d": ["Sleutelbeen", "Rib", "Wervelkolom"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heten de botten die de borstkas vormen?", "a": "Ribben", "d": ["Halswervels", "Bekken", "Handwortelbeentjes"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het bot in de bovenarm?", "a": "Opperarmbeen", "d": ["Dijbeen", "Spaakbeen", "Ellepijp"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Welk bot in de onderarm ligt aan de kant van de duim?", "a": "Spaakbeen", "d": ["Ellepijp", "Opperarmbeen", "Sleutelbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Welk bot in de onderarm ligt aan de kant van de pink?", "a": "Ellepijp", "d": ["Spaakbeen", "Dijbeen", "Kuitbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heten de botjes in de pols?", "a": "Handwortelbeentjes", "d": ["Voetwortelbeentjes", "Vingerkootjes", "Bekken"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heten de botjes van de vingers?", "a": "Vingerkootjes", "d": ["Handwortelbeentjes", "Teenkootjes", "Ribben"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het grote bot onderaan de ruggengraat?", "a": "Bekken", "d": ["Borstbeen", "Schedel", "Knieschijf"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het bot in het bovenbeen?", "a": "Dijbeen", "d": ["Opperarmbeen", "Scheenbeen", "Kuitbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het botje bij de knie?", "a": "Knieschijf", "d": ["Elleboog", "Bekken", "Schedel"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het dikste bot in het onderbeen?", "a": "Scheenbeen", "d": ["Kuitbeen", "Dijbeen", "Spaakbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heet het dunne bot in het onderbeen?", "a": "Kuitbeen", "d": ["Scheenbeen", "Ellepijp", "Borstbeen"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heten de botjes in de enkel?", "a": "Voetwortelbeentjes", "d": ["Handwortelbeentjes", "Teenkootjes", "Ribben"]}, {"s": "WO", "t": "Lichaam", "n": "Skelet (Kaart)", "q": "Hoe heeten de botjes van de tenen?", "a": "Teenkootjes", "d": ["Vingerkootjes", "Handwortelbeentjes", "Bekken"]}, {"s": "WO", "t": "Lichaam", "n": "Gewrichten", "q": "Hoe heet het gladde oppervlak bij beenderen?", "a": "Kraakbeen", "d": ["Een pees", "Een spier", "Een zenuw"]}, {"s": "WO", "t": "Lichaam", "n": "Gewrichten", "q": "Wat houden de gewrichten bij elkaar?", "a": "Spieren en pezen", "d": ["Alleen huid", "Alleen bloedvaten", "Lucht"]}, {"s": "WO", "t": "Lichaam", "n": "Spieren", "q": "Wat is de kleur van onze spieren?", "a": "Rood", "d": ["Blauw", "Wit", "Geel"]}, {"s": "WO", "t": "Lichaam", "n": "Spieren", "q": "Waar halen de spieren hun energie vandaan?", "a": "Uit voedsel", "d": ["Uit water", "Uit de lucht", "Uit de zon"]}, {"s": "WO", "t": "Lichaam", "n": "3 soorten spieren", "q": "Wat is een voorbeeld van een spier die automatisch werkt?", "a": "De hartspier", "d": ["De biceps", "De kauwspier", "De kuitspier"]}, {"s": "WO", "t": "Lichaam", "n": "3 soorten spieren", "q": "Wat is een voorbeeld van een bewuste spier?", "a": "De kauwspier", "d": ["De maagspier", "De darmspier", "De hartspier"]}, {"s": "WO", "t": "Lichaam", "n": "Spijsvertering", "q": "Hoe lang is de slokdarm ongeveer?", "a": "25 cm", "d": ["5 meter", "1,5 meter", "10 cm"]}, {"s": "WO", "t": "Lichaam", "n": "Spijsvertering", "q": "Welk orgaan is ongeveer 5 meter lang?", "a": "De dunne darm", "d": ["De dikke darm", "de slokdarm", "De maag"]}, {"s": "WO", "t": "Lichaam", "n": "Spijsvertering", "q": "Welk orgaan is ongeveer 1 \u00e0 1,5 meter lang?", "a": "De dikke darm", "d": ["De dunne darm", "De slokdarm", "De lever"]}, {"s": "WO", "t": "Lichaam", "n": "Zintuigen", "q": "Hoe heet een seintje uit de omgeving?", "a": "Een prikkel", "d": ["Een zenuw", "Een reactie", "Een spierpijn"]}, {"s": "FRANS", "t": "T5: Les Nombres", "n": "Getallen 10-30", "q": "11", "a": "onze", "d": ["dix", "douze", "seize"]}, {"s": "FRANS", "t": "T5: Les Nombres", "n": "Getallen 10-30", "q": "13", "a": "treize", "d": ["trois", "trente", "seize"]}, {"s": "FRANS", "t": "T5: Les Nombres", "n": "Getallen 10-30", "q": "14", "a": "quatorze", "d": ["quatre", "quarante", "quinze"]}, {"s": "FRANS", "t": "T5: Verbes", "n": "\u00catre (zijn)", "q": "ik ben", "a": "je suis", "d": ["j'ai", "tu es", "il est"]}, {"s": "TAAL", "t": "T5: Woordenschat", "n": "Les 1", "q": "de dader", "a": "de schuldige", "d": ["het slachtoffer", "de getuige", "de politie"]}, {"s": "TAAL", "t": "T5: Woordenschat", "n": "Les 1", "q": "het slachtoffer", "a": "de persoon met pech", "d": ["de boef", "de dader", "de helper"]}];

        let state = {
            view: 'landing',
            lessons: [],
            selectedSubject: '',
            status: 'idle',
            quizItems: [],
            totalInRound: 0,
            correctInRound: 0,
            selected: null,
            scores: JSON.parse(localStorage.getItem('massine_scores_v17_lokaal') || '{}')
        };

        function prepareData() {
            const lessonsMap = {};
            MIJN_DATA.forEach(item => {
                const key = `${item.s}-${item.t}-${item.n}`;
                if (!lessonsMap[key]) lessonsMap[key] = { subject: item.s, theme: item.t, name: item.n, items: [] };
                lessonsMap[key].items.push({ 
                    word: item.q, correct: item.a, 
                    options: [item.a, ...item.d].filter(x => x !== "").sort(() => Math.random() - 0.5) 
                });
            });
            state.lessons = Object.values(lessonsMap);
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'landing') {
                container.innerHTML = `<div class="glass w-full max-w-md p-8 text-center">
                    <h1 class="text-4xl font-black italic uppercase text-yellow-400 mb-8">Massine's<br>Challenge</h1>
                    <button onclick="initAudio(); state.view='subjects'; render();" class="fn-button bg-yellow-400 text-black py-8 text-2xl">START MISSION</button>
                </div>`;
            }
            else if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                container.innerHTML = `<div class="glass w-full max-w-md p-4">
                    <h1 class="text-3xl text-yellow-400 mb-6 text-center font-black italic uppercase">Missions</h1>
                    <div class="grid gap-4">
                        <button onclick="startBossMode()" class="fn-button bg-orange-600 py-6 text-xl italic mb-2">🔥 BOSS LEVELS 🔥</button>
                        <div class="subject-grid">
                            ${subs.map(s => {
                                let icon = s.includes('WO') ? '🌍' : s.includes('FRANS') ? '🇫🇷' : s.includes('TAAL') ? '🇳🇱' : '📚';
                                return `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-10 text-xl italic border border-white/5 flex flex-col">
                                    <span class="text-4xl mb-2">${icon}</span>
                                    <span>${s}</span>
                                </button>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            } 
            else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass w-full max-w-md p-3">
                    <div class="flex justify-between mb-4 px-2">
                        <button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-xs">← BACK</button>
                        <h2 class="text-xl font-black italic uppercase">${state.selectedSubject}</h2>
                    </div>
                    <div class="scroll-area">
                        ${themes.map(t => `<div class="theme-label">${t}</div>` + filtered.filter(l => l.theme === t).map(l => {
                            const key = `${l.subject}-${l.theme}-${l.name}`;
                            const hasScore = state.scores[key] ? '100%' : '0%';
                            const lid = 'id' + Math.random().toString(36).substr(2, 5);
                            return `<div class="swipe-container"><div class="swipe-actions"><button onclick="resetScore('${key}')" class="btn-reset">RESET</button></div><div id="${lid}" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, '${lid}')" class="w-full h-full transition-transform duration-200"><button onclick="startQuiz('${l.subject}','${l.theme}','${l.name}')" class="fn-button bg-white/10 py-5 text-left pl-6 italic relative"><span>${l.name}</span><div class="lesson-progress-bar" style="width: ${hasScore}"></div></button></div></div>`;
                        }).join('')).join('')}
                    </div>
                </div>`;
            }
            else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass w-full max-w-4xl p-4">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="state.view='lessons'; render();" class="text-red-500 font-black italic uppercase text-xs">STOP</button>
                        <div class="text-yellow-400 font-black italic uppercase">Score: ${state.correctInRound} / ${state.totalInRound}</div>
                        <span class="text-white font-black italic text-xs uppercase">${state.quizItems.length} LEFT</span>
                    </div>
                    <h2 class="text-2xl text-center my-10 font-black italic uppercase leading-tight">${q.word}</h2>
                    <div class="grid gap-3">${q.options.map(opt => {
                        let cl = "bg-white/10"; 
                        if(state.status !== 'idle'){ 
                            if(opt === q.correct) cl = "btn-correct-final"; 
                            else if(opt === state.selected) cl = "btn-wrong-final"; 
                            else cl = "btn-dimmed"; 
                        }
                        return `<button onclick="handleAnswer('${opt}')" class="fn-button py-6 text-lg italic ${cl}">${opt}</button>`
                    }).join('')}</div>
                    ${state.status !== 'idle' ? `<button onclick="nextQ()" class="mt-8 bg-yellow-400 text-black py-4 fn-button italic font-black uppercase tracking-widest">Next →</button>` : ''}
                </div>`;
            }
        }

        function startQuiz(s, t, n) {
            const lesson = state.lessons.find(l => l.subject === s && l.theme === t && l.name === n);
            state.currentKey = `${s}-${t}-${n}`;
            state.quizItems = [...lesson.items].sort(() => Math.random() - 0.5);
            state.totalInRound = state.quizItems.length;
            state.correctInRound = 0;
            state.view = 'quiz'; render();
        }

        function startBossMode() {
            state.currentKey = 'BOSS';
            let allItems = [];
            state.lessons.forEach(l => allItems.push(...l.items));
            state.quizItems = allItems.sort(() => Math.random() - 0.5).slice(0, 20);
            state.totalInRound = state.quizItems.length;
            state.correctInRound = 0;
            state.view = 'quiz'; render();
        }

        function handleAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt;
            const q = state.quizItems[0];
            if (opt === q.correct) { 
                state.status = 'correct'; state.correctInRound++;
                playSound(880, 'sine', 0.1); confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } }); 
            } else { 
                state.status = 'wrong'; playSound(220, 'square', 0.2);
                state.quizItems.push({...q}); 
            }
            render();
        }

        function nextQ() {
            state.quizItems.shift(); state.status = 'idle'; state.selected = null;
            if (state.quizItems.length === 0) {
                if(state.currentKey !== 'BOSS') state.scores[state.currentKey] = true;
                localStorage.setItem('massine_scores_v17_lokaal', JSON.stringify(state.scores));
                state.view = state.currentKey === 'BOSS' ? 'subjects' : 'lessons';
            }
            render();
        }

        function resetScore(key) { delete state.scores[key]; localStorage.setItem('massine_scores_v17_lokaal', JSON.stringify(state.scores)); render(); }
        let startX = 0;
        function handleTS(e) { startX = e.touches[0].clientX; }
        function handleTM(e, id) { 
            const diff = startX - e.touches[0].clientX;
            const el = document.getElementById(id).parentElement;
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); }
            else if (diff < -50) el.classList.remove('swiped');
        }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(el => el.classList.remove('swiped')); }

        prepareData();
        render();
    </script>
</body>
</html>
