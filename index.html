<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V11.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; transition: background-image 0.6s; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }

        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; }
        
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: transform 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; }
        
        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; opacity: 0; transition: opacity 0.2s; }
        .swiped .swipe-actions { opacity: 1; }
        
        .action-btn { height: 100%; padding: 0 12px; font-weight: 900; font-size: 0.7rem; color: white; border: none; }
        .btn-reset { background: #3b82f6; }
        .btn-delete { background: #ef4444; }

        .swiped .fn-button { transform: translateX(-140px); }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* Resume Button Styling */
        .resume-pill { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #eab308; color: black; font-size: 0.6rem; padding: 4px 8px; border-radius: 99px; font-weight: 900; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .version-tag { position: fixed; bottom: 5px; right: 10px; font-size: 10px; opacity: 0.3; font-weight: 900; }
    </style>
</head>
<body id="mainBody" onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>
    <div class="version-tag">v11.7</div>

    <script>
        const images = ["massinewall.png", "massinewall1.png", "massinewall2.png", "massinewall3.png", "massinewall4.png"];
        let lastImage = "";
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(type === 'correct' ? 600 : 120, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function changeBackground(isInitial = false) {
            let selectedImg = isInitial ? "massinewall.png" : images.filter(img => img !== lastImage)[Math.floor(Math.random() * (images.length - 1))];
            lastImage = selectedImg;
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/${selectedImg}')`;
        }

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'),
            checkpoints: JSON.parse(localStorage.getItem('checkpoints_v1') || '{}'),
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle' 
        };

        let startX = 0;
        function handleTouchStart(e) { startX = e.touches[0].clientX; }
        function handleTouchMove(e, id) {
            const diff = startX - e.touches[0].clientX;
            const el = document.getElementById(id).parentElement;
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); }
            else if (diff < -50) el.classList.remove('swiped');
        }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(el => el.classList.remove('swiped')); }

        function saveCheckpoint() {
            const key = `${state.currentLesson.subject}-${state.currentLesson.theme}-${state.currentLesson.name}`;
            state.checkpoints[key] = {
                items: state.quizItems,
                total: state.totalQuestions,
                correct: state.firstTryCorrect
            };
            localStorage.setItem('checkpoints_v1', JSON.stringify(state.checkpoints));
        }

        function clearCheckpoint(s,t,n) {
            delete state.checkpoints[`${s}-${t}-${n}`];
            localStorage.setItem('checkpoints_v1', JSON.stringify(state.checkpoints));
        }

        function startLesson(s,t,n, resume = false) {
            const key = `${s}-${t}-${n}`;
            const lesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n);
            
            if (resume && state.checkpoints[key]) {
                const cp = state.checkpoints[key];
                state.quizItems = cp.items;
                state.totalQuestions = cp.total;
                state.firstTryCorrect = cp.correct;
            } else {
                state.quizItems = [...lesson.items].sort(() => Math.random() - 0.5);
                state.totalQuestions = state.quizItems.length;
                state.firstTryCorrect = 0;
                clearCheckpoint(s,t,n);
            }
            state.currentLesson = { subject:s, theme:t, name:n };
            state.status = 'idle';
            navigate('quiz');
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="text-header text-5xl mb-8 title-glow">MASSINE'S CHALLENGE</h1>
                    <button onclick="initAudio(); handleStart();" class="fn-button bg-yellow-400 text-black text-3xl px-10 py-6 mx-auto italic">START</button></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('subjects')" class="bg-yellow-400 text-black fn-button px-3 py-1 text-[10px] h-8 italic">← BACK</button><h2 class="text-header text-lg italic">${state.selectedSubject}</h2></div>
                    <div class="scroll-area">${themes.map(t => `<div class="mb-4"><h3 class="bg-yellow-400 text-black font-black text-[10px] mb-2 px-2 py-0.5 uppercase italic inline-block skew-x-[-10deg]">${t}</h3>
                        ${filtered.filter(l => l.theme === t).map(l => {
                            const id = `btn-${Math.random().toString(36).substr(2, 5)}`;
                            const cpKey = `${l.subject}-${l.theme}-${l.name}`;
                            return `<div class="swipe-container">
                                <div class="swipe-actions">
                                    <button onclick="executeReset('${l.subject}','${l.theme}','${l.name}')" class="action-btn btn-reset">RESET</button>
                                    <button onclick="executeDelete('${l.subject}','${l.theme}','${l.name}')" class="action-btn btn-delete">WISSEN</button>
                                </div>
                                ${state.checkpoints[cpKey] ? `<div class="resume-pill" onclick="startLesson('${l.subject}','${l.theme}','${l.name}', true)">▶️ CONT.</div>` : ''}
                                <button id="${id}" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event, '${id}')" onclick="startLesson('${l.subject}','${l.theme}','${l.name}')" class="fn-button bg-white/10 border-l-[6px] border-white/30 text-lg py-5 italic text-left pl-6">${l.name}</button>
                            </div>`}).join('')}</div>`).join('')}</div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl h-full sm:h-auto"><div class="flex justify-between items-center mb-3"><button onclick="saveCheckpoint(); navigate('lessons');" class="text-red-600 bg-black/40 px-2 py-1 rounded font-black text-[10px] uppercase">STOP</button>
                    <div class="h-2 flex-1 mx-3 bg-black/20 rounded-full"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-header text-xl text-yellow-400">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="scroll-area flex flex-col items-center"><h2 class="text-header text-2xl mb-4 text-center">${q.word}</h2>
                        <div class="w-full grid grid-cols-1 gap-2">${q.options.map(opt => `<button onclick="checkAnswer('${opt}')" class="fn-button p-4 text-lg italic font-black ${state.status !== 'idle' ? (opt === q.correct ? 'bg-green-600 border-white' : (opt === state.selected ? 'bg-red-600 border-white' : 'opacity-20')) : 'bg-white/10 border-white/20'}">${opt}</button>`).join('')}</div>
                        ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-4 h-12 w-full bg-yellow-400 text-black fn-button italic">NEXT →</button>` : ''}
                    </div></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><h2 class="text-header text-2xl text-yellow-400 mb-4 text-center italic">MISSIONS</h2>
                    <div class="scroll-area grid grid-cols-1 gap-3"><button onclick="navigate('boss_selection')" class="fn-button bg-orange-600 text-white text-2xl py-8 italic shadow-lg">🔥 BOSS LEVELS 🔥</button>
                        <div class="subject-grid">${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedSubject='${s.toUpperCase()}'; navigate('lessons');" class="fn-button bg-white/20 border-l-[6px] border-yellow-400 text-xl py-6 italic">${s}</button>`).join('')}</div></div></div>`;
            }
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt; const q = state.quizItems[0]; const isCorrect = opt === q.correct;
            if (isCorrect) { if (!q.alreadyFailed) state.firstTryCorrect++; playSound('correct'); } else { q.alreadyFailed = true; playSound('wrong'); }
            state.status = isCorrect ? 'correct' : 'wrong'; render();
        }

        function nextQuestion() {
            const completedQ = state.quizItems.shift(); if (state.status === 'wrong') state.quizItems.push(completedQ);
            if (state.quizItems.length === 0) {
                clearCheckpoint(state.currentLesson.subject, state.currentLesson.theme, state.currentLesson.name);
                confetti({ particleCount: 150, spread: 70 }); navigate('lessons');
            } else { state.status = 'idle'; saveCheckpoint(); render(); }
        }

        async function handleStart() { if (state.lessons.length > 0) navigate('subjects'); else fetchCloudData(true); }
        async function fetchCloudData(nav) { /* ... fetch logic ... */ }
        function navigate(v) { changeBackground(); state.view = v; render(); }
        function executeReset(s,t,n) { state.lessons.forEach(l => { if(l.subject===s && l.theme===t && l.name===n) l.items.forEach(i => i.alreadyFailed = false); }); localStorage.setItem('study_data_v7', JSON.stringify(state.lessons)); closeAllSwipes(); render(); }
        function executeDelete(s,t,n) { state.lessons = state.lessons.filter(l => !(l.subject===s && l.theme===t && l.name===n)); localStorage.setItem('study_data_v7', JSON.stringify(state.lessons)); closeAllSwipes(); render(); }
    </script>
</body>
</html>
