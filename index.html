<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE CHALLENGE V24.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; min-height: 100vh; overflow-x: hidden; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png') center/cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.2), rgba(10,5,26,0.8)); z-index: -1; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 1.5rem; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: 0.2s; font-weight: 900; font-style: italic; text-transform: uppercase; border: none; touch-action: manipulation; }
        .prog-bar-container { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.5s ease; }
        .btn-correct { background: #22c55e !important; color: #000 !important; box-shadow: 0 0 20px #22c55e; }
        .btn-wrong { background: #ef4444 !important; color: #fff !important; animation: shake 0.3s; box-shadow: 0 0 20px #ef4444; }
        .swipe-container { position: relative; overflow: hidden; border-radius: 1rem; margin-bottom: 1rem; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 10; transform: translateX(100%); transition: transform 0.3s ease; }
        .swipe-main { transition: transform 0.3s ease; width: 100%; }
        .swiped .swipe-main { transform: translateX(-100px); }
        .swiped .swipe-actions { transform: translateX(0); }
        .btn-reset-red { background: #ef4444; color: white; padding: 0 15px; font-weight: 900; font-size: 10px; height: 100%; display: flex; align-items: center; text-transform: uppercase; }
        .quiz-container { padding-top: 2vh; }
        .skelet-kaart { width: 100%; max-width: 280px; margin: 0 auto 1rem auto; border: 2px solid rgba(255,255,255,0.3); border-radius: 1rem; display: block; }
    </style>
</head>
<body onclick="closeAllSwipes()">
    <div id="bg-container"></div><div class="overlay"></div>
    <div id="app" class="w-full max-w-2xl mx-auto py-4 px-4"></div>
    <script>
        let audioCtx; let DATA = []; let startX = 0;
        let state = {
            v: 'landing', sub: '', cat: '', items: [], total: 0, status: 'idle', sel: null, curK: '', revealed: false,
            progress: JSON.parse(localStorage.getItem('m_prog_v24.1') || '{}'),
            errs: JSON.parse(localStorage.getItem('m_e_v24.1') || '[]')
        };

        const skeletUrl = "https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/skelet-kaart.png"; 

        const iconMap = [
            { key: 'LICHAAM', icon: '🦴' }, { key: 'ADEMHALING', icon: '🫁' }, { key: 'SKELET', icon: '💀' },
            { key: 'SPIEREN', icon: '💪' }, { key: 'SPIJSVERTERING', icon: '🍕' }, { key: 'ZINTUIGEN', icon: '👁️' },
            { key: 'CUISINE', icon: '🍴' }, { key: 'MAGASIN', icon: '🛒' }, { key: 'GELD', icon: '💶' },
            { key: 'MULTIMEDIA', icon: '📱' }, { key: 'MUZIEK', icon: '🎸' }, { key: 'SPORT', icon: '⚽' },
            { key: 'HOBBY', icon: '🎨' }, { key: 'GETALLEN', icon: '🔢' }
        ];

        function getIcon(lesson, category) {
            const lUpper = lesson.toUpperCase();
            if (lUpper.includes("KAART")) return "💀"; // Skelet icoon voor de kaart
            const catUpper = category.toUpperCase();
            if (['VERBES', 'SPELLING', 'WOORDENSCHAT'].includes(catUpper)) return null;
            const combined = (lesson + " " + category).toUpperCase();
            for (const item of iconMap) { if (combined.includes(item.key)) return item.icon; }
            return '📚';
        }

        function cleanCategory(cat) {
            const u = cat.toUpperCase();
            if (u.includes("SPELLING")) return "SPELLING";
            if (u.includes("WOORDENSCHAT")) return "WOORDENSCHAT";
            if (u.includes("VERBES")) return "VERBES";
            return cat.toUpperCase();
        }

        function save() { 
            localStorage.setItem('m_prog_v24.1', JSON.stringify(state.progress)); 
            localStorage.setItem('m_e_v24.1', JSON.stringify(state.errs)); 
        }
        
        Papa.parse("vragen.csv", {
            download: true, header: false, skipEmptyLines: true,
            complete: function(res) {
                DATA = res.data.slice(1).map(r => {
                    if (!r[0] || !r[3] || !r[4]) return null;
                    return {
                        s: String(r[0]).toUpperCase().trim(),
                        t: String(r[1] || "").trim(),
                        n: String(r[2] || "").trim(),
                        q: String(r[3]).trim(),
                        a: String(r[4]).trim(),
                        d: [r[5], r[6], r[7]].filter(x => x && String(x).trim() !== "")
                    };
                }).filter(i => i !== null);
                render();
            }
        });

        function render() {
            const app = document.getElementById('app');
            if (state.v === 'landing') {
                app.innerHTML = `<div class="glass p-10 text-center mt-20"><h1 class="text-5xl font-black italic text-yellow-400 mb-2 uppercase tracking-tighter">Massine's</h1><h2 class="text-2xl font-black italic text-white mb-10 uppercase tracking-widest">Challenge</h2><button onclick="initAudio(); state.v='menu'; render();" class="fn-button bg-yellow-400 text-black py-8 px-12 text-2xl w-full">START GAME</button></div>`;
            } else if (state.v === 'menu') {
                const subs = [...new Set(DATA.map(i => i.s))].sort();
                app.innerHTML = `<div class="glass p-6 text-center"><h1 class="text-3xl text-yellow-400 font-black italic mb-6 uppercase">Missions</h1><button onclick="state.v='boss';render()" class="fn-button w-full bg-red-600 py-6 mb-8 text-xl flex items-center justify-center gap-3 shadow-lg"><span>🔥 BOSS LEVEL</span><span class="bg-black/20 px-3 py-1 rounded-full text-sm font-mono">${state.errs.length}</span></button><div class="grid grid-cols-2 gap-4">${subs.map(sub => {
                    let icon = sub === 'FRANS' ? '🇫🇷' : (sub === 'WO' ? '🌍' : '📚');
                    return `<button onclick="state.sub='${sub}';state.v='categories';render()" class="fn-button bg-white/10 py-12 text-xl border border-white/5 uppercase tracking-tighter flex flex-col items-center gap-2"><span>${icon}</span><span>${sub}</span></button>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'categories') {
                const cleanCats = [...new Set(DATA.filter(i => i.s === state.sub).map(i => cleanCategory(i.t)))].sort();
                app.innerHTML = `<div class="glass p-6 text-center"><div class="flex justify-between items-center mb-8"><button onclick="state.v='menu';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-[10px]">← BACK</button><span class="font-black italic text-yellow-400 uppercase tracking-widest text-sm">${state.sub}</span></div><div class="grid grid-cols-1 gap-4">${cleanCats.map(cat => `<button onclick="state.cat='${cat}';state.v='lessons';render()" class="fn-button bg-white/10 py-8 text-xl border border-white/5 uppercase italic tracking-widest text-yellow-400">${cat}</button>`).join('')}</div></div>`;
            } else if (state.v === 'lessons') {
                const lessons = [...new Set(DATA.filter(i => i.s === state.sub && cleanCategory(i.t) === state.cat).map(i => i.n))];
                app.innerHTML = `<div class="glass p-4 min-h-[80vh]"><div class="flex justify-between items-center mb-8 px-2"><button onclick="state.v='categories';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-[10px]">← BACK</button><span class="font-black italic text-yellow-400 uppercase tracking-widest text-sm">${state.cat}</span></div><div class="grid grid-cols-2 gap-3">${lessons.map(n => {
                    const lessonQs = DATA.filter(i => i.s === state.sub && cleanCategory(i.t) === state.cat && i.n === n);
                    const attCount = lessonQs.filter(q => state.progress[q.q]).length;
                    const icon = getIcon(n, state.cat);
                    const lid = 'l-' + Math.random().toString(36).substr(2, 5);
                    const isMap = n.toUpperCase().includes("KAART");
                    return `<div class="swipe-container" id="cont-${lid}"><div class="swipe-actions"><button onclick="lessonQs.forEach(q => delete state.progress[q.q]); save(); render();" class="btn-reset-red italic text-[8px]">RESET</button></div><div class="swipe-main" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, '${lid}')"><button onclick="startQ('${state.sub}', '${state.cat}', '${n}')" class="fn-button w-full h-28 bg-white/10 flex flex-col items-center justify-center border border-white/5 relative">
                        <span class="text-3xl mb-1">${icon}</span>
                        <span class="text-[10px] text-center px-1 leading-tight uppercase font-black italic">${n}</span>
                        ${isMap ? '<span class="text-[7px] text-yellow-400 font-black animate-pulse">IMAGE MODE</span>' : ''}
                        <span class="text-[8px] font-mono opacity-40 absolute bottom-1">${attCount}/${lessonQs.length}</span>
                    </button></div></div>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'quiz') {
                const q = state.items[0];
                const showMap = q.n.toUpperCase().includes("KAART");
                const isSpelling = state.cat === "SPELLING";
                const isFlash = q.d.length === 0 || (!isSpelling && (q.s.includes("FRANS") || state.cat === "WOORDENSCHAT"));
                const progress = ((state.total - state.items.length) / state.total) * 100;
                
                app.innerHTML = `<div class="glass p-6 quiz-container">
                    <div class="flex justify-between font-black text-yellow-400 mb-2 uppercase text-[10px] tracking-widest"> 
                        <button onclick="state.v='lessons';render()" class="text-red-500 border border-red-500 px-2">← BACK</button> 
                        <span>${state.total - state.items.length}/${state.total}</span>
                    </div>
                    <div class="prog-bar-container mb-4"><div class="prog-bar-fill" style="width: ${progress}%"></div></div>
                    
                    ${showMap ? `<img src="${skeletUrl}" class="skelet-kaart" />` : ''}

                    <div class="question-box text-center mb-6" onclick="if(${isFlash}){state.revealed=true;render();}">
                        <h2 class="text-3xl font-black italic uppercase leading-tight">${q.q}</h2>
                        ${isFlash && !state.revealed ? '<div class="mt-4 py-4 bg-yellow-400 rounded-xl animate-bounce"><p class="text-2xl font-black text-black uppercase tracking-tighter">ZEG LUIDOP!</p></div>' : ''}
                    </div>

                    ${isFlash ? `<div id="flashcard-ui">${state.revealed ? `<div class="answer-box text-center animate-pulse mb-8"><p class="text-[10px] opacity-40 mb-2 tracking-[0.3em] uppercase">ANTWOORD</p><h2 class="text-2xl font-black italic text-green-400">${q.a}</h2></div><div class="grid grid-cols-2 gap-4"><button onclick="handleFlash(true)" class="fn-button bg-green-600 py-6 text-xl">✅ JUIST</button><button onclick="handleFlash(false)" class="fn-button bg-red-600 py-6 text-xl">❌ FOUT</button></div>` : ''}</div>` : 
                    `<div class="grid gap-4 mb-10">${q.opts.map(o => { let cl = "bg-white/5 border border-white/10"; if(state.status !== 'idle'){ if(o === q.a) cl = "btn-correct"; else if(o === state.sel) cl = "btn-wrong"; else cl = "opacity-20"; } return `<button onclick="check('${o}')" class="fn-button py-6 text-lg ${cl}">${o}</button>`; }).join('')}</div><div id="next-anchor" class="min-h-[100px] text-center">${state.status !== 'idle' ? `<button onclick="next()" class="fn-button w-full bg-white text-black py-8 text-xl shadow-2xl">CONTINUE →</button>` : ''}</div>`}
                </div>`;
            } else if (state.v === 'boss') {
                const bSubs = [...new Set(state.errs.map(i => i.s))];
                app.innerHTML = `<div class="glass p-4 min-h-[80vh]"><button onclick="state.v='menu';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic mb-6 text-[10px]">← MISSIONS</button><h2 class="text-red-500 font-black mb-4 italic uppercase text-center text-2xl tracking-tighter">Revenge Mode</h2>${state.errs.length ? bSubs.map(s => `<div class="bg-white/5 p-4 mb-4 rounded-xl border border-white/5"><div class="text-red-500 font-black mb-3 italic uppercase text-[10px] tracking-widest">${s}</div><div class="grid grid-cols-2 gap-2">${[...new Set(state.errs.filter(i=>i.s===s).map(i=>i.n))].map(n => {
                    const bid = 'b-' + Math.random().toString(36).substr(2, 5);
                    return `<div class="swipe-container" id="cont-${bid}"><div class="swipe-actions"><button onclick="state.errs = state.errs.filter(i => !(i.s === '${s}' && i.n === '${n}')); save(); render();" class="btn-reset-red italic text-[8px]">WISSEN</button></div><div class="swipe-main" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, '${bid}')"><button onclick="startBossQ('${s}','${n}')" class="fn-button w-full h-24 bg-red-900/20 flex flex-col items-center justify-center border border-red-500/20 relative"><span class="text-lg text-center px-1 opacity-80 uppercase italic font-black">${n}</span><span class="text-[8px] font-mono bg-red-600 px-2 py-0.5 rounded absolute bottom-1">${state.errs.filter(x=>x.s===s&&x.n===n).length}</span></button></div></div>`;
                }).join('')}</div></div>`).join('') : '<div class="text-center mt-20 opacity-30 italic font-black uppercase tracking-widest text-white">No Targets Acquired</div>'}</div>`;
            }
        }

        function startQ(sub, catClean, lesson) { initAudio(); window.scrollTo(0,0); state.revealed = false; state.status = 'idle'; state.sel = null; state.items = DATA.filter(i => i.s === sub && cleanCategory(i.t) === catClean && i.n === lesson).map(i => ({...i, opts: [i.a, ...i.d].sort(()=>Math.random()-0.5)})).sort(()=>Math.random()-0.5); state.total = state.items.length; state.v = 'quiz'; state.curK = `${sub}-${catClean}-${lesson}`; render(); }
        function handleFlash(isCorrect) { const q = state.items[0]; state.progress[q.q] = true; if (isCorrect) { playSound(660, 'sine', 0.15); confetti({particleCount:30, origin:{y:0.8}}); if(state.curK.startsWith('BOSS')) state.errs = state.errs.filter(i => i.q !== q.q); } else { playSound(150, 'sawtooth', 0.3); if(!state.errs.some(i => i.q === q.q)) state.errs.push(q); } save(); state.items.shift(); state.revealed = false; if(!state.items.length) { state.v = 'lessons'; } render(); }
        function check(o) { if(state.status !== 'idle') return; state.sel = o; const q = state.items[0]; state.progress[q.q] = true; if(o === q.a) { state.status = 'correct'; playSound(660, 'sine', 0.15); confetti({particleCount:30, origin:{y:0.8}}); if(state.curK.startsWith('BOSS')) state.errs = state.errs.filter(i => i.q !== q.q); } else { state.status = 'wrong'; playSound(150, 'sawtooth', 0.3); if(!state.errs.some(i => i.q === q.q)) state.errs.push(q); } save(); render(); }
        function next() { state.items.shift(); state.status = 'idle'; state.sel = null; if(!state.items.length) { state.v = state.curK.startsWith('BOSS') ? 'boss' : 'lessons'; } window.scrollTo(0,0); render(); }
        function startBossQ(s, n) { initAudio(); window.scrollTo(0,0); state.revealed = false; state.status = 'idle'; state.sel = null; state.items = state.errs.filter(i => i.s === s && i.n === n).map(i => ({...i, opts: [i.a, ...i.d].sort(()=>Math.random()-0.5)})).sort(()=>Math.random()-0.5); state.total = state.items.length; state.v = 'quiz'; state.curK = `BOSS-${s}-${n}`; render(); }
        function handleTS(e) { startX = e.touches[0].clientX; }
        function handleTM(e, id) { let diff = startX - e.touches[0].clientX; let el = document.getElementById('cont-' + id); if (diff > 60) { closeAllSwipes(); el.classList.add('swiped'); } else if (diff < -60) el.classList.remove('swiped'); }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(e => e.classList.remove('swiped')); }
        function playSound(f, t, d) { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime); g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); } catch(e) {} }
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        render();
    </script>
</body>
</html>
