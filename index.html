<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>MASSINE'S CHALLENGE V6.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background: #0a051a;
        background-image: radial-gradient(
          circle at center,
          #1e1b4b 0%,
          #0a051a 100%
        );
        color: white;
        overflow: hidden;
        height: 100vh;
        margin: 0;
      }
      .fn-button {
        clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%);
        transition: all 0.1s;
        text-transform: uppercase;
        font-weight: 900;
        font-style: italic;
      }
      .glass {
        background: rgba(6, 3, 20, 0.94);
        backdrop-filter: blur(15px);
        border: 2px solid rgba(59, 130, 246, 0.4);
      }
      .title-glow {
        text-shadow: 0 0 20px rgba(234, 179, 8, 0.5), 4px 4px 0px #eab308;
      }
      .text-header {
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: -2px;
        transform: skewX(-10deg);
      }
      .custom-scroll {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #eab308 transparent;
      }
      .flash-red {
        background-color: rgba(220, 38, 38, 0.4) !important;
        transition: background 0.1s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }
      .shake {
        animation: shake 0.1s ease-in-out 0s 2;
      }
    </style>
  </head>
  <body id="mainBody" class="flex items-center justify-center p-2">
    <div id="app" class="w-full max-w-6xl h-[94vh] flex flex-col"></div>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx;

      function playEffect(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === "correct") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(120, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      }

      let state = {
        view: "start",
        lessons: [],
        scriptUrl: localStorage.getItem("script_url") || "",
        selectedSubject: "",
        status: "idle",
      };

      async function fetchCloudData() {
        if (!state.scriptUrl) return;
        try {
          const response = await fetch(state.scriptUrl);
          const data = await response.json();
          state.lessons = data.lessons || [];
          render();
        } catch (e) {
          alert("Sync Error!");
        }
      }

      function render() {
        const container = document.getElementById("app");
        if (state.view === "start") {
          container.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-center p-4">
                    <h1 class="title-glow text-header text-5xl sm:text-9xl mb-10 leading-none uppercase italic">MASSINE'S CHALLENGE</h1>
                    <button onclick="playEffect('correct'); fetchCloudData(); state.view='subjects'; render();" class="fn-button bg-yellow-400 text-black text-4xl sm:text-7xl px-20 py-10 shadow-[0_10px_0_rgb(161,98,7)] active:translate-y-2">PLAY</button>
                    <p class="mt-8 text-white/20 text-[10px] uppercase font-black">v6.3 - Multi-Tab Master Sync</p>
                </div>`;
        } else if (state.view === "subjects") {
          container.innerHTML = `<div class="glass rounded-[30px] p-6 flex flex-col h-full w-full">
                    <h1 class="text-header text-4xl sm:text-7xl text-yellow-400 mb-8 text-center title-glow uppercase italic">SELECT MISSION</h1>
                    <div class="flex-1 custom-scroll grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-2">
                        ${["Frans", "Taal", "WO"]
                          .map(
                            (s) =>
                              `<button onclick="state.selectedSubject='${s.toUpperCase()}'; state.view='lessons'; render();" class="fn-button bg-white/5 border-l-[10px] border-yellow-400 text-3xl py-12 hover:bg-yellow-400 hover:text-black">${s}</button>`
                          )
                          .join("")}
                    </div>
                    <div class="mt-4 flex flex-col items-center"><button onclick="setCloudUrl()" class="text-white/20 text-[10px] uppercase font-black tracking-widest">⚙️ Cloud Setup</button></div></div>`;
        } else if (state.view === "lessons") {
          const filtered = state.lessons.filter(
            (l) => l.subject === state.selectedSubject
          );
          const themes = [...new Set(filtered.map((l) => l.theme))];
          container.innerHTML = `<div class="glass rounded-[30px] p-6 flex flex-col h-full w-full">
                    <div class="flex justify-between items-center mb-6"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-1 fn-button text-[10px] uppercase font-black tracking-tighter">← BACK</button>
                    <h1 class="text-header text-2xl text-white/40 uppercase tracking-widest italic">${
                      state.selectedSubject
                    }</h1></div>
                    <div class="flex-1 custom-scroll grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${
                          filtered.length === 0
                            ? '<div class="col-span-full text-center py-20 text-white/20 italic font-black">Geen lessen gevonden in de tabbladen.</div>'
                            : ""
                        }
                        ${themes
                          .map(
                            (
                              t
                            ) => `<div class="mb-4"><h3 class="bg-yellow-400 text-black font-black text-[10px] mb-3 px-3 py-1 uppercase inline-block italic skew-x-[-10deg]">${t}</h3><div class="space-y-2">
                            ${filtered
                              .filter((l) => l.theme === t)
                              .map(
                                (l) => `
                                <button onclick="startLesson('${l.subject}','${l.theme}','${l.name}')" class="w-full p-4 border-l-4 bg-white/5 border-white/10 text-left hover:bg-white/10 transition-all">
                                    <div class="font-black text-lg uppercase italic tracking-tighter">${l.name}</div>
                                    <div class="text-[9px] font-black uppercase text-white/30 tracking-widest italic text-xs">Start Mission</div>
                                </button>
                            `
                              )
                              .join("")}
                        </div></div>`
                          )
                          .join("")}
                    </div></div>`;
        } else if (state.view === "quiz") {
          const q = state.quizItems[0];
          container.innerHTML = `<div class="glass rounded-[30px] p-6 flex flex-col h-full text-center w-full">
                    <div class="flex justify-between items-center mb-6"><button onclick="state.view='lessons';render();" class="text-red-500 font-black text-[10px] uppercase tracking-widest">STOP</button>
                    <div class="h-2 flex-1 mx-4 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-yellow-400 transition-all duration-300" style="width: ${
                      ((state.totalQuestions - state.quizItems.length) /
                        state.totalQuestions) *
                      100
                    }%"></div></div>
                    <span class="text-header text-xl text-yellow-400 italic font-black">${
                      state.totalQuestions - state.quizItems.length + 1
                    }/${state.totalQuestions}</span></div>
                    <div class="flex-1 flex flex-col justify-center"><h2 class="text-header text-3xl sm:text-6xl mb-12 uppercase italic tracking-tighter">${
                      q.word
                    }</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${q.options
                      .map((opt) => {
                        let c = "bg-white/5 border-white/10 hover:bg-white/10";
                        if (state.status !== "idle") {
                          if (opt === q.correct)
                            c =
                              "bg-green-600 border-white scale-105 shadow-lg z-10";
                          else if (opt === state.selected)
                            c = "bg-red-600 border-white shake shadow-lg z-10";
                          else c = "opacity-20";
                        }
                        return `<button onclick="checkAnswer('${opt}')" class="fn-button p-6 text-xl sm:text-2xl border-2 italic font-black ${c}">${opt}</button>`;
                      })
                      .join("")}</div></div>
                    ${
                      state.status !== "idle"
                        ? `<button onclick="nextQuestion()" class="mt-6 w-full p-8 bg-yellow-400 text-black text-3xl sm:text-5xl fn-button font-black italic tracking-tighter">NEXT →</button>`
                        : '<div class="h-[120px]"></div>'
                    }
                </div>`;
        } else if (state.view === "result") {
          container.innerHTML = `<div class="glass rounded-[30px] p-10 flex flex-col items-center justify-center h-full text-center w-full">
                    <h1 class="text-header text-5xl sm:text-8xl mb-6 text-yellow-400 title-glow uppercase italic italic">MISSION COMPLETE</h1>
                    <div class="text-3xl font-black text-white/30 mb-10 uppercase italic tracking-widest">SCORE: ${state.percent}%</div>
                    <button onclick="state.view='lessons'; render();" class="fn-button bg-yellow-400 text-black text-4xl px-16 py-8 shadow-[0_6px_0_rgb(161,98,7)]">CONTINUE</button>
                </div>`;
        }
      }

      function checkAnswer(opt) {
        if (state.status !== "idle") return;
        state.selected = opt;
        const q = state.quizItems[0];
        const isCorrect = opt === q.correct;
        if (isCorrect) {
          if (!q.alreadyFailed) state.firstTryCorrect++;
          playEffect("correct");
        } else {
          q.alreadyFailed = true;
          playEffect("wrong");
          document.getElementById("mainBody").classList.add("flash-red");
          setTimeout(
            () =>
              document.getElementById("mainBody").classList.remove("flash-red"),
            200
          );
        }
        state.status = isCorrect ? "correct" : "wrong";
        render();
      }

      function nextQuestion() {
        const completedQ = state.quizItems.shift();
        if (state.status === "wrong") state.quizItems.push(completedQ);
        if (state.quizItems.length === 0) {
          state.percent = Math.round(
            (state.firstTryCorrect / state.totalQuestions) * 100
          );
          saveAction({
            type: "RESULT",
            subject: state.currentLesson.subject,
            theme: state.currentLesson.theme,
            name: state.currentLesson.name,
            percent: state.percent,
          });
          confetti({ particleCount: 200, spread: 100 });
          state.view = "result";
        } else {
          state.status = "idle";
        }
        render();
      }

      async function saveAction(payload) {
        if (state.scriptUrl)
          fetch(state.scriptUrl, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(payload),
          });
      }
      function startLesson(s, t, n) {
        state.currentLesson = state.lessons.find(
          (l) => l.subject === s && l.theme === t && l.name === n
        );
        state.quizItems = [...state.currentLesson.items].sort(
          () => Math.random() - 0.5
        );
        state.totalQuestions = state.quizItems.length;
        state.firstTryCorrect = 0;
        state.view = "quiz";
        state.status = "idle";
        render();
      }
      function setCloudUrl() {
        const url = prompt("Google Web-app URL:", state.scriptUrl);
        if (url) {
          state.scriptUrl = url;
          localStorage.setItem("script_url", url);
          fetchCloudData();
        }
      }
      render();
    </script>
  </body>
</html>
