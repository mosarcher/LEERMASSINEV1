<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE LOKAAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 15px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; border: none; touch-action: manipulation; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; margin-bottom: 0.5rem; }
        .progress-bar { height: 6px; background: #eab308; transition: width 0.3s ease; border-radius: 3px; }
        .btn-correct { background-color: #22c55e !important; color: white !important; }
        .btn-wrong { background-color: #ef4444 !important; color: white !important; }
    </style>
</head>
<body id="mainBody">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-4"></div>

    <script>
        let state = {
            view: 'init',
            lessons: JSON.parse(localStorage.getItem('massine_data') || '[]'),
            sheetUrl: localStorage.getItem('massine_url') || '',
            selectedSubject: '',
            quizItems: [],
            status: 'idle',
            scores: JSON.parse(localStorage.getItem('massine_scores') || '{}'),
            loading: false
        };

        async function importData(providedUrl = null) {
            const url = providedUrl || document.getElementById('urlInput').value;
            if (!url) return alert("Plak eerst de URL!");
            
            state.loading = true;
            render();

            const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);
            
            try {
                const res = await fetch(proxyUrl + "&t=" + Date.now());
                const json = await res.json();
                const csvData = json.contents;
                const lines = csvData.split(/\r?\n/).filter(l => l.trim() !== '');
                const lessonsMap = {};

                lines.slice(1).forEach(line => {
                    const c = line.split(/,(?=(?:(?:[^'\"]*\"[^'\"]*\"){2})*[^'\"]*$)/).map(x => x.replace(/^\"|\"$/g, '').trim());
                    if(c.length >= 7 && c[5] && c[6]) {
                        const s = (c[0] || 'FRANS').toUpperCase();
                        const t = c[1] || 'Thema';
                        const n = c[2] || 'Les';
                        const key = `${s}-${t}-${n}`;
                        if(!lessonsMap[key]) lessonsMap[key] = { subject: s, theme: t, name: n, items: [] };
                        lessonsMap[key].items.push({ word: c[5], correct: c[6], dists: c[7] ? c[7].split('|') : [] });
                    }
                });

                state.lessons = Object.values(lessonsMap);
                state.sheetUrl = url;
                localStorage.setItem('massine_data', JSON.stringify(state.lessons));
                localStorage.setItem('massine_url', url);
                state.loading = false;
                state.view = 'subjects';
                render();
            } catch (e) {
                state.loading = false;
                alert("Fout bij laden. Controleer de link.");
                render();
            }
        }

        function render() {
            const container = document.getElementById('app');
            
            if (state.loading) {
                container.innerHTML = `<div class="glass text-center py-20 font-black italic animate-pulse text-yellow-500 uppercase">Updating Mission...</div>`;
                return;
            }

            if (state.lessons.length === 0 || state.view === 'init') {
                container.innerHTML = `
                    <div class="glass text-center p-8">
                        <h1 class="text-3xl font-black italic mb-6">SETUP MISSION</h1>
                        <input id="urlInput" type="text" value="${state.sheetUrl}" placeholder="Plak Google CSV URL hier..." class="w-full p-4 mb-4 bg-white/10 border border-white/20 rounded-xl text-white">
                        <button onclick="importData()" class="fn-button bg-yellow-400 text-black py-4 italic">IMPORTEER DATA</button>
                    </div>`;
                return;
            }

            if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                container.innerHTML = `
                    <div class="glass w-full max-w-md">
                        <h2 class="text-2xl text-yellow-400 mb-6 text-center font-black italic uppercase text-white">Select Subject</h2>
                        <div class="grid gap-4 scroll-area">
                            ${subs.map(s => `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-8 text-xl italic">${s}</button>`).join('')}
                        </div>
                        <div class="flex flex-col gap-2 mt-6">
                            <button onclick="importData(state.sheetUrl)" class="fn-button bg-green-600 text-white py-3 text-xs italic uppercase">↻ Sync New Data</button>
                            <button onclick="if(confirm('Nieuwe link?')){state.view='init'; render();}" class="opacity-30 text-[10px] uppercase italic underline text-center">Change URL</button>
                        </div>
                    </div>`;
            } 
            else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `
                    <div class="glass w-full max-w-md">
                        <div class="flex justify-between mb-4">
                            <button onclick="state.view='subjects'; render();" class="text-yellow-400 font-black italic uppercase text-sm">← BACK</button>
                            <h2 class="text-white font-black italic uppercase">${state.selectedSubject}</h2>
                        </div>
                        <div class="scroll-area">
                            ${themes.map(t => `<div class="theme-label">${t}</div>` + filtered.filter(l => l.theme === t).map(l => {
                                const key = `${l.subject}-${l.theme}-${l.name}`;
                                return `<button onclick="startQuiz('${l.subject}','${l.theme}','${l.name}')" class="fn-button bg-white/10 py-5 mb-2 text-left pl-6 italic relative">
                                    ${l.name} ${state.scores[key] ? '<span class="text-green-400 ml-auto mr-4">✓</span>' : ''}
                                </button>`;
                            }).join('')).join('')}
                        </div>
                    </div>`;
            }
            else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `
                    <div class="glass w-full max-w-2xl">
                        <div class="flex justify-between items-center mb-4">
                            <button onclick="state.view='lessons'; render();" class="text-red-500 font-black italic uppercase">STOP</button>
                            <div class="flex-1 mx-4 bg-white/10 h-2 rounded-full overflow-hidden">
                                <div class="progress-bar" style="width: ${((state.total - state.quizItems.length) / state.total) * 100}%"></div>
                            </div>
                            <span class="text-xs italic">${state.quizItems.length} LEFT</span>
                        </div>
                        <h2 class="text-4xl text-center my-12 font-black italic uppercase tracking-tighter">${q.word}</h2>
                        <div class="grid gap-3">
                            ${q.options.map(opt => {
                                let style = "bg-white/10";
                                if(state.status !== 'idle') {
                                    if(opt === q.correct) style = "btn-correct";
                                    else if(opt === state.selected) style = "btn-wrong";
                                    else style = "opacity-20";
                                }
                                return `<button onclick="handleAnswer('${opt}')" class="fn-button py-6 text-xl italic ${style}">${opt}</button>`;
                            }).join('')}
                        </div>
                        ${state.status !== 'idle' ? `<button onclick="nextQ()" class="mt-6 bg-yellow-400 text-black py-4 fn-button italic font-black">CONTINUE →</button>` : ''}
                    </div>`;
            }
        }

        function startQuiz(s, t, n) {
            const lesson = state.lessons.find(l => l.subject === s && l.theme === t && l.name === n);
            state.currentKey = `${s}-${t}-${n}`;
            const allAns = lesson.items.map(i => i.correct);
            state.quizItems = lesson.items.map(item => {
                let opts = [item.correct, ...item.dists];
                while(opts.length < 4) {
                    const r = allAns[Math.floor(Math.random()*allAns.length)];
                    if(!opts.includes(r)) opts.push(r);
                }
                return { ...item, options: opts.sort(() => Math.random() - 0.5) };
            }).sort(() => Math.random() - 0.5);
            state.total = state.quizItems.length;
            state.view = 'quiz';
            render();
        }

        function handleAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt;
            const q = state.quizItems[0];
            if (opt === q.correct) {
                state.status = 'correct';
            } else {
                state.status = 'wrong';
                state.quizItems.push({...q});
            }
            render();
        }

        function nextQ() {
            state.quizItems.shift();
            state.status = 'idle';
            state.selected = null;
            if (state.quizItems.length === 0) {
                confetti({ particleCount: 150, spread: 70 });
                state.scores[state.currentKey] = true;
                localStorage.setItem('massine_scores', JSON.stringify(state.scores));
                state.view = 'lessons';
            }
            render();
        }

        render();
    </script>
</body>
</html>
