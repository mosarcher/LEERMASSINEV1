endschap","de hulp","de fusie"]},{"s":"TAAL","t":"T5: Woordenschat","n":"Les 6","q":"de winst","a":"het geld dat overblijft","d":["het verlies","de schuld","de prijs"]},{"s":"TAAL","t":"T5: Woordenschat","n":"Les 6","q":"de investering","a":"geld ergens in steken","d":["geld uitgeven","geld sparen","geld lenen"]},{"s":"TAAL","t":"T5: Woordenschat","n":"Les 6","q":"de marketing","a":"reclame maken","d":["iets maken","iets kopen","iets weggooien"]},{"s":"TAAL","t":"T5: Woordenschat","n":"Les 6","q":"de doelgroep","a":"voor wie het bedoeld is","d":["iedereen","de vijand","de baas"]},{"s":"TAAL","t":"T5: Woordenschat","n":"Les 6","q":"de lancering","a":"het begin van verkoop","d":["de finish","de pauze","de stop"]},{"s":"TAAL","t":"T5: Woordenschat","n":"Les 6","q":"uniek","a":"er is er maar één","d":["normaal","gewoon","saai"]}
                           ];

        let state = {
            view: 'landing', lessons: [], selectedSubject: '', status: 'idle', quizItems: [],
            totalInRound: 0, correctInRound: 0, selected: null,
            scores: JSON.parse(localStorage.getItem('m_scores_v22') || '{}'),
            wrongAnswers: JSON.parse(localStorage.getItem('m_wrongs_v22') || '[]')
        };

        function prepareData() {
            const map = {};
            MIJN_DATA.forEach(i => {
                const k = `${i.s}-${i.t}`;
                if (!map[k]) map[k] = { subject: i.s, theme: i.t, items: [] };
                map[k].items.push({ 
                    subject: i.s, theme: i.t, lesson: i.n, word: i.q, correct: i.a, 
                    options: [i.a, ...i.d].filter(x => x !== "").sort(() => Math.random() - 0.5) 
                });
            });
            state.lessons = Object.values(map);
        }

        function render() {
            const c = document.getElementById('app');
            if (state.view === 'landing') {
                c.innerHTML = `<div class="glass w-full max-w-md p-8 text-center"><h1 class="text-4xl font-black italic uppercase text-yellow-400 mb-8">Massine's<br>Challenge</h1><button onclick="initAudio(); state.view='subjects'; render();" class="fn-button bg-yellow-400 text-black py-8 text-2xl">START MISSION</button></div>`;
            } else if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                c.innerHTML = `<div class="glass w-full max-w-md p-4"><h1 class="text-3xl text-yellow-400 mb-6 text-center font-black italic uppercase">Missions</h1><div class="grid gap-4"><button onclick="state.view='boss_menu'; render();" class="fn-button bg-orange-600 py-6 text-xl italic mb-2">🔥 BOSS LEVELS (${state.wrongAnswers.length}) 🔥</button><div class="subject-grid">${subs.map(s => { let icon = s.includes('WO')?'🌍':s.includes('FRANS')?'🇫🇷':'🇳🇱'; return `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-10 text-xl italic border border-white/5 flex flex-col"><span class="text-4xl mb-2">${icon}</span><span>${s}</span></button>`; }).join('')}</div></div></div>`;
            } else if (state.view === 'boss_menu') {
                const wr = state.wrongAnswers; const bSubs = [...new Set(wr.map(i => i.subject))];
                c.innerHTML = `<div class="glass w-full max-w-md p-3"><div class="flex justify-between mb-4 px-2"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-xs">← BACK</button><h2 class="text-xl font-black italic uppercase text-orange-500">BOSS</h2></div><div class="scroll-area pb-10">${wr.length === 0 ? '<p class="text-center italic mt-10">Geen fouten!</p>' : bSubs.map(s => { const subWr = wr.filter(i => i.subject === s); const bTh = [...new Set(subWr.map(i => i.theme))]; return `<div class="theme-label bg-orange-600 mt-4">${s} (${subWr.length})</div>` + bTh.map(t => `<button onclick="startBossQuiz('${s}','${t}')" class="fn-button bg-white/5 py-4 mb-2 text-left pl-6 italic border border-orange-900/30"><span>${t} (${subWr.filter(i=>i.theme===t).length})</span></button>`).join(''); }).join('')}</div></div>`;
            } else if (state.view === 'lessons') {
                const f = state.lessons.filter(l => l.subject === state.selectedSubject);
                c.innerHTML = `<div class="glass w-full max-w-md p-3"><div class="flex justify-between mb-4 px-2"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-xs">← BACK</button><h2 class="text-xl font-black italic uppercase">${state.selectedSubject}</h2></div><div class="scroll-area">${f.map(l => { 
                    const k = `${l.subject}-${l.theme}`; 
                    const id = 'id'+Math.random().toString(36).substr(2,5); 
                    const progress = state.scores[k] ? '100%' : '0%';
                    return `<div class="swipe-container" id="container-${id}"><div class="swipe-actions"><button onclick="resetScore('${k}')" class="btn-reset">RESET</button></div><div class="swipe-main" id="${id}" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, '${id}')"><button onclick="startQuiz('${l.subject}','${l.theme}')" class="fn-button bg-white/10 py-6 text-left pl-6 italic relative"><span>${l.theme}</span><div class="lesson-progress-bar" style="width: ${progress}"></div></button></div></div>`; 
                }).join('')}</div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                c.innerHTML = `<div class="glass w-full max-w-4xl max-h-[95dvh] relative overflow-hidden flex flex-col p-4"><div class="flex justify-between items-center mb-4 flex-shrink-0"><button onclick="state.view='${state.currentKey.startsWith('BOSS')?'boss_menu':'lessons'}'; render();" class="text-red-500 font-black italic uppercase text-xs">STOP</button><div class="text-yellow-400 font-black italic uppercase">${state.correctInRound}/${state.totalInRound}</div><span class="text-white font-black italic text-xs uppercase">${state.quizItems.length} LEFT</span></div><div class="scroll-area flex-grow pb-24"><h2 class="text-2xl text-center my-8 font-black italic uppercase leading-tight">${q.word}</h2><div class="grid gap-2">${q.options.map(o => { let cl = "bg-white/10"; if(state.status !== 'idle'){ if(o === q.correct) cl = "btn-correct-final"; else if(o === state.selected) cl = "btn-wrong-final"; else cl = "btn-dimmed"; } return `<button onclick="handleAnswer('${o}')" class="fn-button py-4 text-base italic ${cl}">${o}</button>` }).join('')}</div></div>${state.status !== 'idle' ? `<div class="absolute bottom-4 left-0 w-full px-4 z-50"><button onclick="nextQ()" class="bg-yellow-400 text-black py-5 fn-button italic font-black uppercase tracking-widest w-full">Next →</button></div>` : ''}</div>`;
            }
        }
        function startQuiz(s, t) { state.currentKey = `${s}-${t}`; state.quizItems = state.lessons.find(l => l.subject === s && l.theme === t).items.map(i => ({...i, f: 0})).sort(() => Math.random() - 0.5); state.totalInRound = state.quizItems.length; state.correctInRound = 0; state.view = 'quiz'; render(); }
        function startBossQuiz(s, t) { state.currentKey = `BOSS-${s}-${t}`; state.quizItems = state.wrongAnswers.filter(i => i.subject === s && i.theme === t).map(i => ({...i, f: 0})).sort(() => Math.random() - 0.5); state.totalInRound = state.quizItems.length; state.correctInRound = 0; state.view = 'quiz'; render(); }
        function handleAnswer(o) {
            if (state.status !== 'idle') return; state.selected = o; const q = state.quizItems[0];
            if (o === q.correct) { 
                state.status = 'correct'; state.correctInRound++; playSound(880, 'sine', 0.1); confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } }); 
                if(state.currentKey.startsWith('BOSS')) {
                    state.wrongAnswers = state.wrongAnswers.filter(i => i.word !== q.word);
                    localStorage.setItem('m_wrongs_v22', JSON.stringify(state.wrongAnswers));
                }
            } else { 
                state.status = 'wrong'; playSound(220, 'square', 0.2); 
                if (!state.wrongAnswers.some(i => i.word === q.word)) {
                    state.wrongAnswers.push({...q}); localStorage.setItem('m_wrongs_v22', JSON.stringify(state.wrongAnswers));
                }
                if(!state.currentKey.startsWith('BOSS')) { q.f = (q.f || 0) + 1; if (q.f < 2) state.quizItems.push({...q}); }
            }
            render();
        }
        function nextQ() { 
            state.quizItems.shift(); state.status = 'idle'; state.selected = null; 
            if (state.quizItems.length === 0) { 
                if(!state.currentKey.startsWith('BOSS')) state.scores[state.currentKey] = true; 
                localStorage.setItem('m_scores_v22', JSON.stringify(state.scores)); 
                state.view = state.currentKey.startsWith('BOSS') ? 'boss_menu' : 'lessons'; 
            } 
            render(); 
        }
        function resetScore(k) { delete state.scores[k]; localStorage.setItem('m_scores_v22', JSON.stringify(state.scores)); closeAllSwipes(); render(); }
        let sX = 0; function handleTS(e) { sX = e.touches[0].clientX; }
        function handleTM(e, id) { let d = sX - e.touches[0].clientX; let c = document.getElementById('container-' + id); if (d > 50) { closeAllSwipes(); c.classList.add('swiped'); } else if (d < -50) c.classList.remove('swiped'); }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(e => e.classList.remove('swiped')); }
        prepareData(); render();
    </script>
