<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V17.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 10px; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; border: none; touch-action: manipulation; }
        .scroll-area { overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA7MUx5TsNqqMxQua7ieWURRHXrxlMn_j4M96pmerRHmCoRe9D-TKQ-kkuNIeeWzBsoJt5aF4ZXTkt/pub?output=csv";
        
        let state = {
            view: 'loading',
            lessons: [],
            selectedSubject: '',
            scores: JSON.parse(localStorage.getItem('massine_scores') || '{}')
        };

        async function initApp() {
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(CSV_URL)}&t=${Date.now()}`);
                const json = await res.json();
                const lines = json.contents.split(/\r?\n/).filter(l => l.trim() !== '');
                const lessonsMap = {};

                lines.slice(1).forEach(line => {
                    const c = line.split(/,(?=(?:(?:[^'\"]*\"[^'\"]*\"){2})*[^'\"]*$)/).map(x => x.replace(/^\"|\"$/g, '').trim());
                    if(c.length >= 7 && c[5]) {
                        const s = (c[0] || 'OVERIG').toUpperCase().trim();
                        const t = c[1] || 'Algemeen';
                        const n = c[2] || 'Les';
                        const key = `${s}-${t}-${n}`;
                        if(!lessonsMap[key]) lessonsMap[key] = { subject: s, theme: t, name: n, items: [] };
                        lessonsMap[key].items.push({ word: c[5], correct: c[6], dists: c[7] ? c[7].split('|') : [] });
                    }
                });

                state.lessons = Object.values(lessonsMap);
                state.view = 'subjects';
                render();
            } catch (e) {
                document.getElementById('app').innerHTML = `<div class="glass p-10 text-center uppercase font-black italic">Netwerk Fout. Herlaad de pagina.</div>`;
            }
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'loading') {
                container.innerHTML = `<div class="glass p-10 text-center animate-pulse font-black italic">LOADING DATA...</div>`;
                return;
            }

            if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                container.innerHTML = `<div class="glass w-full max-w-md">
                    <h2 class="text-2xl text-yellow-400 mb-6 text-center font-black italic uppercase">Missions</h2>
                    <div class="grid gap-4">
                        ${subs.map(s => `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-8 text-xl italic">${s}</button>`).join('')}
                    </div>
                    <button onclick="localStorage.clear(); location.reload();" class="mt-8 text-[10px] opacity-20 uppercase italic text-center">Hard Reset App</button>
                </div>`;
            }
            // ... (Hier komen de andere views uit v17.1)
        }

        initApp();
    </script>
</body>
</html>
