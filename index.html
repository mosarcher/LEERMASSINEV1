<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V17.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 10px; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; border: none; touch-action: manipulation; }
        .scroll-area { overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; margin-bottom: 0.5rem; }
        
        /* Swipe & Progress */
        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; flex-shrink: 0; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 50; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .swiped .swipe-actions { opacity: 1; pointer-events: auto; }
        .action-btn { height: 100%; padding: 0 15px; font-weight: 900; font-size: 0.7rem; color: white; border: none; text-transform: uppercase; }
        .btn-reset { background: #3b82f6; }
        .swiped .fn-button { transform: translateX(-80px); }
        .lesson-progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #22c55e; transition: width 0.4s ease; }
        
        /* Quiz States */
        .btn-correct { background-color: #22c55e !important; color: white !important; border: 2px solid white !important; }
        .btn-wrong { background-color: #ef4444 !important; color: white !important; animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</head>
<body id="mainBody" onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>

    <script>
        // --- VOEG HIER JE VRAGEN TOE (VAK, THEMA, LES, VRAAG, ANTWOORD) ---
        const MIJN_DATA = [
            { s: "FRANS", t: "Unité 1", n: "Les A", q: "Bonjour", a: "Goeiedag" },
            { s: "FRANS", t: "Unité 1", n: "Les A", q: "Merci", a: "Bedankt" },
            { s: "TAAL", t: "Thema 5", n: "Spelling 1", q: "Hond (meervoud)", a: "Honden" },
            { s: "WO", t: "Natuur", n: "Bomen", q: "De eik", a: "Eikel" }
        ];

        let state = {
            view: 'start',
            lessons: [],
            selectedSubject: '',
            status: 'idle',
            quizItems: [],
            totalQuestions: 0,
            selected: null,
            scores: JSON.parse(localStorage.getItem('massine_scores_v17') || '{}')
        };

        function prepareData() {
            const lessonsMap = {};
            MIJN_DATA.forEach(item => {
                const key = `${item.s}-${item.t}-${item.n}`;
                if (!lessonsMap[key]) lessonsMap[key] = { subject: item.s, theme: item.t, name: item.n, items: [] };
                lessonsMap[key].items.push({ word: item.q, correct: item.a });
            });
            state.lessons = Object.values(lessonsMap);
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="text-5xl mb-8 font-black italic text-yellow-400">MASSINE'S CHALLENGE</h1><button onclick="state.view='subjects'; render();" class="fn-button bg-yellow-400 text-black text-3xl px-12 py-6 mx-auto italic">START</button></div>`;
            } else if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                container.innerHTML = `<div class="glass w-full max-w-md"><h2 class="text-2xl text-yellow-400 mb-6 text-center font-black italic uppercase">Missions</h2><div class="grid gap-3 scroll-area">
                    <button onclick="state.view='boss'; render();" class="fn-button bg-orange-600 py-6 text-xl italic mb-2">🔥 BOSS LEVELS 🔥</button>
                    ${subs.map(s => `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-8 text-xl italic">${s}</button>`).join('')}
                    <button onclick="if(confirm('Scores wissen?')){state.scores={}; localStorage.clear(); render();}" class="opacity-20 text-[10px] mt-4 uppercase italic">Reset All Progress</button>
                </div></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><div class="flex items-center justify-between mb-4"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase rounded">← BACK</button><h2 class="text-xl italic uppercase font-black">${state.selectedSubject}</h2></div><div class="scroll-area">
                    ${themes.map(t => `<div class="theme-label">${t}</div>` + filtered.filter(l => l.theme === t).map(l => {
                        const key = `${l.subject}-${l.theme}-${l.name}`;
                        const lid = 'id' + Math.random().toString(36).substr(2, 5);
                        return `<div class="swipe-container"><div class="swipe-actions"><button onclick="resetLesson('${key}')" class="action-btn btn-reset">RESET</button></div><div id="${lid}" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, '${lid}')" class="w-full h-full transition-transform duration-200"><button onclick="startQuiz('${l.subject}','${l.theme}','${l.name}')" class="fn-button bg-white/10 text-lg py-5 text-left pl-6 italic"><span>${l.name}</span>${state.scores[key] ? '<div class="lesson-progress-bar" style="width: 100%"></div>' : ''}</button></div></div>`
                    }).join('')).join('')}</div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                const progress = ((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100;
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl"><div class="flex justify-between items-center mb-4"><button onclick="state.view='lessons'; render();" class="text-red-600 font-black italic">STOP</button><div class="h-2 flex-1 mx-4 bg-white/10 rounded-full"><div class="h-full bg-yellow-400" style="width: ${progress}%"></div></div><span class="text-yellow-400 font-black">${state.quizItems.length}</span></div><h2 class="text-4xl text-center mb-12 font-black italic uppercase">${q.word}</h2><div class="grid gap-3">${q.options.map(opt => {
                    let cl = "bg-white/10"; if(state.status !== 'idle'){ if(opt===q.correct) cl="btn-correct"; else if(opt===state.selected) cl="btn-wrong"; else cl="opacity-10"; }
                    return `<button onclick="handleAns('${opt}')" class="fn-button py-6 text-xl italic ${cl}">${opt}</button>`
                }).join('')}</div>${state.status !== 'idle' ? `<button onclick="nextQ()" class="mt-6 bg-yellow-400 text-black py-4 fn-button italic font-black uppercase">Next →</button>` : ''}</div>`;
            }
        }

        function startQuiz(s, t, n) {
            const lesson = state.lessons.find(l => l.subject === s && l.theme === t && l.name === n);
            state.currentKey = `${s}-${t}-${n}`;
            const allAns = lesson.items.map(i => i.correct);
            state.quizItems = lesson.items.map(item => {
                let opts = [item.correct];
                let pool = allAns.filter(a => a !== item.correct).sort(() => Math.random() - 0.5);
                opts.push(...pool.slice(0, 3));
                while(opts.length < 4) opts.push("---");
                return { ...item, options: opts.sort(() => Math.random() - 0.5) };
            }).sort(() => Math.random() - 0.5);
            state.totalQuestions = state.quizItems.length;
            state.view = 'quiz'; render();
        }

        function handleAns(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt;
            if (opt === state.quizItems[0].correct) { state.status = 'correct'; } 
            else { state.status = 'wrong'; state.quizItems.push({...state.quizItems[0]}); }
            render();
        }

        function nextQ() {
            state.quizItems.shift(); state.status = 'idle'; state.selected = null;
            if (state.quizItems.length === 0) {
                confetti({ particleCount: 150, spread: 70 });
                state.scores[state.currentKey] = true;
                localStorage.setItem('massine_scores_v17', JSON.stringify(state.scores));
                state.view = 'lessons';
            }
            render();
        }

        function resetLesson(key) { delete state.scores[key]; localStorage.setItem('massine_scores_v17', JSON.stringify(state.scores)); render(); }

        let startX = 0;
        function handleTS(e) { startX = e.touches[0].clientX; }
        function handleTM(e, id) { 
            const diff = startX - e.touches[0].clientX;
            const el = document.getElementById(id).parentElement;
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); }
            else if (diff < -50) el.classList.remove('swiped');
        }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(el => el.classList.remove('swiped')); }

        prepareData();
        render();
    </script>
</body>
</html>
