

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; overflow: hidden; height: 100vh; margin: 0; }
        
        /* Foto weer op VOLLE sterkte */
        #bg-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            opacity: 1; 
        }

        /* Overlay nu heel transparant */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(10, 5, 26, 0.2) 0%, rgba(10, 5, 26, 0.5) 100%); 
            z-index: -1; 
        }

        .fn-button { clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%); transition: all 0.1s; text-transform: uppercase; font-weight: 900; font-style: italic; }
        .glass { background: rgba(10, 5, 26, 0.75); backdrop-filter: blur(8px); border: 2px solid rgba(234, 179, 8, 0.5); }
        .title-glow { text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 20px rgba(234, 179, 8, 0.6); }
        .text-header { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1px; transform: skewX(-10deg); text-shadow: 2px 2px 10px rgba(0,0,0,1); }
        .custom-scroll { overflow-y: auto; }
        .flash-red { background-color: rgba(220, 38, 38, 0.6) !important; transition: background 0.1s; }
    </style>
</head>
<body id="mainBody" class="flex items-center justify-center p-2">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="w-full max-w-6xl h-[94vh] flex flex-col"></div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        const DEFAULT_BG = "https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png";
        
        window.addEventListener('load', () => {
            const savedBg = localStorage.getItem('massine_bg');
            document.getElementById('bg-container').style.backgroundImage = `url('${savedBg || DEFAULT_BG}')`;
        });

        function playEffect(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v6') || '[]'), 
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle'
        };

        async function fetchCloudData() {
            if (!state.scriptUrl) return;
            try {
                const response = await fetch(state.scriptUrl);
                const data = await response.json();
                if (data.lessons) {
                    state.lessons = data.lessons;
                    localStorage.setItem('study_data_v6', JSON.stringify(data.lessons));
                }
                render();
            } catch(e) { console.error("Sync Error"); }
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-center p-4">
                    <h1 class="title-glow text-header text-6xl sm:text-9xl mb-12 uppercase italic font-black">MASSINE'S CHALLENGE</h1>
                    <button onclick="playEffect('correct'); fetchCloudData().then(() => { state.view='subjects'; render(); });" class="fn-button bg-yellow-400 text-black text-4xl sm:text-7xl px-20 py-10 shadow-[0_12px_0_rgb(161,98,7)] active:translate-y-2">PLAY</button>
                    <div class="mt-16 flex gap-6">
                        <button onclick="setCloudUrl()" class="text-white/60 text-[10px] uppercase font-black bg-black/40 px-3 py-1 rounded">⚙️ Excel Link</button>
                    </div>
                </div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass rounded-[40px] p-8 flex flex-col h-full w-full">
                    <h1 class="text-header text-4xl sm:text-7xl text-yellow-400 mb-10 text-center title-glow uppercase italic">VAKKEN</h1>
                    <div class="flex-1 custom-scroll grid grid-cols-1 gap-5 p-2">
                        ${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedSubject='${s.toUpperCase()}'; state.view='lessons'; render();" class="fn-button bg-white/10 border-l-[12px] border-yellow-400 text-3xl py-12 hover:bg-yellow-400 hover:text-black transition-all">${s}</button>`).join('')}
                    </div>
                </div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass rounded-[40px] p-8 flex flex-col h-full w-full">
                    <div class="flex justify-between items-center mb-8"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-6 py-2 fn-button text-[12px] uppercase font-black">← BACK</button>
                    <h1 class="text-header text-3xl text-white uppercase italic">${state.selectedSubject}</h1></div>
                    <div class="flex-1 custom-scroll space-y-8">
                        ${themes.map(t => `<div class="mb-6"><h3 class="bg-yellow-400 text-black font-black text-[12px] mb-4 px-4 py-1.5 uppercase inline-block italic skew-x-[-12deg] tracking-widest">${t}</h3><div class="grid grid-cols-1 gap-3">
                            ${filtered.filter(l => l.theme === t).map(l => `<button onclick="startLesson('${l.subject}','${l.theme}','${l.name}')" class="w-full p-6 border-l-4 bg-white/10 border-white/20 text-left hover:border-yellow-400 font-black uppercase italic tracking-tighter text-2xl">${l.name}</button>`).join('')}
                        </div></div>`).join('')}
                    </div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass rounded-[40px] p-8 flex flex-col h-full text-center w-full">
                    <div class="flex justify-between items-center mb-8"><button onclick="state.view='lessons';render();" class="text-red-500 font-black text-[14px] bg-black/40 px-3 py-1 uppercase tracking-widest">STOP</button>
                    <div class="h-3 flex-1 mx-6 bg-white/10 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-header text-2xl text-yellow-400 italic">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="flex-1 flex flex-col justify-center"><h2 class="text-header text-3xl sm:text-6xl mb-14 uppercase italic tracking-tighter leading-tight">${q.word}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">${q.options.map(opt => {
                        let c = "bg-white/10 border-white/20";
                        if (state.status !== 'idle') { if (opt === q.correct) c = "bg-green-600 border-white scale-105 shadow-lg z-10"; else if (opt === state.selected) c = "bg-red-600 border-white shadow-lg z-10"; else c = "opacity-30"; }
                        return `<button onclick="checkAnswer('${opt}')" class="fn-button p-7 text-xl sm:text-2xl border-2 italic font-black ${c} transition-all">${opt}</button>`;
                    }).join('')}</div></div>
                    ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-8 w-full p-10 bg-yellow-400 text-black text-4xl fn-button font-black italic shadow-[0_10px_0_rgb(161,98,7)]">VOLGENDE →</button>` : '<div class="h-[140px]"></div>'}
                </div>`;
            } else if (state.view === 'result') {
                container.innerHTML = `<div class="glass rounded-[40px] p-12 flex flex-col items-center justify-center h-full text-center w-full border-4 border-yellow-400">
                    <h1 class="text-header text-7xl sm:text-9xl mb-10 text-yellow-400 title-glow uppercase italic">KLAAR!</h1>
                    <div class="text-4xl font-black text-white mb-12 uppercase italic">SCORE: ${state.percent}%</div>
                    <button onclick="state.view='lessons'; render();" class="fn-button bg-yellow-400 text-black text-5xl px-24 py-12 shadow-[0_12px_0_rgb(161,98,7)]">CONTINUE</button>
                </div>`;
            }
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt; const q = state.quizItems[0]; const isCorrect = opt === q.correct;
            if (isCorrect) { if (!q.alreadyFailed) state.firstTryCorrect++; playEffect('correct'); }
            else { q.alreadyFailed = true; playEffect('wrong'); document.getElementById('mainBody').classList.add('flash-red'); setTimeout(() => document.getElementById('mainBody').classList.remove('flash-red'), 200); }
            state.status = isCorrect ? 'correct' : 'wrong'; render();
        }

        function nextQuestion() {
            const completedQ = state.quizItems.shift(); if (state.status === 'wrong') state.quizItems.push(completedQ);
            if (state.quizItems.length === 0) {
                state.percent = Math.round((state.firstTryCorrect / state.totalQuestions) * 100);
                saveAction({ type: "RESULT", subject: state.currentLesson.subject, theme: state.currentLesson.theme, name: state.currentLesson.name, percent: state.percent });
                confetti({ particleCount: 200, spread: 100 }); state.view = 'result';
            } else { state.status = 'idle'; }
            render();
        }

        async function saveAction(payload) { if (state.scriptUrl) fetch(state.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); }
        function startLesson(s,t,n) { state.currentLesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n); state.quizItems = [...state.currentLesson.items].sort(() => Math.random() - 0.5); state.totalQuestions = state.quizItems.length; state.firstTryCorrect = 0; state.view = 'quiz'; state.status = 'idle'; render(); }
        function setCloudUrl() { const url = prompt("Google Web App URL:", state.scriptUrl); if (url) { state.scriptUrl = url; localStorage.setItem('script_url', url); fetchCloudData(); } }
        render();
    </script>
</body>
</html>
