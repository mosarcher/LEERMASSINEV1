

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V13.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; -webkit-overflow-scrolling: touch; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; touch-action: manipulation; }
        
        .btn-correct-final { background-color: #00ff00 !important; color: black !important; border: 4px solid white !important; opacity: 1 !important; z-index: 20; }
        .btn-wrong-final { background-color: #ff0000 !important; color: white !important; border: 4px solid white !important; opacity: 1 !important; animation: hard-shake 0.4s ease-in-out; }
        .btn-dimmed { opacity: 0.05 !important; }

        @keyframes hard-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }

        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; flex-shrink: 0; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; opacity: 0; }
        .swiped .swipe-actions { opacity: 1; }
        .action-btn { height: 100%; padding: 0 15px; font-weight: 900; font-size: 0.7rem; color: white; border: none; text-transform: uppercase; }
        .btn-reset { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
        .swiped .fn-button { transform: translateX(-150px); }
        .swiped .quiz-q-inner { transform: translateX(-100px); }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .resume-pill { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #eab308; color: black; font-size: 0.55rem; padding: 3px 7px; border-radius: 99px; font-weight: 900; z-index: 10; }
        .subject-icon { font-size: 1.2em; margin-right: 8px; font-style: normal; }
        .back-btn { width: auto !important; padding: 0 15px !important; height: 35px !important; font-size: 0.75rem !important; flex-shrink: 0; }
        .quiz-q-text { font-weight: 900; font-style: italic; text-transform: uppercase; transition: transform 0.2s; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1rem; margin-bottom: 0.6rem; padding: 0.3rem 1rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); }
    </style>
</head>
<body id="mainBody" onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>
    <div class="version-tag" style="position:fixed; bottom:5px; right:10px; font-size:10px; opacity:0.3;">v13.7</div>

    <script>
        const images = ["massinewall.png", "massinewall1.png", "massinewall2.png", "massinewall3.png", "massinewall4.png"];
        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'),
            checkpoints: JSON.parse(localStorage.getItem('checkpoints_v1') || '{}'),
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle' 
        };

        window.addEventListener('load', () => { 
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png')`;
            render(); 
            if (state.scriptUrl) fetchCloudData();
        });

        async function fetchCloudData() { 
            try { 
                const res = await fetch(state.scriptUrl + `&t=${Date.now()}`); 
                const d = await res.json(); 
                if (d.lessons) { 
                    state.lessons = d.lessons; 
                    localStorage.setItem('study_data_v7', JSON.stringify(d.lessons)); 
                    if (state.view !== 'quiz') render();
                } 
            } catch(e) {} 
        }

        function startLesson(s,t,n, resume = false) {
            const lesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n);
            if (!lesson) return;
            const key = `${s}-${t}-${n}`;
            if (resume && state.checkpoints[key]) {
                const cp = state.checkpoints[key];
                state.quizItems = cp.items;
                state.totalQuestions = cp.total;
                state.firstTryCorrect = cp.correct;
            } else {
                state.quizItems = [...lesson.items].sort(() => Math.random() - 0.5);
                state.totalQuestions = state.quizItems.length;
                state.firstTryCorrect = 0;
            }
            state.currentLesson = { subject:s, theme:t, name:n };
            state.status = 'idle';
            navigate('quiz');
        }

        function navigate(v) { 
            const img = images[Math.floor(Math.random()*images.length)];
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/${img}')`;
            state.view = v; 
            render(); 
        }

        function checkAnswer(opt) { 
            if (state.status !== 'idle') return; 
            state.selected = opt; 
            const q = state.quizItems[0]; 
            state.status = (opt === q.correct) ? 'correct' : 'wrong'; 
            if (state.status === 'correct' && !q.alreadyFailed) state.firstTryCorrect++;
            if (state.status === 'wrong') q.alreadyFailed = true;
            render(); 
        }

        function nextQuestion() { 
            const q = state.quizItems.shift(); 
            if (state.status === 'wrong') state.quizItems.push(q); 
            if (state.quizItems.length === 0) { 
                delete state.checkpoints[`${state.currentLesson.subject}-${state.currentLesson.theme}-${state.currentLesson.name}`];
                localStorage.setItem('checkpoints_v1', JSON.stringify(state.checkpoints));
                confetti({ particleCount: 150, spread: 70 }); navigate('lessons'); 
            } else { 
                state.status = 'idle'; 
                const key = `${state.currentLesson.subject}-${state.currentLesson.theme}-${state.currentLesson.name}`;
                state.checkpoints[key] = { items: state.quizItems, total: state.totalQuestions, correct: state.firstTryCorrect };
                localStorage.setItem('checkpoints_v1', JSON.stringify(state.checkpoints));
                render(); 
            } 
        }

        let startX = 0;
        function handleTouchStart(e) { startX = e.touches[0].clientX; }
        function handleTouchMove(e, id) {
            const diff = startX - e.touches[0].clientX;
            const el = document.getElementById(id).parentElement;
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); }
            else if (diff < -50) el.classList.remove('swiped');
        }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container, .swipe-q-box').forEach(el => el.classList.remove('swiped')); }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="text-5xl mb-8 font-black italic">MASSINE'S CHALLENGE</h1><button onclick="navigate('subjects')" class="fn-button bg-yellow-400 text-black text-3xl px-10 py-6 mx-auto italic">START</button></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><h2 class="text-2xl text-yellow-400 mb-4 text-center italic font-black">MISSIONS</h2><div class="scroll-area grid grid-cols-1 gap-3"><button onclick="navigate('boss_selection')" class="fn-button bg-orange-600 text-white text-2xl py-8 italic shadow-lg">🔥 BOSS LEVELS 🔥</button><div class="subject-grid">
                    <button onclick="state.selectedSubject='FRANS'; navigate('lessons');" class="fn-button bg-white/20 border-l-[6px] border-yellow-400 text-xl py-6 italic"><i class="subject-icon">🇫🇷</i> Frans</button>
                    <button onclick="state.selectedSubject='TAAL'; navigate('lessons');" class="fn-button bg-white/20 border-l-[6px] border-yellow-400 text-xl py-6 italic"><i class="subject-icon">🇳🇱</i> Taal</button>
                    <button onclick="state.selectedSubject='WO'; navigate('lessons');" class="fn-button bg-white/20 border-l-[6px] border-yellow-400 text-xl py-6 italic"><i class="subject-icon">🌍</i> WO</button>
                </div></div></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><div class="flex items-center mb-4 relative"><button onclick="navigate('subjects')" class="bg-yellow-400 text-black fn-button back-btn italic z-10">← BACK</button><h2 class="text-xl italic absolute w-full text-center left-0 pointer-events-none uppercase font-black">${state.selectedSubject}</h2></div><div class="scroll-area">
                    ${themes.map(t => `<div class="mb-4 text-center"><h3 class="theme-label">${t}</h3>
                        ${filtered.filter(l => l.theme === t).map(l => {
                            const id = `btn-${Math.random().toString(36).substr(2, 5)}`;
                            const cpKey = `${l.subject}-${l.theme}-${l.name}`;
                            return `<div class="swipe-container"><div class="swipe-actions"><button onclick="executeReset('${l.subject}','${l.theme}','${l.name}')" class="action-btn btn-reset">RESET</button></div>
                                ${state.checkpoints[cpKey] ? `<div class="resume-pill" onclick="event.stopPropagation(); startLesson('${l.subject}','${l.theme}','${l.name}', true)">▶️ CONT.</div>` : ''}
                                <button id="${id}" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event, '${id}')" onclick="startLesson('${l.subject}','${l.theme}','${l.name}')" class="fn-button bg-white/10 border-l-[6px] border-white/30 text-lg py-5 italic text-left pl-6">${l.name}</button></div>`}).join('')}</div>`).join('')}</div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl h-full sm:h-auto"><div class="flex justify-between items-center mb-3"><button onclick="navigate('lessons')" class="text-red-600 bg-black/40 px-2 py-1 rounded font-black text-[10px] uppercase italic">STOP</button>
                    <div class="h-2 flex-1 mx-3 bg-black/20 rounded-full"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-xl text-yellow-400 font-black">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="scroll-area flex flex-col items-center">
                        <div class="swipe-container h-auto mb-6 swipe-q-box" style="width:100%; display:flex; justify-content:center;">
                            <div class="swipe-actions"><button onclick="deleteQuestionFromApp()" class="action-btn btn-delete">WISSEN</button></div>
                            <h2 id="q-text" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event, 'q-text')" class="quiz-q-text text-3xl text-center px-4 quiz-q-inner w-full font-black">${q.word}</h2>
                        </div>
                        <div class="w-full flex flex-col gap-2">${q.options.map(opt => {
                            let cl = "bg-white/10";
                            if (state.status !== 'idle') {
                                if (opt === q.correct) cl = "btn-correct-final";
                                else if (opt === state.selected) cl = "btn-wrong-final";
                                else cl = "btn-dimmed";
                            }
                            return `<button onclick="checkAnswer('${opt}')" class="fn-button p-4 text-lg italic font-black h-[60px] ${cl}">${opt}</button>`}).join('')}</div>
                        ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-4 h-12 w-full bg-yellow-400 text-black fn-button italic font-black">VOLGENDE →</button>` : ''}</div></div>`;
            }
        }
        function executeReset(s,t,n) { state.lessons.forEach(l => { if(l.subject===s && l.theme===t && l.name===n) l.items.forEach(i => i.alreadyFailed = false); }); delete state.checkpoints[`${s}-${t}-${n}`]; localStorage.setItem('checkpoints_v1', JSON.stringify(state.checkpoints)); closeAllSwipes(); render(); }
        function deleteQuestionFromApp() { const q = state.quizItems[0]; state.lessons.forEach(l => { l.items = l.items.filter(i => i.word !== q.word); }); localStorage.setItem('study_data_v7', JSON.stringify(state.lessons)); state.quizItems.shift(); state.totalQuestions--; if(state.quizItems.length === 0) navigate('lessons'); else { state.status='idle'; render(); } }
    </script>
</body>
</html>
