<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V19.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; -webkit-overflow-scrolling: touch; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; touch-action: manipulation; position: relative; overflow: hidden; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; margin-bottom: 0.5rem; }
        .stats-tag { position: absolute; bottom: 6px; right: 12px; font-size: 0.6rem; font-weight: 900; display: flex; gap: 8px; opacity: 0.8; }
    </style>
</head>
<body id="mainBody">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>

    <script>
        // PLAK HIER JE CSV LINK
        const CSV_URL = 'JOUW_GEPUBLICEERDE_CSV_LINK_HIER';

        let state = { 
            view: 'start', 
            lessons: [], 
            stats: JSON.parse(localStorage.getItem('lesson_stats_v1') || '{}'),
            selectedSubject: '', 
            status: 'idle' 
        };

        function fetchCSV() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", CSV_URL + "&t=" + Date.now(), true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    processData(xhr.responseText);
                }
            };
            xhr.send();
        }

        function processData(text) {
            const rows = text.split('\n').slice(1);
            let lessonsMap = {};
            rows.forEach(row => {
                const cols = row.split(','); // Probeer ',' of ';' als het niet werkt
                if(cols.length < 7) return;
                
                const sub = cols[0].trim().toUpperCase();
                const theme = cols[1].trim();
                const name = cols[2].trim();
                const question = cols[5].trim();
                const answer = cols[6].trim();
                const others = cols[7] ? cols[7].split('|') : [];

                if(!question || !answer) return;

                const key = sub + "|" + theme + "|" + name;
                if(!lessonsMap[key]) lessonsMap[key] = { subject: sub, theme: theme, name: name, items: [] };
                
                lessonsMap[key].items.push({
                    word: question,
                    correct: answer,
                    options: [answer, ...others.map(o => o.trim())].sort(() => Math.random() - 0.5).slice(0, 4)
                });
            });
            state.lessons = Object.values(lessonsMap);
            render();
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="text-5xl mb-8 font-black italic text-white">MASSINE'S CHALLENGE</h1><button onclick="state.view='subjects'; fetchCSV(); render();" class="fn-button bg-yellow-400 text-black text-3xl px-10 py-6 mx-auto italic">START</button></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><h2 class="text-2xl text-yellow-400 mb-4 text-center font-black italic uppercase">Missions</h2><div class="grid grid-cols-2 gap-2">
                    <button onclick="state.selectedSubject='FRANS'; state.view='lessons'; render();" class="fn-button bg-white/20 py-6 italic">🇫🇷 Frans</button>
                    <button onclick="state.selectedSubject='TAAL'; state.view='lessons'; render();" class="fn-button bg-white/20 py-6 italic">🇳🇱 Taal</button>
                    <button onclick="state.selectedSubject='WO'; state.view='lessons'; render();" class="fn-button bg-white/20 py-6 italic col-span-2">🌍 WO</button>
                </div></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl">
                    <button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black p-2 mb-4 font-black italic text-xs w-20">← BACK</button>
                    <div class="scroll-area">
                        ${themes.length === 0 ? '<p class="text-center italic opacity-50">Laden...</p>' : themes.map(t => `
                            <div class="theme-label">${t}</div>
                            ${filtered.filter(l => l.theme === t).map(l => {
                                const key = l.subject + "-" + l.theme + "-" + l.name;
                                const st = state.stats[key] || { correct: 0, wrong: 0 };
                                return `<button onclick="startLesson('${l.name}')" class="fn-button bg-white/10 py-5 mb-2 italic w-full text-left pl-6 relative">
                                    <span>${l.name}</span>
                                    <div class="stats-tag text-white"><span>✅ ${st.correct}</span><span>❌ ${st.wrong}</span></div>
                                </button>`;
                            }).join('')}
                        `).join('')}
                    </div>
                </div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="state.view='lessons'; render();" class="text-red-600 bg-black/40 px-2 py-1 rounded font-black text-[10px] italic">STOP</button>
                        <span class="text-xl text-yellow-400 font-black">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <h2 class="text-3xl text-center mb-8 font-black italic uppercase">${q.word}</h2>
                        <div class="w-full flex flex-col gap-2">${q.options.map(opt => {
                            let cl = "bg-white/10 text-white";
                            if (state.status !== 'idle') {
                                if (opt === q.correct) cl = "bg-green-500 text-black";
                                else if (opt === state.selected) cl = "bg-red-600 text-white";
                                else cl = "opacity-10";
                            }
                            return `<button onclick="checkAnswer('${opt}')" class="fn-button p-4 text-lg italic font-black h-[60px] ${cl}">${opt}</button>`
                        }).join('')}</div>
                        ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-4 h-12 w-full bg-yellow-400 text-black fn-button italic font-black">NEXT →</button>` : ''}
                    </div>
                </div>`;
            }
        }

        function startLesson(name) {
            const lesson = state.lessons.find(l => l.name === name);
            state.currentLesson = lesson;
            state.quizItems = [...lesson.items].sort(() => Math.random() - 0.5);
            state.totalQuestions = state.quizItems.length;
            state.status = 'idle';
            state.view = 'quiz';
            render();
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            const q = state.quizItems[0];
            state.selected = opt;
            state.status = (opt === q.correct) ? 'correct' : 'wrong';
            
            const key = state.currentLesson.subject + "-" + state.currentLesson.theme + "-" + state.currentLesson.name;
            if (!state.stats[key]) state.stats[key] = { correct: 0, wrong: 0 };
            if (state.status === 'correct') state.stats[key].correct++;
            else state.stats[key].wrong++;
            
            localStorage.setItem('lesson_stats_v1', JSON.stringify(state.stats));
            render();
        }

        function nextQuestion() {
            state.quizItems.shift();
            state.status = 'idle';
            if (state.quizItems.length === 0) {
                confetti();
                state.view = 'lessons';
            }
            render();
        }

        render();
    </script>
</body>
</html>
