<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE CHALLENGE V30.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; min-height: 100vh; overflow-x: hidden; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png') center/cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.2), rgba(10,5,26,0.8)); z-index: -1; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 1.5rem; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: 0.2s; font-weight: 900; font-style: italic; text-transform: uppercase; border: none; touch-action: manipulation; }
        .prog-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.5s ease; }
        .btn-correct { background: #22c55e !important; color: #000 !important; box-shadow: 0 0 20px #22c55e; }
        .btn-wrong { background: #ef4444 !important; color: #fff !important; animation: shake 0.3s; box-shadow: 0 0 20px #ef4444; }
        .swipe-container { position: relative; overflow: hidden; border-radius: 1rem; margin-bottom: 0.5rem; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 10; transform: translateX(100%); transition: transform 0.3s ease; }
        .swipe-main { transition: transform 0.3s ease; width: 100%; }
        .swiped .swipe-main { transform: translateX(-80px); }
        .swiped .swipe-actions { transform: translateX(0); }
        .btn-reset-red { background: #ef4444; color: white; padding: 0 20px; font-weight: 900; font-size: 10px; height: 100%; display: flex; align-items: center; border: none; }
        .map-viewport { width: 100%; max-width: 320px; margin: 0 auto 1rem auto; height: 320px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); border-radius: 1rem; background: #000; position: relative; touch-action: none; }
        .skelet-kaart { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; transform-origin: center center; transition: transform 0.1s ease-out; pointer-events: none; }
        .btn-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255,255,255,0.4); margin-bottom: 8px; }
    </style>
</head>
<body onclick="initAudio(); closeAllSwipes();">
    <div id="app" class="w-full max-w-2xl mx-auto py-2 px-4"></div>
    <div id="bg-container"></div><div class="overlay"></div>
    <script>
        let audioCtx; let DATA = []; let startX = 0;
        let state = {
            v: 'landing', sub: '', cat: '', items: [], total: 0, status: 'idle', sel: null, revealed: false, mode: 'normal',
            progress: JSON.parse(localStorage.getItem('m_p_v29_8') || '{}'),
            errs: JSON.parse(localStorage.getItem('m_e_v29_8') || '[]')
        };
        const skeletUrl = "https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/skelet-kaart.png"; 
        let scale = 1, lastDist = 0;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playSound(f, t, d) { initAudio(); try { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime); g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); } catch(e) {} }
        function save() { localStorage.setItem('m_p_v29_8', JSON.stringify(state.progress)); localStorage.setItem('m_e_v29_8', JSON.stringify(state.errs)); }

        function loadCSV() {
            Papa.parse("vragen.csv?v=" + Date.now(), {
                download: true, header: false, skipEmptyLines: true,
                complete: function(res) {
                    DATA = res.data.slice(1).map(r => { 
                        if (!r[0] || !r[3] || !r[4]) return null;
                        return { s: String(r[0]).toUpperCase().trim(), t: String(r[1] || "").trim(), n: String(r[2] || "").trim(), q: String(r[3]).trim(), a: String(r[4]).trim(), d: [r[5], r[6], r[7]].filter(x => x && String(x).trim() !== "") }; 
                    }).filter(i => i !== null);
                    render();
                }
            });
        }
        loadCSV();

        function cleanCatName(cat) {
            const c = cat.toUpperCase();
            if(c.includes("SPELLING")) return "SPELLING";
            if(c.includes("WOORDENSCHAT")) return "WOORDENSCHAT";
            if(c.includes("VERBES")) return "WERKWOORDEN";
            return cat;
        }

        function handleZoom() {
            const container = document.querySelector('.map-viewport');
            const img = document.querySelector('.skelet-kaart');
            if (!container || !img) return;
            container.ontouchmove = (e) => {
                if (e.touches.length === 2) {
                    let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    if (lastDist > 0) { scale = Math.min(Math.max(1, scale * (dist / lastDist)), 5); }
                    lastDist = dist;
                    img.style.transform = `scale(${scale})`;
                }
            };
            container.ontouchend = () => { lastDist = 0; };
            container.onwheel = (e) => { e.preventDefault(); scale = Math.min(Math.max(1, scale * (e.deltaY > 0 ? 0.9 : 1.1)), 5); img.style.transform = `scale(${scale})`; };
        }

        function render() {
            const app = document.getElementById('app');
            if (state.v === 'landing') {
                app.innerHTML = `<div class="glass p-8 text-center mt-10"><h1 class="text-5xl font-black italic text-yellow-400 mb-2 uppercase tracking-tighter">Massine's</h1><h2 class="text-2xl font-black italic text-white mb-10 uppercase tracking-widest">Challenge</h2><button onclick="state.v='menu'; render();" class="fn-button bg-yellow-400 text-black py-8 px-12 text-2xl w-full">START GAME</button></div>`;
            } else if (state.v === 'menu') {
                const subs = [...new Set(DATA.map(i => i.s))].sort();
                app.innerHTML = `<div class="glass p-6 text-center"><h1 class="text-3xl text-yellow-400 font-black italic mb-6 uppercase text-left ml-2">Missions</h1>
                <button onclick="startBoss()" class="fn-button w-full bg-red-600 py-6 mb-6 text-xl flex items-center justify-center gap-3"><span>🔥 BOSS LEVEL</span><span class="bg-black/40 px-3 py-1 rounded-full text-sm font-mono">${state.errs.length}</span></button>
                <div class="grid grid-cols-2 gap-4">${subs.map(sub => {
                    let icon = sub === 'WO' ? '🌍' : (sub === 'FRANS' ? '🇫🇷' : '📚');
                    return `<button onclick="state.sub='${sub}';state.v='categories';render()" class="fn-button bg-white/10 py-12 text-xl border border-white/5 uppercase tracking-tighter flex flex-col items-center gap-2"><span>${icon}</span><span>${sub}</span></button>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'categories') {
                const cats = [...new Set(DATA.filter(i => i.s === state.sub).map(i => cleanCatName(i.t)))].sort();
                app.innerHTML = `<div class="glass p-6 text-center"><div class="flex justify-between items-center mb-6"><button onclick="state.v='menu';render()" class="bg-yellow-400 text-black px-4 py-2 font-black uppercase text-[10px]">← BACK</button><span class="font-black italic text-yellow-400 uppercase tracking-widest text-sm">${state.sub}</span></div><div class="grid grid-cols-1 gap-4">${cats.map((cat, idx) => {
                    const action = (state.sub === 'FRANS') ? `startCleanQuiz('${cat}')` : `state.cat='${cat}';state.v='lessons';render()`;
                    return `<div class="swipe-container" id="cont-cat-${idx}">
                        <div class="swipe-actions"><button onclick="resetCat('${cat}')" class="btn-reset-red">RESET</button></div>
                        <div class="swipe-main" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, 'cat-${idx}')">
                            <button onclick="${action}" class="fn-button w-full bg-white/10 py-10 text-2xl border border-white/5 uppercase tracking-widest text-yellow-400">${cat}</button>
                        </div>
                    </div>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'lessons') {
                const lessons = [...new Set(DATA.filter(i => i.s === state.sub && cleanCatName(i.t) === state.cat).map(i => i.n))].sort();
                app.innerHTML = `<div class="glass p-4"><div class="flex justify-between items-center mb-6 px-2"><button onclick="state.v='categories';render()" class="bg-yellow-400 text-black px-4 py-2 font-black uppercase text-[10px]">← BACK</button><span class="font-black italic text-yellow-400 uppercase tracking-widest text-sm">${state.cat}</span></div><div class="grid grid-cols-1 gap-4">${lessons.map((n, idx) => {
                    const isSkelet = n.toUpperCase().includes("SKELET");
                    const thumb = isSkelet ? `<img src="${skeletUrl}" class="btn-thumb mx-auto">` : "";
                    return `<div class="swipe-container" id="cont-les-${idx}">
                        <div class="swipe-actions"><button onclick="resetLes('${n}')" class="btn-reset-red">RESET</button></div>
                        <div class="swipe-main" ontouchstart="handleTS(event)" ontouchmove="handleTM(event, 'les-${idx}')">
                            <button onclick="startSpecificQuiz('${n}')" class="fn-button w-full h-32 bg-white/10 flex flex-col items-center justify-center border border-white/5 uppercase italic font-black text-xl text-center px-1">${thumb}<span>${n}</span></button>
                        </div>
                    </div>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'quiz') {
                const q = state.items[0];
                const showMap = q.n.toUpperCase().includes("KAART");
                const currentCat = cleanCatName(q.t);
                const isFlash = (q.s === 'FRANS' && (currentCat === "WOORDENSCHAT" || currentCat === "WERKWOORDEN"));
                const progress = ((state.total - state.items.length) / state.total) * 100;
                
                // Instructies gebaseerd op categorie
                let instruction = "KIES HET JUISTE ANTWOORD";
                if(q.s === 'FRANS') instruction = "VERTAAL NAAR NEDERLANDS";
                if(currentCat === "SPELLING") instruction = "KIES DE JUISTE SPELLING";

                app.innerHTML = `<div class="glass p-4">
                    <div class="flex justify-between font-black text-yellow-400 mb-2 uppercase text-[10px]"> <button onclick="state.v='menu';render()">← EXIT</button> <span>${state.total - state.items.length}/${state.total}</span></div>
                    <div class="prog-bar-container mb-3"><div class="prog-bar-fill" style="width: ${progress}%"></div></div>
                    ${showMap ? `<div class="map-viewport"><img src="${skeletUrl}" class="skelet-kaart" /></div>` : ''}
                    <div class="question-box text-center mb-4">
                        <h2 class="text-2xl font-black italic uppercase leading-tight">${q.q}</h2>
                        ${isFlash && !state.revealed ? `<button onclick="state.revealed=true;render();" class="mt-3 w-full py-8 bg-yellow-400 rounded-xl flex items-center justify-center px-4 fn-button text-2xl font-black text-black uppercase tracking-tighter leading-tight">VERTAAL LUIDOP <br> & tik voor het juiste antwoord</button>` : (isFlash ? '' : `<div class="mt-3 py-4 bg-yellow-400 rounded-xl flex items-center justify-center px-2"><p class="text-3xl font-black text-black uppercase tracking-tighter">${instruction}</p></div>`)}
                    </div>
                    ${isFlash && state.revealed ? `
                        <div class="text-center mb-6 animate-pulse"><p class="text-[9px] opacity-40 mb-1 tracking-widest uppercase">ANTWOORD</p><h2 class="text-3xl font-black italic text-green-400 uppercase">${q.a}</h2></div>
                        <div class="grid grid-cols-2 gap-4"><button onclick="handleFlash(true)" class="fn-button bg-green-600 py-6 text-xl">✅ JUIST</button><button onclick="handleFlash(false)" class="fn-button bg-red-600 py-6 text-xl">❌ FOUT</button></div>
                    ` : (isFlash && !state.revealed ? '' : `
                        <div class="grid grid-cols-2 gap-3">${q.opts.map(o => `<button onclick="check('${o}')" class="fn-button py-4 text-sm px-2 ${state.status!=='idle'?(o===q.a?'btn-correct':(o===state.sel?'btn-wrong':'opacity-20')):'bg-white/5 border border-white/10'}">${o}</button>`).join('')}</div>
                        ${state.status !== 'idle' ? `<button onclick="next()" class="fn-button w-full bg-white text-black py-6 mt-4 text-xl shadow-2xl">VOLGENDE →</button>` : ''}
                    `)}
                </div>`;
                if(showMap) { scale = 1; setTimeout(handleZoom, 100); }
            }
        }

        function startCleanQuiz(catName) { state.mode = 'normal'; state.cat = catName; const items = DATA.filter(i => i.s === state.sub && cleanCatName(i.t) === catName); prepareQuiz(items); }
        function startSpecificQuiz(lessonName) { state.mode = 'normal'; const items = DATA.filter(i => i.s === state.sub && cleanCatName(i.t) === state.cat && i.n === lessonName); prepareQuiz(items); }
        function startBoss() { if(state.errs.length === 0) return; state.mode = 'boss'; prepareQuiz([...state.errs]); }
        function prepareQuiz(items) { state.items = items.map(i => ({...i, opts: [i.a, ...i.d].sort(()=>Math.random()-0.5).slice(0,4)})).sort(()=>Math.random()-0.5); state.total = state.items.length; state.v = 'quiz'; state.status = 'idle'; state.sel = null; state.revealed = false; render(); }

        function handleFlash(correct) { 
            const q = state.items[0];
            if(correct) { playSound(660, 'sine', 0.15); if(state.mode === 'boss') state.errs = state.errs.filter(e => e.q !== q.q); } 
            else { playSound(150, 'sawtooth', 0.3); if(state.mode === 'normal' && !state.errs.some(e => e.q === q.q)) state.errs.push(q); }
            save(); state.items.shift(); state.revealed = false; if(!state.items.length) { state.v = 'menu'; } render(); 
        }

        function check(o) {
            if(state.status !== 'idle' || o === '---') return;
            state.sel = o; const q = state.items[0];
            if(o === q.a) { state.status = 'correct'; playSound(660, 'sine', 0.15); confetti({particleCount:30, origin:{y:0.8}}); if(state.mode === 'boss') state.errs = state.errs.filter(e => e.q !== q.q); } 
            else { state.status = 'wrong'; playSound(150, 'sawtooth', 0.3); if(state.mode === 'normal' && !state.errs.some(e => e.q === q.q)) state.errs.push(q); }
            save(); render();
        }

        function next() { state.items.shift(); state.status = 'idle'; state.sel = null; if(!state.items.length) { state.v = 'menu'; } render(); }
        function resetCat(cat) { DATA.filter(i => cleanCatName(i.t) === cat).forEach(q => delete state.progress[q.q]); save(); render(); }
        function resetLes(n) { DATA.filter(i => i.n === n).forEach(q => delete state.progress[q.q]); save(); render(); }
        function handleTS(e) { startX = e.touches[0].clientX; }
        function handleTM(e, id) { 
            let diff = startX - e.touches[0].clientX; 
            let el = document.getElementById('cont-' + id); 
            if (el && diff > 50) { closeAllSwipes(); el.classList.add('swiped'); } 
            else if (el && diff < -50) el.classList.remove('swiped'); 
        }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(e => e.classList.remove('swiped')); }
        render();
    </script>
</body>
</html>
