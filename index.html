
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V10.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; overscroll-behavior-x: none; }
        
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat; transition: background-image 0.6s ease-in-out; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10, 5, 26, 0.05) 0%, rgba(10, 5, 26, 0.4) 100%); z-index: -1; }

        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .text-header { font-weight: 900; font-style: italic; text-transform: uppercase; transform: skewX(-8deg); }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 10px 5px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; z-index: 2; border: none; }
        
        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 0.5rem; overflow: hidden; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; opacity: 0; transition: opacity 0.3s; }
        .swiped .swipe-actions { opacity: 1; }
        
        .action-btn { height: 100%; padding: 0 15px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.7rem; color: white; text-transform: uppercase; border: none; }
        .btn-reset { background: #3b82f6; }
        .btn-delete { background: #ef4444; }

        .boss-button { background: linear-gradient(90deg, #b45309 0%, #f59e0b 50%, #b45309 100%); color: white; border: 1px solid #fde047; }
        .lesson-button { background: rgba(255, 255, 255, 0.15); border-left: 6px solid #eab308; }
        
        .swiped .fn-button { transform: translateX(-130px); }
        .title-glow { text-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 25px rgba(234, 179, 8, 0.5); }

        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body id="mainBody">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2 sm:p-6"></div>

    <script>
        const images = ["massinewall.png", "massinewall1.png", "massinewall2.png", "massinewall3.png", "massinewall4.png"];
        let lastImage = "";
        let audioCtx;

        function changeBackground(isInitial = false) {
            let selectedImg = isInitial ? "massinewall.png" : images.filter(img => img !== lastImage)[Math.floor(Math.random() * (images.length - 1))];
            lastImage = selectedImg;
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/${selectedImg}')`;
        }
        
        function navigate(newView) { changeBackground(); state.view = newView; render(); }
        window.addEventListener('load', () => { changeBackground(true); render(); });

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'), 
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle' 
        };

        // Verbeterde Swipe Logica
        let startX = 0;
        let isMoving = false;

        function handleTouchStart(e) { 
            startX = e.touches[0].clientX; 
            isMoving = false;
        }

        function handleTouchMove(e, id) {
            const currentX = e.touches[0].clientX;
            const diff = startX - currentX;
            const el = document.getElementById(id).parentElement;

            if (Math.abs(diff) > 10) isMoving = true;

            if (diff > 60) {
                el.classList.add('swiped');
            } else if (diff < -60) {
                el.classList.remove('swiped');
            }
        }

        function handleBtnClick(e, action, id) {
            // Als de knop geswiped is, blokkeer de gewone klik actie
            const el = document.getElementById(id).parentElement;
            if (el.classList.contains('swiped')) {
                e.stopPropagation();
                el.classList.remove('swiped');
                return;
            }
            if (!isMoving) eval(action);
        }

        function executeReset(subject, theme, lessonName) {
            state.lessons.forEach(l => {
                if (l.subject === subject && l.theme === theme && (!lessonName || l.name === lessonName)) {
                    l.items.forEach(item => item.alreadyFailed = false);
                }
            });
            localStorage.setItem('study_data_v7', JSON.stringify(state.lessons));
            render();
        }

        function executeDelete(subject, theme, lessonName) {
            state.lessons = state.lessons.filter(l => !(l.subject === subject && l.theme === theme && (!lessonName || l.name === lessonName)));
            render();
        }

        function createSwipeRow(subject, theme, lessonName, label, btnClass, clickAction) {
            const id = `btn-${Math.random().toString(36).substr(2, 5)}`;
            return `
                <div class="swipe-container">
                    <div class="swipe-actions">
                        <button onclick="executeReset('${subject}', '${theme}', ${lessonName ? `'${lessonName}'` : 'null'})" class="action-btn btn-reset">RESET</button>
                        <button onclick="executeDelete('${subject}', '${theme}', ${lessonName ? `'${lessonName}'` : 'null'})" class="action-btn btn-delete">WISSEN</button>
                    </div>
                    <button id="${id}" 
                        ontouchstart="handleTouchStart(event)" 
                        ontouchmove="handleTouchMove(event, '${id}')"
                        onclick="handleBtnClick(event, \`${clickAction}\`, '${id}')"
                        class="fn-button ${btnClass}">
                        ${label}
                    </button>
                </div>
            `;
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="title-glow text-header text-5xl sm:text-8xl mb-8 leading-tight">MASSINE'S CHALLENGE</h1>
                    <button onclick="handleStart()" class="fn-button bg-yellow-400 text-black text-3xl sm:text-6xl px-10 py-6 mx-auto italic">START</button>
                    <button onclick="setCloudUrl()" style="position:fixed; bottom:15px; left:50%; transform:translateX(-50%); opacity:0.15;">⚙️</button></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-4 max-w-xl"><h2 class="text-header text-2xl text-yellow-400 mb-4 text-center title-glow">MISSIONS</h2>
                    <div class="scroll-area flex flex-col gap-4">
                        <div class="swipe-container h-[70px]"><button onclick="navigate('boss_selection')" class="fn-button boss-button text-2xl italic">🔥 BOSS LEVELS 🔥</button></div>
                        <div class="subject-grid">
                            ${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedSubject='${s.toUpperCase()}'; navigate('lessons');" class="fn-button bg-white/20 border-l-[6px] border-yellow-400 text-xl py-6 italic">${s}</button>`).join('')}
                        </div>
                    </div></div>`;
            } else if (state.view === 'boss_selection') {
                container.innerHTML = `<div class="glass p-4 max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('subjects');" class="bg-yellow-400 text-black px-3 py-1 fn-button text-[10px] h-8 italic">← BACK</button><h2 class="text-header text-xl text-white title-glow">SELECT VAK</h2></div>
                    <div class="scroll-area grid grid-cols-2 gap-3">${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedBossSubject='${s.toUpperCase()}'; navigate('boss_themes');" class="fn-button bg-white/10 border-l-[10px] border-yellow-400 text-lg py-5 italic">${s}</button>`).join('')}</div></div>`;
            } else if (state.view === 'boss_themes') {
                const themes = [...new Set(state.lessons.filter(l => l.subject === state.selectedBossSubject).map(l => l.theme))];
                container.innerHTML = `<div class="glass p-4 max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('boss_selection');" class="bg-yellow-400 text-black px-3 py-1 fn-button text-[10px] h-8 italic">← BACK</button><h2 class="text-header text-lg text-white title-glow">${state.selectedBossSubject}</h2></div>
                    <div class="scroll-area">${themes.map(t => createSwipeRow(state.selectedBossSubject, t, null, t, 'bg-red-600/20 border-l-[6px] border-red-600 text-lg italic', `startThemeBoss('${state.selectedBossSubject}', '${t}')`)).join('')}</div></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-4 max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('subjects');" class="bg-yellow-400 text-black px-3 py-1 fn-button text-[10px] h-8 italic">← BACK</button><h2 class="text-header text-lg text-white italic">${state.selectedSubject}</h2></div>
                    <div class="scroll-area">
                        ${themes.map(t => `<div class="mb-4"><h3 class="bg-yellow-400 text-black font-black text-[10px] mb-2 px-2 py-0.5 uppercase italic inline-block skew-x-[-10deg]">${t}</h3>
                            ${filtered.filter(l => l.theme === t).map(l => createSwipeRow(l.subject, l.theme, l.name, l.name, 'lesson-button text-lg italic', `startLesson('${l.subject}','${l.theme}','${l.name}')`)).join('')}
                        </div>`).join('')}
                    </div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl h-full sm:h-auto"><div class="flex justify-between items-center mb-3"><button onclick="navigate('lessons');" class="text-red-600 bg-black/40 px-2 py-1 rounded font-black text-[10px] uppercase italic">STOP</button>
                    <div class="h-2 flex-1 mx-3 bg-black/20 rounded-full overflow-hidden"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-header text-xl text-yellow-400 font-black italic">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="scroll-area flex flex-col"><h2 class="text-header text-xl sm:text-4xl mb-4 text-center leading-tight">${q.word}</h2>
                        <div class="grid grid-cols-1 gap-2">${q.options.map(opt => {
                            let c = "bg-white/10 border-white/10"; if (state.status !== 'idle') { if (opt === q.correct) c = "bg-green-600 border-white shadow-lg"; else if (opt === state.selected) c = "bg-red-600 border-white"; else c = "opacity-20"; }
                            return `<button onclick="checkAnswer('${opt}')" class="fn-button p-4 text-lg border-2 italic font-black ${c}">${opt}</button>`;
                        }).join('')}</div></div>
                    ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-3 w-full p-4 bg-yellow-400 text-black text-xl fn-button font-black italic">NEXT →</button>` : ''}</div>`;
            } else if (state.view === 'result') {
                container.innerHTML = `<div class="glass p-8 flex flex-col items-center justify-center text-center w-full border-2 border-yellow-400 shadow-2xl">
                    <h1 class="text-header text-4xl mb-4 text-yellow-400 title-glow italic uppercase">CLEARED!</h1>
                    <div class="text-2xl font-black text-white/80 mb-8 italic">SCORE: ${state.percent}%</div>
                    <button onclick="navigate('subjects');" class="fn-button bg-yellow-400 text-black text-2xl px-12 py-6 italic">CONTINUE</button></div>`;
            }
        }

        async function handleStart() {
            if (state.lessons.length > 0) { navigate('subjects'); fetchCloudData(false); } 
            else { state.isLoading = true; render(); await fetchCloudData(true); }
        }

        async function fetchCloudData(shouldNavigate) {
            if (!state.scriptUrl) return;
            try {
                const response = await fetch(state.scriptUrl);
                const data = await response.json();
                if (data.lessons) { state.lessons = data.lessons; localStorage.setItem('study_data_v7', JSON.stringify(data.lessons)); }
                state.isLoading = false; if (shouldNavigate) navigate('subjects'); else render();
            } catch(e) { state.isLoading = false; render(); }
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt; const q = state.quizItems[0]; const isCorrect = opt === q.correct;
            if (isCorrect) { if (!q.alreadyFailed) state.firstTryCorrect++; }
            else { q.alreadyFailed = true; }
            state.status = isCorrect ? 'correct' : 'wrong'; render();
        }

        function nextQuestion() {
            const completedQ = state.quizItems.shift(); if (state.status === 'wrong') state.quizItems.push(completedQ);
            if (state.quizItems.length === 0) {
                state.percent = Math.round((state.firstTryCorrect / state.totalQuestions) * 100);
                saveAction({ type: "RESULT", subject: state.currentLesson.subject, theme: state.currentLesson.theme, name: state.currentLesson.name, percent: state.percent });
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); navigate('result');
            } else { state.status = 'idle'; render(); }
        }

        async function saveAction(payload) { if (state.scriptUrl) fetch(state.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); }
        function startLesson(s,t,n) { state.currentLesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n); state.quizItems = [...state.currentLesson.items].sort(() => Math.random() - 0.5); state.totalQuestions = state.quizItems.length; state.firstTryCorrect = 0; state.status = 'idle'; navigate('quiz'); }
        function startThemeBoss(subject, theme) { const items = state.lessons.filter(l => l.subject === subject && l.theme === theme).flatMap(l => l.items); state.currentLesson = { name: theme, subject, theme, items }; state.quizItems = [...items].sort(() => Math.random() - 0.5); state.totalQuestions = items.length; state.firstTryCorrect = 0; state.status = 'idle'; navigate('quiz'); }
        function setCloudUrl() { const url = prompt("Google Web App URL:", state.scriptUrl); if (url) { state.scriptUrl = url; localStorage.setItem('script_url', url); fetchCloudData(true); } }
    </script>
</body>
</html>
