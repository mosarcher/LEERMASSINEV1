

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V7.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        :root { --accent: #eab308; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0a051a; 
            color: white; 
            margin: 0; 
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        
        #bg-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
        }

        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(10, 5, 26, 0.3) 0%, rgba(10, 5, 26, 0.7) 100%); 
            z-index: -1; 
        }

        .fn-button { 
            clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); 
            transition: all 0.1s; 
            text-transform: uppercase; 
            font-weight: 900; 
            font-style: italic; 
        }

        /* Glazen container die mee schaalt */
        .glass { 
            background: rgba(10, 5, 26, 0.85); 
            backdrop-filter: blur(10px); 
            border: 2px solid rgba(234, 179, 8, 0.4); 
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            width: 95%;
            margin: auto;
        }

        .title-glow { text-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 15px rgba(234, 179, 8, 0.5); }
        .text-header { font-weight: 900; font-style: italic; text-transform: uppercase; transform: skewX(-8deg); }
        
        /* Zorgt dat inhoud binnen de box blijft en scrollbaar is indien nodig */
        .content-area { overflow-y: auto; -webkit-overflow-scrolling: touch; }

        .flash-red { background-color: rgba(220, 38, 38, 0.5) !important; transition: background 0.1s; }
        
        /* Mobiele optimalisatie voor de antwoorden */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        @media (min-width: 640px) {
            .answers-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body id="mainBody" class="flex items-center justify-center">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    
    <main id="app" class="w-full flex items-center justify-center p-4 sm:p-8"></main>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        const DEFAULT_BG = "https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png";
        
        window.addEventListener('load', () => {
            const savedBg = localStorage.getItem('massine_bg');
            document.getElementById('bg-container').style.backgroundImage = `url('${savedBg || DEFAULT_BG}')`;
            render();
        });

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'), 
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle'
        };

        async function fetchCloudData() {
            if (!state.scriptUrl) return;
            try {
                const response = await fetch(state.scriptUrl);
                const data = await response.json();
                if (data.lessons) {
                    state.lessons = data.lessons;
                    localStorage.setItem('study_data_v7', JSON.stringify(data.lessons));
                }
                render();
            } catch(e) { alert("Check Cloud Link!"); }
        }

        function render() {
            const container = document.getElementById('app');
            
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center p-4">
                    <h1 class="title-glow text-header text-5xl sm:text-8xl mb-10 leading-none">MASSINE'S CHALLENGE</h1>
                    <button onclick="playSound('correct'); fetchCloudData().then(() => { state.view='subjects'; render(); });" class="fn-button bg-yellow-400 text-black text-4xl sm:text-6xl px-12 py-8 shadow-[0_8px_0_rgb(161,98,7)] active:translate-y-2">PLAY</button>
                    <div class="mt-12"><button onclick="setCloudUrl()" class="text-white/40 text-xs uppercase font-black border-b border-white/20">⚙️ Cloud Setup</button></div>
                </div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass rounded-3xl p-6 sm:p-10 w-full max-w-2xl">
                    <h2 class="text-header text-3xl sm:text-5xl text-yellow-400 mb-6 text-center">SUBJECTS</h2>
                    <div class="content-area grid gap-4">
                        ${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedSubject='${s.toUpperCase()}'; state.view='lessons'; render();" class="fn-button bg-white/10 border-l-8 border-yellow-400 text-2xl py-8 hover:bg-yellow-400 hover:text-black">${s}</button>`).join('')}
                    </div>
                </div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass rounded-3xl p-6 sm:p-10 w-full max-w-2xl">
                    <div class="flex justify-between items-center mb-6"><button onclick="state.view='subjects'; render();" class="bg-yellow-400 text-black px-4 py-1 fn-button text-xs font-black tracking-tighter">← BACK</button>
                    <h2 class="text-header text-xl text-white/50 uppercase">${state.selectedSubject}</h2></div>
                    <div class="content-area space-y-6">
                        ${themes.map(t => `<div class="mb-4"><h3 class="bg-yellow-400 text-black font-black text-[10px] mb-3 px-3 py-1 uppercase inline-block italic skew-x-[-10deg]">${t}</h3><div class="grid gap-2">
                            ${filtered.filter(l => l.theme === t).map(l => `<button onclick="startLesson('${l.subject}','${l.theme}','${l.name}')" class="w-full p-4 border-l-4 bg-white/10 border-white/20 text-left hover:border-yellow-400 font-black uppercase text-lg">${l.name}</button>`).join('')}
                        </div></div>`).join('')}
                        ${themes.length === 0 ? '<p class="text-center opacity-50">No lessons found. Link Excel!</p>' : ''}
                    </div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass rounded-3xl p-6 sm:p-8 w-full max-w-4xl">
                    <div class="flex justify-between items-center mb-6"><button onclick="state.view='lessons';render();" class="text-red-500 font-black text-xs uppercase">STOP</button>
                    <div class="h-2 flex-1 mx-4 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-header text-lg text-yellow-400">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="content-area flex-1 flex flex-col justify-center">
                        <h2 class="text-header text-2xl sm:text-5xl mb-8 text-center leading-tight">${q.word}</h2>
                        <div class="answers-grid">
                            ${q.options.map(opt => {
                                let c = "bg-white/5 border-white/10";
                                if (state.status !== 'idle') { if (opt === q.correct) c = "bg-green-600 border-white scale-105 z-10"; else if (opt === state.selected) c = "bg-red-600 border-white"; else c = "opacity-20"; }
                                return `<button onclick="checkAnswer('${opt}')" class="fn-button p-5 sm:p-7 text-lg sm:text-xl border-2 italic font-black ${c}">${opt}</button>`;
                            }).join('')}
                        </div>
                    </div>
                    ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-6 w-full p-6 sm:p-8 bg-yellow-400 text-black text-2xl sm:text-4xl fn-button font-black italic">NEXT →</button>` : '<div class="h-[80px] sm:h-[100px]"></div>'}
                </div>`;
            } else if (state.view === 'result') {
                container.innerHTML = `<div class="glass rounded-3xl p-10 flex flex-col items-center justify-center text-center max-w-lg w-full border-4 border-yellow-400">
                    <h1 class="text-header text-5xl sm:text-7xl mb-4 text-yellow-400 title-glow">KLAAR!</h1>
                    <div class="text-3xl font-black opacity-40 mb-10">SCORE: ${state.percent}%</div>
                    <button onclick="state.view='lessons'; render();" class="fn-button bg-yellow-400 text-black text-3xl px-16 py-8">BACK</button>
                </div>`;
            }
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt; const q = state.quizItems[0]; const isCorrect = opt === q.correct;
            if (isCorrect) { if (!q.alreadyFailed) state.firstTryCorrect++; playSound('correct'); }
            else { q.alreadyFailed = true; playSound('wrong'); document.getElementById('mainBody').classList.add('flash-red'); setTimeout(() => document.getElementById('mainBody').classList.remove('flash-red'), 200); }
            state.status = isCorrect ? 'correct' : 'wrong'; render();
        }

        function nextQuestion() {
            const completedQ = state.quizItems.shift(); if (state.status === 'wrong') state.quizItems.push(completedQ);
            if (state.quizItems.length === 0) {
                state.percent = Math.round((state.firstTryCorrect / state.totalQuestions) * 100);
                saveAction({ type: "RESULT", subject: state.currentLesson.subject, theme: state.currentLesson.theme, name: state.currentLesson.name, percent: state.percent });
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); state.view = 'result';
            } else { state.status = 'idle'; }
            render();
        }

        async function saveAction(payload) { if (state.scriptUrl) fetch(state.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); }
        function startLesson(s,t,n) { state.currentLesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n); state.quizItems = [...state.currentLesson.items].sort(() => Math.random() - 0.5); state.totalQuestions = state.quizItems.length; state.firstTryCorrect = 0; state.view = 'quiz'; state.status = 'idle'; render(); }
        function setCloudUrl() { const url = prompt("Google Web App URL:", state.scriptUrl); if (url) { state.scriptUrl = url; localStorage.setItem('script_url', url); fetchCloudData(); } }
        
    </script>
</body>
</html>
