<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 1.5rem; padding: 20px; width: 100%; max-width: 500px; display: flex; flex-direction: column; max-height: 80vh; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; border: none; touch-action: manipulation; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; margin-bottom: 0.5rem; }
        .scroll-area { overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #eab308, #fbbf24); transition: width 0.4s ease; }
        .score-check { color: #4ade80; font-weight: bold; float: right; }
    </style>
</head>
<body class="flex justify-center items-start pt-24 px-2">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="w-full flex justify-center"></div>

    <script>
        // JE EIGEN DATA - HIER KUN JE ALLES HANDMATIG INVULLEN
        const MIJN_LESSEN = [
            {
                subject: "FRANS",
                theme: "Unité 1",
                name: "Les 1: Woorden",
                items: [
                    { word: "Bonjour", correct: "Goeiedag", options: ["Goeiedag", "Hoi", "Doei", "Bedankt"] },
                    { word: "Merci", correct: "Bedankt", options: ["Bedankt", "Alstublieft", "Ja", "Nee"] }
                ]
            }
            // Voeg hier meer lessen toe op dezelfde manier
        ];

        let state = { 
            view: 'start', 
            lessons: MIJN_LESSEN, 
            selectedSubject: '', 
            status: 'idle',
            quizItems: [],
            totalQuestions: 0,
            selected: null,
            scores: JSON.parse(localStorage.getItem('massine_scores') || '{}')
        };

        function render() {
            const container = document.getElementById('app');
            
            if (state.view === 'start') {
                container.innerHTML = `<div class="glass text-center">
                    <h1 class="text-4xl font-black italic mb-8 text-yellow-400 uppercase tracking-tighter">Massine's Challenge</h1>
                    <button onclick="state.view='subjects'; render();" class="fn-button bg-yellow-400 text-black w-full py-8 text-2xl mb-4 italic hover:scale-105 uppercase">Start Mission</button>
                    <button onclick="resetScores()" class="text-[10px] text-red-400 opacity-50 italic uppercase tracking-widest underline mt-4">Reset Progress</button>
                </div>`;
            } 
            else if (state.view === 'subjects') {
                const subs = [...new Set(state.lessons.map(l => l.subject))];
                container.innerHTML = `<div class="glass">
                    <button onclick="state.view='start'; render();" class="text-yellow-400 mb-4 font-black italic text-[10px] underline uppercase">← HOME</button>
                    <h1 class="text-2xl font-black italic text-center mb-6 text-yellow-400 uppercase tracking-tighter">Mission Control</h1>
                    <div class="grid gap-3 scroll-area">
                        ${subs.map(s => `<button onclick="state.selectedSubject='${s}'; state.view='lessons'; render();" class="fn-button bg-white/10 py-6 text-xl italic border border-white/10 hover:bg-white/20">${s}</button>`).join('')}
                    </div>
                </div>`;
            } 
            else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass">
                    <button onclick="state.view='subjects'; render();" class="text-yellow-400 mb-4 font-black italic text-[10px] underline uppercase">← BACK</button>
                    <div class="scroll-area">
                        ${themes.map(t => `<div class="theme-label mt-4">${t}</div>` + filtered.filter(l => l.theme === t).map(l => {
                            const key = `${l.subject}-${l.theme}-${l.name}`;
                            return `<button onclick="startLesson('${l.name}')" class="fn-button bg-white/10 py-5 mb-2 italic w-full text-left pl-6 hover:bg-white/20 relative">
                                ${l.name} ${state.scores[key] ? '<span class="score-check">✓</span>' : ''}
                            </button>`;
                        }).join('')).join('')}
                    </div>
                </div>`;
            } 
            else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                const progress = ((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100;
                container.innerHTML = `<div class="glass w-full max-w-4xl">
                    <div class="flex justify-between items-center mb-2 px-2">
                        <button onclick="if(confirm('STOP MISSION?')){state.view='lessons'; render();}" class="bg-red-600/80 text-white font-black italic text-[10px] px-3 py-1 uppercase" style="clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);">STOP</button>
                        <span class="text-white/40 font-black italic text-sm tracking-widest uppercase">${state.quizItems.length} LEFT</span>
                    </div>
                    <div class="progress-container"><div class="progress-bar" style="width: ${progress}%"></div></div>
                    <h2 class="text-4xl text-center my-10 font-black italic uppercase tracking-tighter">${q.word}</h2>
                    <div class="grid gap-3">
                        ${q.options.map(opt => `
                            <button onclick="checkAnswer('${opt}', '${q.correct}')" 
                                    class="fn-button py-6 text-lg italic ${state.status !== 'idle' ? (opt === q.correct ? 'bg-green-500 text-black' : (opt === state.selected ? 'bg-red-600' : 'opacity-20')) : 'bg-white/10 border border-white/5'}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    ${state.status !== 'idle' ? `<button onclick="nextQ()" class="mt-6 bg-yellow-400 text-black fn-button py-4 italic font-black text-xl animate-bounce uppercase">CONTINUE →</button>` : ''}
                </div>`;
            }
        }

        function startLesson(name) {
            const lesson = state.lessons.find(l => l.name === name && l.subject === state.selectedSubject);
            if (!lesson) return;
            state.currentLessonKey = `${lesson.subject}-${lesson.theme}-${lesson.name}`;
            state.quizItems = lesson.items.map(item => ({
                ...item,
                options: [...item.options].sort(() => Math.random() - 0.5)
            })).sort(() => Math.random() - 0.5);
            state.totalQuestions = state.quizItems.length;
            state.status = 'idle'; state.view = 'quiz'; render();
        }

        function checkAnswer(opt, correct) {
            if (state.status !== 'idle') return;
            state.selected = opt;
            if (opt === correct) { state.status = 'correct'; } 
            else { 
                state.status = 'wrong'; 
                // Boss Mode: foute vraag komt terug
                state.quizItems.push({...state.quizItems[0]}); 
            }
            render();
        }

        function nextQ() {
            state.quizItems.shift(); state.status = 'idle'; state.selected = null;
            if (state.quizItems.length === 0) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                state.scores[state.currentLessonKey] = true;
                localStorage.setItem('massine_scores', JSON.stringify(state.scores));
                state.view = 'lessons';
            }
            render();
        }

        function resetScores() {
            if(confirm('ALLE SCORES WISSEN?')) {
                state.scores = {}; localStorage.removeItem('massine_scores'); render();
            }
        }

        render();
    </script>
</body>
</html>
