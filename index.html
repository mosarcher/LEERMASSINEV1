<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V12.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; transition: background-image 0.6s; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; }
        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; flex-shrink: 0; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; opacity: 0; transition: opacity 0.2s; }
        .swiped .swipe-actions { opacity: 1; }
        .action-btn { height: 100%; padding: 0 15px; font-weight: 900; font-size: 0.7rem; color: white; border: none; text-transform: uppercase; }
        .btn-reset { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
        .swiped .fn-button { transform: translateX(-150px); }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .resume-pill { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #eab308; color: black; font-size: 0.55rem; padding: 3px 7px; border-radius: 99px; font-weight: 900; z-index: 10; pointer-events: auto; }
        .subject-icon { font-size: 1.2em; margin-right: 8px; font-style: normal; }
        .version-tag { position: fixed; bottom: 5px; right: 10px; font-size: 10px; opacity: 0.3; font-weight: 900; }
        .back-btn { width: auto !important; padding: 0 15px !important; height: 35px !important; font-size: 0.75rem !important; flex-shrink: 0; }
        .quiz-q-text { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 0.85rem; margin-bottom: 0.5rem; padding: 0.2rem 0.75rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); }

        .btn-correct { background-color: #22c55e !important; color: white !important; border: 3px solid white !important; opacity: 1 !important; z-index: 10; }
        .btn-wrong { background-color: #ef4444 !important; color: white !important; border: 3px solid white !important; opacity: 1 !important; animation: shake 0.3s ease-in-out; }
        .btn-inactive { opacity: 0.1 !important; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body id="mainBody" onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>
    <div class="version-tag">v12.8</div>

    <script>
        const images = ["massinewall.png", "massinewall1.png", "massinewall2.png", "massinewall3.png", "massinewall4.png"];
        let lastImage = "";
        let audioCtx = null;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.setValueAtTime(type === 'correct' ? 600 : 120, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }

        function changeBackground(isInitial = false) {
            let selectedImg = isInitial ? "massinewall.png" : images.filter(img => img !== lastImage)[Math.floor(Math.random() * (images.length - 1))];
            lastImage = selectedImg;
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/${selectedImg}')`;
        }

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'),
            checkpoints: JSON.parse(localStorage.getItem('checkpoints_v1') || '{}'),
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle' 
        };

        let startX = 0;
        let isMoving = false;

        function handleTouchStart(e) { startX = e.touches[0].clientX; isMoving = false; }
        function handleTouchMove(e, id) {
            const diff = startX - e.touches[0].clientX;
            if (Math.abs(diff) > 10) isMoving = true;
            const el = document.getElementById(id).parentElement;
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); }
            else if (diff < -50) el.classList.remove('swiped');
        }

        function handleLessonTap(e, s, t, n, resume = false) {
            if (isMoving) return;
            const el = e.currentTarget.parentElement;
            if (el.classList.contains('swiped')) { el.classList.remove('swiped'); return; }
            startLesson(s, t, n, resume);
        }

        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(el => el.classList.remove('swiped')); }
        function navigate(v) { changeBackground(); state.view = v; render(); }
        window.addEventListener('load', () => { changeBackground(true); render(); });

        async function handleStart() { if (state.lessons.length > 0) navigate('subjects'); else fetchCloudData(true); }
        async function fetchCloudData(nav) { if (!state.scriptUrl) return; try { const res = await fetch(state.scriptUrl); const d = await res.json(); if (d.lessons) { state.lessons = d.lessons; localStorage.setItem('study_data_v7', JSON.stringify(d.lessons)); } if (nav) navigate('subjects'); } catch(e) {} }

        function startLesson(s,t,n, resume = false) {
            const key = `${s}-${t}-${n}`;
            const lesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n);
            if (!lesson) return;
            if (resume && state.checkpoints[key]) {
                const cp = state.checkpoints[key];
                state.quizItems = cp.items;
                state.totalQuestions = cp.total;
                state.firstTryCorrect = cp.correct;
            } else {
                state.quizItems = [...lesson.items].sort(() => Math.random() - 0.5);
                state.totalQuestions = state.quizItems.length;
                state.firstTryCorrect = 0;
                delete state.checkpoints[key];
