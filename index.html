<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE CHALLENGE V27.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; min-height: 100vh; overflow-x: hidden; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png') center/cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.2), rgba(10,5,26,0.8)); z-index: -1; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 1.5rem; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: 0.2s; font-weight: 900; font-style: italic; text-transform: uppercase; border: none; touch-action: manipulation; }
        .prog-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.5s ease; }
        .btn-correct { background: #22c55e !important; color: #000 !important; box-shadow: 0 0 20px #22c55e; }
        .btn-wrong { background: #ef4444 !important; color: #fff !important; animation: shake 0.3s; box-shadow: 0 0 20px #ef4444; }
        .map-viewport { width: 100%; max-width: 320px; margin: 0 auto 1rem auto; height: 260px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); border-radius: 1rem; background: #000; position: relative; touch-action: none; }
        .skelet-kaart { width: 100%; position: absolute; top: 0; left: 0; transform-origin: center center; transition: transform 0.1s ease-out; }
        .mega-instruction { animation: pulse-yellow 1s infinite; border: 4px solid #facc15; }
        @keyframes pulse-yellow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.01); } }
        .swipe-container { position: relative; overflow: hidden; border-radius: 1rem; margin-bottom: 0.75rem; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 10; transform: translateX(100%); transition: transform 0.3s ease; }
        .swipe-main { transition: transform 0.3s ease; width: 100%; }
        .swiped .swipe-main { transform: translateX(-80px); }
        .swiped .swipe-actions { transform: translateX(0); }
        .btn-reset-red { background: #ef4444; color: white; padding: 0 15px; font-weight: 900; font-size: 10px; height: 100%; display: flex; align-items: center; border: none; }
    </style>
</head>
<body onclick="initAudio(); closeAllSwipes();">
    <div id="app" class="w-full max-w-2xl mx-auto py-2 px-4"></div>
    <div id="bg-container"></div><div class="overlay"></div>
    <script>
        let audioCtx; let DATA = []; let startX = 0;
        let state = {
            v: 'landing', sub: '', cat: '', items: [], total: 0, status: 'idle', sel: null,
            progress: JSON.parse(localStorage.getItem('m_prog_v27_4') || '{}'),
            errs: JSON.parse(localStorage.getItem('m_e_v27_4') || '[]')
        };
        const skeletUrl = "https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/skelet-kaart.png"; 

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playSound(f, t, d) { initAudio(); try { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime); g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); } catch(e) {} }
        function cleanCategory(cat) { const u = cat.toUpperCase(); if (u.includes("SPELLING")) return "SPELLING"; if (u.includes("WOORDENSCHAT")) return "WOORDENSCHAT"; if (u.includes("VERBES")) return "VERBES"; return cat.toUpperCase(); }
        function save() { localStorage.setItem('m_prog_v27_4', JSON.stringify(state.progress)); localStorage.setItem('m_e_v27_4', JSON.stringify(state.errs)); }
        function handleTM(e, id) { let diff = startX - e.touches[0].clientX; let el = document.getElementById('cont-' + id); if (el && diff > 50) { closeAllSwipes(); el.classList.add('swiped'); } else if (el && diff < -50) el.classList.remove('swiped'); }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(e => e.classList.remove('swiped')); }

        function loadCSV() {
            // NOCACHE zorgt dat hij altijd de verse versie van GitHub trekt
            Papa.parse("vragen.csv?nocache=" + new Date().getTime(), {
                download: true, header: false, skipEmptyLines: true,
                complete: function(res) {
                    DATA = res.data.slice(1).map(r => { 
                        if (r.length < 5) return null; 
                        return { 
                            s: String(r[0]).toUpperCase().trim(), 
                            t: String(r[1] || "").trim(), 
                            n: String(r[2] || "").trim(), 
                            q: String(r[3]).trim(), // Exacte overname kolom 4
                            a: String(r[4]).trim(), // Exacte overname kolom 5
                            d: [r[5], r[6], r[7]].filter(x => x && String(x).trim() !== "") // Exacte overname kolom 6,7,8
                        }; 
                    }).filter(i => i !== null);
                    render();
                }
            });
        }
        loadCSV();

        let zoomScale = 1;
        function initZoom() {
            const el = document.querySelector('.skelet-kaart');
            const view = document.querySelector('.map-viewport');
            if(!el || !view) return;
            let initialDist = 0;
            view.addEventListener('touchstart', e => { if (e.touches.length === 2) initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); }, {passive: false});
            view.addEventListener('touchmove', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    let delta = dist / initialDist;
                    zoomScale = Math.min(Math.max(1, zoomScale * delta), 4);
                    initialDist = dist;
                    el.style.transform = `scale(${zoomScale})`;
                }
            }, {passive: false});
        }

        function render() {
            const app = document.getElementById('app');
            if (state.v === 'landing') {
                app.innerHTML = `<div class="glass p-8 text-center mt-10"><h1 class="text-5xl font-black italic text-yellow-400 mb-2 uppercase tracking-tighter">Massine's</h1><h2 class="text-2xl font-black italic text-white mb-10 uppercase tracking-widest">Challenge</h2><button onclick="state.v='menu'; render();" class="fn-button bg-yellow-400 text-black py-8 px-12 text-2xl w-full">START GAME</button></div>`;
            } else if (state.v === 'menu') {
                const subs = [...new Set(DATA.map(i => i.s))].sort();
                app.innerHTML = `<div class="glass p-6 text-center"><h1 class="text-3xl text-yellow-400 font-black italic mb-6 uppercase">Missions</h1><button onclick="state.v='boss';render()" class="fn-button w-full bg-red-600 py-6 mb-8 text-xl flex items-center justify-center gap-3 shadow-lg"><span>🔥 BOSS LEVEL</span><span class="bg-black/20 px-3 py-1 rounded-full text-sm font-mono">${state.errs.length}</span></button><div class="grid grid-cols-2 gap-4">${subs.map(sub => `<button onclick="state.sub='${sub}';state.v='categories';render()" class="fn-button bg-white/10 py-12 text-xl border border-white/5 uppercase tracking-tighter flex flex-col items-center gap-2"><span>${sub==='FRANS'?'🇫🇷':(sub==='WO'?'🌍':'📚')}</span><span>${sub}</span></button>`).join('')}</div></div>`;
            } else if (state.v === 'categories') {
                const cleanCats = [...new Set(DATA.filter(i => i.s === state.sub).map(i => cleanCategory(i.t)))].sort();
                app.innerHTML = `<div class="glass p-6 text-center"><div class="flex justify-between items-center mb-6"><button onclick="state.v='menu';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-[10px]">← BACK</button><span class="font-black italic text-yellow-400 uppercase tracking-widest text-sm">${state.sub}</span></div><div class="grid grid-cols-1 gap-4">${cleanCats.map(cat => {
                    const lid = 'cat-' + Math.random().toString(36).substr(2, 5);
                    const action = (state.sub === 'FRANS') ? `startDirectQuiz('${state.sub}', '${cat}')` : `state.cat='${cat}';state.v='lessons';render()`;
                    return `<div class="swipe-container" id="cont-${lid}"><div class="swipe-actions"><button onclick="event.stopPropagation(); DATA.filter(i=>i.s===state.sub&&cleanCategory(i.t)==='${cat}').forEach(q=>delete state.progress[q.q]); save(); render();" class="btn-reset-red">RESET</button></div><div class="swipe-main" ontouchstart="startX=event.touches[0].clientX" ontouchmove="handleTM(event, '${lid}')"><button onclick="${action}" class="fn-button w-full bg-white/10 py-8 text-xl border border-white/5 uppercase italic tracking-widest text-yellow-400">${cat}</button></div></div>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'lessons') {
                const lessons = [...new Set(DATA.filter(i => i.s === state.sub && cleanCategory(i.t) === state.cat).map(i => i.n))];
                app.innerHTML = `<div class="glass p-4 min-h-[70vh]"><div class="flex justify-between items-center mb-6 px-2"><button onclick="state.v='categories';render()" class="bg-yellow-400 text-black px-4 py-2 font-black italic uppercase text-[10px]">← BACK</button><span class="font-black italic text-yellow-400 uppercase tracking-widest text-sm">${state.cat}</span></div><div class="grid grid-cols-2 gap-3">${lessons.map(n => {
                    const lessonQs = DATA.filter(i => i.s === state.sub && cleanCategory(i.t) === state.cat && i.n === n);
                    const attCount = lessonQs.filter(q => state.progress[q.q]).length;
                    const lid = 'les-' + Math.random().toString(36).substr(2, 5);
                    return `<div class="swipe-container" id="cont-${lid}"><div class="swipe-actions"><button onclick="event.stopPropagation(); DATA.filter(i=>i.s===state.sub&&cleanCategory(i.t)===state.cat&&i.n==='${n}').forEach(q=>delete state.progress[q.q]); save(); render();" class="btn-reset-red">RESET</button></div><div class="swipe-main" ontouchstart="startX=event.touches[0].clientX" ontouchmove="handleTM(event, '${lid}')"><button onclick="startSpecificQ('${state.sub}', '${state.cat}', '${n}')" class="fn-button w-full h-24 bg-white/10 flex flex-col items-center justify-center border border-white/5 relative">${n.includes("KAART")?'<span class="text-3xl mb-1">💀</span>':''}<span class="text-[10px] text-center px-1 leading-tight uppercase font-black italic">${n}</span><span class="text-[8px] font-mono opacity-40 absolute bottom-1">${attCount}/${lessonQs.length}</span></button></div></div>`;
                }).join('')}</div></div>`;
            } else if (state.v === 'quiz') {
                const q = state.items[0];
                const showMap = q.n.toUpperCase().includes("KAART");
                const progress = ((state.total - state.items.length) / state.total) * 100;
                
                app.innerHTML = `<div class="glass p-4 quiz-container">
                    <div class="flex justify-between font-black text-yellow-400 mb-2 uppercase text-[10px] tracking-widest"> <button onclick="state.v='categories';render()" class="text-red-500 border border-red-500 px-2">← EXIT</button> <span>${state.total - state.items.length}/${state.total}</span></div>
                    <div class="prog-bar-container mb-3"><div class="prog-bar-fill" style="width: ${progress}%"></div></div>
                    ${showMap ? `<div class="map-viewport"><img src="${skeletUrl}" class="skelet-kaart" /></div>` : ''}
                    <div class="question-box text-center mb-4">
                        <h2 class="text-2xl font-black italic uppercase leading-tight">${q.q}</h2>
                        <div class="mt-3 py-4 bg-yellow-400 rounded-xl mega-instruction flex items-center justify-center px-2"><p class="text-3xl font-black text-black uppercase tracking-tighter text-center leading-none">KIES</p></div>
                    </div>
                    <div class="grid gap-3 mb-6">${q.opts.map(o => `<button onclick="check('${o}')" class="fn-button py-4 text-sm px-2 flex items-center justify-center text-center ${state.status!=='idle'?(o===q.a?'btn-correct':(o===state.sel?'btn-wrong':'opacity-20')):'bg-white/5 border border-white/10'}">${o}</button>`).join('')}</div><div id="next-anchor" class="min-h-[80px] text-center">${state.status !== 'idle' ? `<button onclick="next()" class="fn-button w-full bg-white text-black py-6 text-xl shadow-2xl">VOLGENDE →</button>` : ''}</div>
                </div>`;
                if(showMap) setTimeout(initZoom, 100);
            }
        }

        function startSpecificQ(sub, cat, lesson) { const items = DATA.filter(i => i.s === sub && cleanCategory(i.t) === cat && i.n === lesson); prepareQuiz(items, sub, cat, lesson); }
        function startDirectQuiz(sub, cat) { const items = DATA.filter(i => i.s === sub && cleanCategory(i.t) === cat); prepareQuiz(items, sub, cat, cat); }
        function prepareQuiz(items, sub, cat, lesson) {
            state.items = items.map(i => {
                let opts = [i.a, ...i.d].sort(()=>Math.random()-0.5);
                return {...i, opts: opts};
            }).sort(()=>Math.random()-0.5);
            state.total = state.items.length; state.v = 'quiz'; state.sub = sub; state.cat = cat; state.status = 'idle'; state.sel = null; render();
        }

        function check(o) { if(state.status !== 'idle') return; state.sel = o; const q = state.items[0]; if(o === q.a) { state.status = 'correct'; playSound(660, 'sine', 0.15); confetti({particleCount:30, origin:{y:0.8}}); } else { state.status = 'wrong'; playSound(150, 'sawtooth', 0.3); if(!state.errs.some(i => i.q === q.q)) state.errs.push(q); } save(); render(); }
        function next() { state.items.shift(); state.status = 'idle'; state.sel = null; if(!state.items.length) { state.v = 'categories'; } render(); }
        render();
    </script>
</body>
</html>
