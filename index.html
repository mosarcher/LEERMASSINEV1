<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V11.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        :root { --safe-top: env(safe-area-inset-top); }
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; }
        
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat; transition: background-image 0.6s ease-in-out; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10, 5, 26, 0.05) 0%, rgba(10, 5, 26, 0.4) 100%); z-index: -1; }

        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; margin-top: var(--safe-top); }
        .text-header { font-weight: 900; font-style: italic; text-transform: uppercase; transform: skewX(-8deg); }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; -webkit-overflow-scrolling: touch; }
        
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: transform 0.2s ease, background 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; z-index: 2; border: none; }
        
        .swipe-container { position: relative; width: 100%; height: clamp(50px, 8vh, 60px); margin-bottom: 6px; overflow: hidden; flex-shrink: 0; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 1; opacity: 0; transition: opacity 0.2s; }
        .swiped .swipe-actions { opacity: 1; }
        
        .action-btn { height: 100%; padding: 0 15px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.7rem; color: white; border: none; }
        .btn-reset { background: #3b82f6; }
        .btn-delete { background: #ef4444; }

        .boss-button { background: linear-gradient(90deg, #b45309 0%, #f59e0b 50%, #b45309 100%); color: white; border: 1px solid #fde047; }
        .lesson-button { background: rgba(255, 255, 255, 0.15); border-left: 6px solid #eab308; }
        
        .swiped .fn-button { transform: translateX(-140px); }
        .title-glow { text-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 25px rgba(234, 179, 8, 0.5); }
        .version-tag { position: fixed; bottom: 5px; right: 10px; font-size: 10px; opacity: 0.3; font-weight: 900; pointer-events: none; }

        .back-btn { width: auto !important; padding: 0 12px !important; height: 32px !important; font-size: 0.65rem !important; }
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* Quiz UI Optimization */
        .quiz-q-text { font-size: clamp(1.2rem, 5vh, 2.5rem); line-height: 1.1; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .quiz-next-btn { height: 50px !important; margin-top: 10px; font-size: 1.1rem !important; background: #eab308; color: black; box-shadow: 0 4px 0 #a16207; }
    </style>
</head>
<body id="mainBody" onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>
    <div class="version-tag">v11.5</div>

    <script>
        const images = ["massinewall.png", "massinewall1.png", "massinewall2.png", "massinewall3.png", "massinewall4.png"];
        let lastImage = "";
        
        function changeBackground(isInitial = false) {
            let selectedImg = isInitial ? "massinewall.png" : images.filter(img => img !== lastImage)[Math.floor(Math.random() * (images.length - 1))];
            lastImage = selectedImg;
            document.getElementById('bg-container').style.backgroundImage = `url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/${selectedImg}')`;
        }
        
        function navigate(newView) { changeBackground(); state.view = newView; render(); }
        window.addEventListener('load', () => { changeBackground(true); render(); });

        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'), 
            scriptUrl: localStorage.getItem('script_url') || '', 
            selectedSubject: '', status: 'idle' 
        };

        let startX = 0;
        function handleTouchStart(e) { startX = e.touches[0].clientX; }
        function handleTouchMove(e, id) {
            const currentX = e.touches[0].clientX;
            const diff = startX - currentX;
            const el = document.getElementById(id).parentElement;
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); }
            else if (diff < -50) { el.classList.remove('swiped'); }
        }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container').forEach(el => el.classList.remove('swiped')); }
        
        function handleBtnClick(e, action, id) {
            const el = document.getElementById(id).parentElement;
            if (el.classList.contains('swiped')) { e.stopPropagation(); el.classList.remove('swiped'); return; }
            eval(action);
        }

        function deleteQuestionFromApp() {
            const currentQ = state.quizItems[0];
            state.quizItems.shift(); state.totalQuestions--;
            state.lessons.forEach(l => { l.items = l.items.filter(item => item.word !== currentQ.word); });
            localStorage.setItem('study_data_v7', JSON.stringify(state.lessons));
            if (state.quizItems.length === 0) navigate('subjects'); else { state.status = 'idle'; render(); }
        }

        function executeReset(s, t, n) {
            state.lessons.forEach(l => { if (l.subject === s && l.theme === t && (!n || l.name === n)) l.items.forEach(i => i.alreadyFailed = false); });
            localStorage.setItem('study_data_v7', JSON.stringify(state.lessons));
            closeAllSwipes(); render();
        }

        function executeDelete(s, t, n) {
            state.lessons = state.lessons.filter(l => !(l.subject === s && l.theme === t && (!n || l.name === n)));
            localStorage.setItem('study_data_v7', JSON.stringify(state.lessons));
            closeAllSwipes(); render();
        }

        function createSwipeRow(label, btnClass, clickAction, isQuiz = false, s, t, n) {
            const id = `btn-${Math.random().toString(36).substr(2, 5)}`;
            return `
                <div class="swipe-container" onclick="event.stopPropagation()">
                    <div class="swipe-actions">
                        ${isQuiz ? `<button onclick="deleteQuestionFromApp()" class="action-btn btn-delete">WISSEN</button>` : `
                        <button onclick="executeReset('${s}', '${t}', ${n ? `'${n}'` : 'null'})" class="action-btn btn-reset">RESET</button>
                        <button onclick="executeDelete('${s}', '${t}', ${n ? `'${n}'` : 'null'})" class="action-btn btn-delete">WISSEN</button>`}
                    </div>
                    <button id="${id}" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event, '${id}')"
                        onclick="handleBtnClick(event, \`${clickAction}\`, '${id}')" class="fn-button ${btnClass}">${label}</button>
                </div>`;
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="title-glow text-header text-5xl sm:text-8xl mb-8 leading-tight">MASSINE'S CHALLENGE</h1>
                    <button onclick="handleStart()" class="fn-button bg-yellow-400 text-black text-3xl sm:text-6xl px-10 py-6 mx-auto italic">START</button>
                    <button onclick="setCloudUrl()" style="position:fixed; bottom:15px; left:50%; transform:translateX(-50%); opacity:0.15;">⚙️</button></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-3 max-w-xl"><h2 class="text-header text-2xl text-yellow-400 mb-4 text-center title-glow italic">MISSIONS</h2>
                    <div class="scroll-area flex flex-col gap-3">
                        <div class="swipe-container h-[70px]"><button onclick="navigate('boss_selection')" class="fn-button boss-button text-2xl italic">🔥 BOSS LEVELS 🔥</button></div>
                        <div class="subject-grid">
                            ${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedSubject='${s.toUpperCase()}'; navigate('lessons');" class="fn-button bg-white/20 border-l-[6px] border-yellow-400 text-xl py-6 italic">${s}</button>`).join('')}
                        </div>
                    </div></div>`;
            } else if (state.view === 'boss_selection') {
                container.innerHTML = `<div class="glass p-3 max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('subjects');" class="bg-yellow-400 text-black fn-button back-btn italic">← BACK</button><h2 class="text-header text-xl text-white title-glow">SELECT VAK</h2></div>
                    <div class="scroll-area grid grid-cols-2 gap-3">${['Frans', 'Taal', 'WO'].map(s => `<button onclick="state.selectedBossSubject='${s.toUpperCase()}'; navigate('boss_themes');" class="fn-button bg-white/10 border-l-[6px] border-yellow-400 text-lg py-6 italic">${s}</button>`).join('')}</div></div>`;
            } else if (state.view === 'boss_themes') {
                const themes = [...new Set(state.lessons.filter(l => l.subject === state.selectedBossSubject).map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('boss_selection');" class="bg-yellow-400 text-black fn-button back-btn italic">← BACK</button><h2 class="text-header text-lg text-white title-glow italic">${state.selectedBossSubject}</h2></div>
                    <div class="scroll-area">${themes.map(t => createSwipeRow(t, 'bg-red-600/20 border-l-[6px] border-red-600 text-lg py-6 italic', `startThemeBoss('${state.selectedBossSubject}', '${t}')`, false, state.selectedBossSubject, t)).join('')}</div></div>`;
            } else if (state.view === 'lessons') {
                const filtered = state.lessons.filter(l => l.subject === state.selectedSubject);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 max-w-xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('subjects');" class="bg-yellow-400 text-black fn-button back-btn italic">← BACK</button><h2 class="text-header text-lg text-white italic">${state.selectedSubject}</h2></div>
                    <div class="scroll-area">
                        ${themes.map(t => `<div class="mb-4"><h3 class="bg-yellow-400 text-black font-black text-[10px] mb-2 px-2 py-0.5 uppercase italic inline-block skew-x-[-10deg]">${t}</h3>
                            ${filtered.filter(l => l.theme === t).map(l => createSwipeRow(l.name, 'lesson-button text-lg py-5 italic', `startLesson('${l.subject}','${l.theme}','${l.name}')`, false, l.subject, l.theme, l.name)).join('')}
                        </div>`).join('')}
                    </div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl h-full sm:h-auto"><div class="flex justify-between items-center mb-3 flex-shrink-0"><button onclick="navigate('lessons');" class="text-red-600 bg-black/40 px-2 py-1 rounded font-black text-[10px] uppercase italic">STOP</button>
                    <div class="h-2 flex-1 mx-3 bg-black/20 rounded-full overflow-hidden"><div class="h-full bg-yellow-400" style="width: ${((state.totalQuestions - state.quizItems.length) / state.totalQuestions) * 100}%"></div></div>
                    <span class="text-header text-xl text-yellow-400 font-black italic">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div>
                    <div class="scroll-area flex flex-col"><h2 class="text-header quiz-q-text text-center">${q.word}</h2>
                        <div class="flex flex-col">${q.options.map(opt => createSwipeRow(opt, `text-lg border-2 italic font-black ${state.status !== 'idle' ? (opt === q.correct ? 'bg-green-600 border-white shadow-lg' : (opt === state.selected ? 'bg-red-600 border-white' : 'opacity-20')) : 'bg-white/10 border-white/10'}`, `checkAnswer('${opt}')`, true)).join('')}</div>
                        ${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="quiz-next-btn fn-button italic">NEXT →</button>` : ''}
                    </div></div>`;
            } else if (state.view === 'result') {
                container.innerHTML = `<div class="glass p-8 flex flex-col items-center justify-center text-center w-full border-2 border-yellow-400 shadow-2xl">
                    <h1 class="text-header text-4xl mb-4 text-yellow-400 title-glow italic uppercase">CLEARED!</h1>
                    <div class="text-2xl font-black text-white/80 mb-8 italic">SCORE: ${state.percent}%</div>
                    <button onclick="navigate('subjects');" class="fn-button bg-yellow-400 text-black text-2xl px-12 py-6 italic">CONTINUE</button></div>`;
            }
        }

        async function handleStart() { if (state.lessons.length > 0) { navigate('subjects'); fetchCloudData(false); } else { state.isLoading = true; render(); await fetchCloudData(true); } }
        async function fetchCloudData(shouldNavigate) { if (!state.scriptUrl) return; try { const response = await fetch(state.scriptUrl); const data = await response.json(); if (data.lessons) { state.lessons = data.lessons; localStorage.setItem('study_data_v7', JSON.stringify(data.lessons)); } state.isLoading = false; if (shouldNavigate) navigate('subjects'); else render(); } catch(e) { state.isLoading = false; render(); } }
        function checkAnswer(opt) { if (state.status !== 'idle') return; state.selected = opt; const q = state.quizItems[0]; const isCorrect = opt === q.correct; if (isCorrect) { if (!q.alreadyFailed) state.firstTryCorrect++; } else { q.alreadyFailed = true; } state.status = isCorrect ? 'correct' : 'wrong'; render(); }
        function nextQuestion() { const completedQ = state.quizItems.shift(); if (state.status === 'wrong') state.quizItems.push(completedQ); if (state.quizItems.length === 0) { state.percent = Math.round((state.firstTryCorrect / state.totalQuestions) * 100); saveAction({ type: "RESULT", subject: state.currentLesson.subject, theme: state.currentLesson.theme, name: state.currentLesson.name, percent: state.percent }); confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); navigate('result'); } else { state.status = 'idle'; render(); } }
        async function saveAction(payload) { if (state.scriptUrl) fetch(state.scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); }
        function startLesson(s,t,n) { state.currentLesson = state.lessons.find(l => l.subject===s && l.theme===t && l.name===n); state.quizItems = [...state.currentLesson.items].sort(() => Math.random() - 0.5); state.totalQuestions = state.quizItems.length; state.firstTryCorrect = 0; state.status = 'idle'; navigate('quiz'); }
        function startThemeBoss(subject, theme) { const items = state.lessons.filter(l => l.subject === subject && l.theme === theme).flatMap(l => l.items); state.currentLesson = { name: theme, subject, theme, items }; state.quizItems = [...items].sort(() => Math.random() - 0.5); state.totalQuestions = items.length; state.firstTryCorrect = 0; state.status = 'idle'; navigate('quiz'); }
        function setCloudUrl() { const url = prompt("Google Web App URL:", state.scriptUrl); if (url) { state.scriptUrl = url; localStorage.setItem('script_url', url); fetchCloudData(true); } }
    </script>
</body>
</html>
