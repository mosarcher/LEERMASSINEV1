<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASSINE'S CHALLENGE V17.6</title>
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a051a; color: white; margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; transition: background-image 0.4s; background-image: url('https://raw.githubusercontent.com/mosarcher/LEERMASSINEV1/main/massinewall.png'); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,5,26,0.1), rgba(10,5,26,0.6)); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; width: 100%; max-height: 98%; border-radius: 1.5rem; padding: 5px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 5px; -webkit-overflow-scrolling: touch; }
        .fn-button { clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); transition: all 0.2s; text-transform: uppercase; font-weight: 900; font-style: italic; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: none; touch-action: manipulation; position: relative; overflow: hidden; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: rgba(20, 10, 40, 0.9); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 2rem; padding: 2rem; width: 100%; max-width: 400px; text-align: center; }
        .btn-correct-full { background-color: #00ff00 !important; color: black !important; border: 4px solid white !important; transform: scale(1.05); z-index: 20; }
        .btn-wrong-hard { background-color: #ff0000 !important; color: white !important; border: 4px solid white !important; animation: hard-shake 0.4s ease-in-out; }
        .btn-dimmed { opacity: 0.05 !important; }
        @keyframes hard-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-12px); } 80% { transform: translateX(12px); } }
        .swipe-container { position: relative; width: 100%; height: 60px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; flex-shrink: 0; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; z-index: 50; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .swiped .swipe-actions { opacity: 1; pointer-events: auto; }
        .action-btn { height: 100%; padding: 0 15px; font-weight: 900; font-size: 0.7rem; color: white; border: none; text-transform: uppercase; cursor: pointer; }
        .btn-reset { background: #3b82f6; }
        .swiped .fn-button, .swiped .lesson-inner, .swiped .theme-inner { transform: translateX(-100px); }
        .stats-tag { position: absolute; bottom: 6px; right: 12px; font-size: 0.6rem; font-weight: 900; display: flex; gap: 8px; opacity: 0.8; }
        .theme-label { background: #eab308; color: black; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 1.2rem; text-transform: uppercase; font-style: italic; display: inline-block; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); width: 100%; text-align: center; }
        .lesson-inner { transition: transform 0.2s; width: 100%; height: 100%; }
        .theme-swipe-box { position: relative; width: 100%; overflow: hidden; margin-bottom: 0.6rem; touch-action: pan-y; }
        .theme-inner { transition: transform 0.2s; display: block; }
    </style>
</head>
<body id="mainBody" onclick="closeAllSwipes()">
    <div id="bg-container"></div>
    <div class="overlay"></div>
    <div id="app" class="h-full w-full flex items-center justify-center p-2"></div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content text-white">
            <h3 id="modalTitle" class="text-xl font-black italic uppercase mb-4">RESET?</h3>
            <p id="modalText" class="mb-6 opacity-80 italic">Weet je het zeker?</p>
            <div class="flex gap-4">
                <button onclick="closeModal()" class="fn-button bg-white/20 py-3 italic">NEE</button>
                <button id="modalConfirmBtn" class="fn-button bg-red-600 py-3 italic">JA</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = { scriptUrl: 'https://script.google.com/macros/s/AKfycbwG44NuJL67bxpBis12eetkybW0DKG4AAN3jq0lz7XB2oZMrgdv9NY2kaK4KdvWlfsk/exec' };
        let state = { 
            view: 'start', 
            lessons: JSON.parse(localStorage.getItem('study_data_v7') || '[]'), 
            stats: JSON.parse(localStorage.getItem('lesson_stats_v1') || '{}'),
            wrongCounts: JSON.parse(localStorage.getItem('wrong_counts_v1') || '{}'),
            selectedSubject: '', status: 'idle', selected: null 
        };

        window.handleCloudData = function(d) { 
            if (d.lessons) { 
                state.lessons = d.lessons; 
                localStorage.setItem('study_data_v7', JSON.stringify(d.lessons)); 
                render(); 
            } 
        };

        function fetchCloudData() { 
            const script = document.createElement('script'); 
            script.src = CONFIG.scriptUrl + `?prefix=handleCloudData&t=${Date.now()}`; 
            document.body.appendChild(script); 
        }

        function navigate(v) { 
            state.view = v; 
            if (v === 'subjects') fetchCloudData();
            render(); 
        }

        function checkAnswer(opt) {
            if (state.status !== 'idle') return;
            state.selected = opt; const q = state.quizItems[0]; const isCorrect = (opt === q.correct);
            state.status = isCorrect ? 'correct' : 'wrong';
            const key = `${state.currentLesson.subject.toUpperCase()}-${state.currentLesson.theme}-${state.currentLesson.name}`;
            if (!state.stats[key]) state.stats[key] = { correct: 0, wrong: 0 };
            if (isCorrect) { state.stats[key].correct++; } 
            else { state.stats[key].wrong++; const wordId = `${state.currentLesson.subject.toUpperCase()}|${q.word}`; state.wrongCounts[wordId] = (state.wrongCounts[wordId] || 0) + 1; localStorage.setItem('wrong_counts_v1', JSON.stringify(state.wrongCounts)); }
            localStorage.setItem('lesson_stats_v1', JSON.stringify(state.stats)); render();
        }

        function nextQuestion() {
            state.quizItems.shift(); state.status = 'idle'; state.selected = null;
            if (state.quizItems.length === 0) { navigate('lessons'); } else { render(); }
        }

        function startLesson(s,t,n) {
            const sub = s.toUpperCase();
            const lesson = state.lessons.find(l => l.subject.toUpperCase() === sub && l.theme === t && l.name === n);
            if (!lesson) return;
            state.currentLesson = { subject: sub, theme: t, name: n };
            state.quizItems = [...lesson.items].sort(() => Math.random() - 0.5);
            state.totalQuestions = state.quizItems.length; state.status = 'idle'; state.selected = null;
            navigate('quiz');
        }

        function executeResetSingle(s,t,n) {
            openModal("LES RESET", `Score wissen?`, () => {
                const key = `${s.toUpperCase()}-${t}-${n}`;
                state.stats[key] = { correct: 0, wrong: 0 };
                localStorage.setItem('lesson_stats_v1', JSON.stringify(state.stats)); render();
            });
        }

        function executeResetTheme(subject, theme) {
            openModal("THEMA RESET", `Thema score wissen?`, () => {
                const sub = subject.toUpperCase();
                state.lessons.filter(l => l.subject.toUpperCase() === sub && l.theme === theme).forEach(l => {
                    state.stats[`${sub}-${l.theme}-${l.name}`] = { correct: 0, wrong: 0 };
                });
                localStorage.setItem('lesson_stats_v1', JSON.stringify(state.stats)); render();
            });
        }

        function openModal(title, text, confirmAction) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalConfirmBtn').onclick = () => { confirmAction(); closeModal(); };
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('customModal').style.display = 'none'; }
        function closeAllSwipes() { document.querySelectorAll('.swipe-container, .theme-swipe-box').forEach(el => el.classList.remove('swiped')); }
        function handleTouchStart(e) { window.startX = e.touches[0].clientX; }
        function handleTouchMove(e, id) { 
            const diff = window.startX - e.touches[0].clientX; 
            const el = document.getElementById(id).parentElement; 
            if (diff > 50) { closeAllSwipes(); el.classList.add('swiped'); } 
            else if (diff < -50) el.classList.remove('swiped'); 
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `<div class="text-center"><h1 class="text-5xl mb-8 font-black italic">MASSINE'S CHALLENGE</h1><button onclick="navigate('subjects')" class="fn-button bg-yellow-400 text-black text-3xl px-10 py-6 mx-auto italic">START</button></div>`;
            } else if (state.view === 'subjects') {
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><h2 class="text-2xl text-yellow-400 mb-4 text-center italic font-black uppercase">Missions</h2><div class="scroll-area grid grid-cols-1 gap-3">
                    <button onclick="navigate('boss_selection')" class="fn-button bg-orange-600 text-white text-2xl py-8 italic shadow-lg">🔥 BOSS LEVELS 🔥</button>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="state.selectedSubject='FRANS'; navigate('lessons');" class="fn-button bg-white/20 py-6 italic">🇫🇷 Frans</button>
                        <button onclick="state.selectedSubject='TAAL'; navigate('lessons');" class="fn-button bg-white/20 py-6 italic">🇳🇱 Taal</button>
                        <button onclick="state.selectedSubject='WO'; navigate('lessons');" class="fn-button bg-white/20 py-6 italic col-span-2">🌍 WO</button>
                    </div>
                </div></div>`;
            } else if (state.view === 'lessons') {
                const sub = state.selectedSubject.toUpperCase();
                const filtered = state.lessons.filter(l => l.subject.toUpperCase() === sub);
                const themes = [...new Set(filtered.map(l => l.theme))];
                container.innerHTML = `<div class="glass p-3 w-full max-w-xl"><div class="flex items-center justify-between mb-4 px-2"><button onclick="navigate('subjects')" class="bg-yellow-400 text-black fn-button px-4 py-2 italic font-black">← BACK</button><h2 class="text-xl italic uppercase font-black">${sub}</h2><div style="width:80px"></div></div><div class="scroll-area">
                    ${themes.length === 0 ? '<div class="text-center py-10 opacity-50 italic">Data laden... Een moment.</div>' : themes.map(t => {
                        const tid = `t-${Math.random().toString(36).substr(2, 5)}`;
                        return `<div class="theme-swipe-box"><div class="swipe-actions"><button onclick="executeResetTheme('${sub}','${t}')" class="action-btn btn-reset">RESET</button></div><div id="${tid}" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event, '${tid}')" class="theme-inner"><h3 class="theme-label mb-2">${t}</h3></div></div>` + filtered.filter(l => l.theme === t).map(l => {
                            const cpKey = `${sub}-${l.theme}-${l.name}`; const st = state.stats[cpKey] || { correct: 0, wrong: 0 };
                            const lid = `l-${Math.random().toString(36).substr(2, 5)}`;
                            return `<div class="swipe-container"><div class="swipe-actions"><button onclick="executeResetSingle('${sub}','${l.theme}','${l.name}')" class="action-btn btn-reset">RESET</button></div><div id="${lid}" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event, '${lid}')" class="lesson-inner"><button onclick="startLesson('${sub}','${l.theme}','${l.name}')" class="fn-button bg-white/10 text-lg py-5 italic text-left pl-6 relative"><span>${l.name}</span><div class="stats-tag text-white"><span>✅ ${st.correct}</span><span>❌ ${st.wrong}</span></div></button></div></div>`}).join('')
                    }).join('')}</div></div>`;
            } else if (state.view === 'quiz') {
                const q = state.quizItems[0];
                container.innerHTML = `<div class="glass p-3 w-full max-w-4xl"><div class="flex justify-between items-center mb-3"><button onclick="navigate('lessons')" class="text-red-600 bg-black/40 px-2 py-1 rounded font-black text-[10px] italic uppercase">STOP</button><span class="text-xl text-yellow-400 font-black">${state.totalQuestions - state.quizItems.length + 1}/${state.totalQuestions}</span></div><div class="flex flex-col items-center"><h2 class="text-3xl text-center mb-8 font-black italic uppercase text-white">${q.word}</h2><div class="w-full flex flex-col gap-2">${q.options.map(opt => { let cl = "bg-white/10 text-white"; if (state.status !== 'idle') { if (opt === q.correct) cl = "bg-green-500 text-black"; else if (opt === state.selected) cl = "bg-red-600 text-white"; else cl = "opacity-10"; } return `<button onclick="checkAnswer('${opt}')" class="fn-button p-4 text-lg italic font-black h-[60px] ${cl}">${opt}</button>`}).join('')}</div>${state.status !== 'idle' ? `<button onclick="nextQuestion()" class="mt-4 h-12 w-full bg-yellow-400 text-black fn-button italic font-black">NEXT →</button>` : ''}</div></div>`;
            }
        }
        render();
    </script>
</body>
</html>
