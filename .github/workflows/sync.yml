name: Sync Google Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download Data
        run: curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA7MUx5TsNqqMxQua7ieWURRHXrxlMn_j4M96pmerRHmCoRe9D-TKQ-kkuNIeeWzBsoJt5aF4ZXTkt/pub?output=csv" -o data.csv

      - name: Convert to JS
        run: |
          node -e "
          const fs = require('fs');
          const csv = fs.readFileSync('data.csv', 'utf8');
          const lines = csv.split(/\r?\n/).filter(l => l.trim().length > 0);
          
          // Haal de koppen op en maak ze schoon
          const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['\"]/g, ''));
          
          // Zoek de index van elke kolom (zo maakt de volgorde niet uit)
          const idx = {
            subject: headers.findIndex(h => h.includes('subject') || h.includes('vak')),
            theme: headers.findIndex(h => h.includes('theme') || h.includes('thema')),
            lesson: headers.findIndex(h => h.includes('lesson') || h.includes('les')),
            question: headers.findIndex(h => h.includes('vraag') || h.includes('question') || h.includes('woord')),
            answer: headers.findIndex(h => h.includes('antwoord') || h.includes('answer') || h.includes('correct')),
            fouten: headers.findIndex(h => h.includes('fout') || h.includes('distractor'))
          };

          const lessons = {};

          lines.slice(1).forEach(line => {
            const c = line.split(/,(?=(?:(?:[^'\"]*\"[^'\"]*\"){2})*[^'\"]*$)/).map(x => x.replace(/^\"|\"$/g, '').trim());
            
            // Controleer of we minimaal een vraag en antwoord hebben
            if(c[idx.question] && c[idx.answer]) {
              const subject = (c[idx.subject] || 'ALGEMEEN').toUpperCase();
              const theme = c[idx.theme] || 'Thema';
              const name = c[idx.lesson] || 'Les';
              const key = subject + '-' + theme + '-' + name;
              
              if(!lessons[key]) {
                lessons[key] = { subject, theme, name, items: [] };
              }
              
              const correct = c[idx.answer];
              const distractors = c[idx.fouten] ? c[idx.fouten].split('|') : [];
              const options = [correct, ...distractors].sort(() => Math.random() - 0.5).slice(0, 4);
              
              lessons[key].items.push({ word: c[idx.question], correct: correct, options: options });
            }
          });

          const finalData = Object.values(lessons);
          fs.writeFileSync('data.js', 'window.MY_DATA = ' + JSON.stringify(finalData, null, 2) + ';');
          console.log('Aantal lessen gevonden: ' + finalData.length);
          "

      - name: Push update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m "Lessen bijgewerkt" || exit 0
          git push
