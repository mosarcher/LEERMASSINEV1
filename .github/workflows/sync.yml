name: Sync Google Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download Data
        run: curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA7MUx5TsNqqMxQua7ieWURRHXrxlMn_j4M96pmerRHmCoRe9D-TKQ-kkuNIeeWzBsoJt5aF4ZXTkt/pub?output=csv" -o data.csv

      - name: Convert to JS
        run: |
          node -e "
          const fs = require('fs');
          const csv = fs.readFileSync('data.csv', 'utf8');
          const lines = csv.split(/\r?\n/).filter(line => line.trim() !== '');
          const lessons = {};

          lines.slice(1).forEach(line => {
            const c = line.split(/,(?=(?:(?:[^'\"]*\"[^'\"]*\"){2})*[^'\"]*$)/).map(x => x.replace(/^\"|\"$/g, '').trim());
            if(c.length >= 7 && c[5] && c[6]) {
              const subject = (c[0] || 'ALGEMEEN').toUpperCase();
              const theme = c[1] || 'Thema';
              const name = c[2] || 'Les';
              const key = subject + '-' + theme + '-' + name;
              if(!lessons[key]) {
                lessons[key] = { subject, theme, name, items: [] };
              }
              const correct = c[6];
              let distractors = c[7] ? c[7].split('|').map(x => x.trim()).filter(x => x !== '') : [];
              lessons[key].items.push({ 
                word: c[5], 
                correct: correct, 
                distractors: distractors 
              });
            }
          });
          fs.writeFileSync('data.js', 'window.MY_DATA = ' + JSON.stringify(Object.values(lessons), null, 2) + ';');
          "

      - name: Push update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m "Lessen bijgewerkt via Google Sheet" || exit 0
          git push origin main --force
