name: Sync Google Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download Data
        run: curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA7MUx5TsNqqMxQua7ieWURRHXrxlMn_j4M96pmerRHmCoRe9D-TKQ-kkuNIeeWzBsoJt5aF4ZXTkt/pub?output=csv" -o data.csv

      - name: Convert to JS
        run: |
          node -e "
          const fs = require('fs');
          const csv = fs.readFileSync('data.csv', 'utf8');
          const lines = csv.split(/\r?\n/).filter(l => l.trim().length > 0);
          const lessons = {};

          lines.slice(1).forEach(line => {
            // Split op komma, maar negeer komma's tussen aanhalingstekens
            const c = line.split(/,(?=(?:(?:[^'\"]*\"[^'\"]*\"){2})*[^'\"]*$)/).map(x => x.replace(/^\"|\"$/g, '').trim());
            
            // Kolommen: 0:Vak, 1:Thema, 2:Les, 5:Vraag, 6:Antwoord, 7:Foute antwoorden
            if(c[5] && c[6]) {
              const subject = (c[0] || 'ALGEMEEN').toUpperCase();
              const theme = c[1] || 'Thema';
              const name = c[2] || 'Les';
              const key = subject + '-' + theme + '-' + name;
              
              if(!lessons[key]) {
                lessons[key] = { subject, theme, name, items: [] };
              }
              
              const correct = c[6];
              // Haal de foute antwoorden op (gescheiden door |)
              let distractors = c[7] ? c[7].split('|').map(x => x.trim()).filter(x => x !== '') : [];
              
              // Zorg voor 4 opties (1 goede + 3 foute)
              let options = [correct, ...distractors];
              
              lessons[key].items.push({ 
                word: c[5], 
                correct: correct, 
                options: options.sort(() => Math.random() - 0.5).slice(0, 4) 
              });
            }
          });

          fs.writeFileSync('data.js', 'window.MY_DATA = ' + JSON.stringify(Object.values(lessons), null, 2) + ';');
          "

      - name: Push update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m "Lessen bijgewerkt" || exit 0
          git push
